<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    padding: 0 8px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
  }
  .group { display: flex; align-items: center; gap: 4px; flex: none; }
  select { flex: none; }
  .spacer { flex: none; width: 10px; }
  /* Thanh LUÔN một hàng, không xuống dòng: hẹp quá thì fit() thu nhỏ cả thanh theo tỉ lệ bề ngang cửa sổ (tối thiểu 50%). */
  .toolbar-scroll { flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
  /* Rộng đủ: .row không có hộp riêng (display: contents) → tất cả nằm MỘT hàng như cũ. Hẹp hơn: fit() thêm class "two" → 2 hàng cố định
     (hàng 1 = Open…Wrap, hàng 2 = Comment…Lịch sử); nếu 2 hàng vẫn không vừa mới thu nhỏ cả thanh theo tỉ lệ. */
  .row { display: contents; }
  .toolbar-scroll.two { flex-direction: column; align-items: stretch; gap: 4px; }
  .toolbar-scroll.two .row { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; }
  .toolbar-scroll.two > .rowsep { display: none; }
  button { flex: 0 0 auto; }
  /* Chiều cao theo nội dung (không 100% của host) để host đo được và chỉnh WebView2 theo UiScale/DPI. */
  #bar { height: auto; min-height: calc(36px * var(--dens)); padding: calc(4px * var(--dens)) 0; box-sizing: border-box; }
  input.table-input { flex: 1; min-width: 120px; }
  input.where-input { flex: 1.5; min-width: 150px; }
  input.order-input { flex: 1; min-width: 100px; }
</style>
</head>
<body data-area="editor">
  <div class="toolbar-scroll" id="bar">
    <div class="row" id="row1">
    <div class="group">
      <button class="btn" id="btnOpen">Open</button>
      <button class="btn" id="btnSave">Save</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn btn-pill btn-primary" id="btnRun" title="Execute (F5)">▶ Execute</button>
      <button class="btn" id="btnDebugTarget">Debug store/function</button>
      <button class="btn" id="btnDebugStep" data-toggle="debug-step">Debug từng bước</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn" id="btnWriteSchema">Write Schema</button>
      <button class="btn" id="btnCheckFields">Check Fields</button>
      <button class="btn" id="btnBeauty" title="Định dạng câu lệnh SQL (F7 hoặc Ctrl+B)">✨ Beauty</button>
      <label class="check-label" title="Tự động xuống dòng (Alt+Z)">
        <input type="checkbox" id="chkWordWrap" /> Wrap
      </label>
    </div>
    </div>
    <div class="sep rowsep"></div>
    <div class="row" id="row2">
    <div class="group">
      <button class="btn" id="btnComment">Comment</button>
      <button class="btn" id="btnUncomment">Uncomment</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn btn-icon" id="btnOptions" title="Options..."><span class="icon icon-gear"></span></button>
      <select id="defaultTypeSelect" title="Default Type">
        <option value="0">Default Type</option>
        <option value="1">UPPER Keyword</option>
        <option value="2">lower Keyword</option>
      </select>
      <select id="dbSelect" title="Database">
        <option value="0">App Data</option>
        <option value="1">Sys Data</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn active" id="btnSuggest" data-toggle="suggest">Suggest Param/Caret</button>
      <button class="btn active" id="btnResetConn" data-toggle="reset-conn">Reset Connection</button>
      <button class="btn" id="btnResultTab" data-toggle="result-tab">Result Tab</button>
      <button class="btn" id="btnHistory" title="Lịch sử sửa procedure / function / view / trigger">Lịch sử</button>
      <button class="btn" id="btnAskClaude" title="Gửi script (phần chọn, không có thì cả script) sang Claude — script dài tự nén thành file .txt đính kèm">→ Claude</button>
      <button class="btn" id="btnAskGemini" title="Gửi script (phần chọn, không có thì cả script) sang Gemini — script dài tự nén thành file .txt đính kèm">→ Gemini</button>
    </div>
    <div class="spacer"></div>
    </div>
  </div>

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }

  // Báo chiều cao thật của thanh (px thiết bị, đã gồm zoom UiScale + DPI) để host chỉnh chiều cao WebView2 theo đó —
  // thanh tự cao thêm khi nội dung xuống dòng hoặc khi phóng to thay vì bị cắt.
  (function () {
    var bar = document.getElementById('bar'), last = 0;
    // Tỉ lệ = bề ngang có sẵn / bề ngang cần của thanh ở cỡ gốc (tính lại mỗi khi cửa sổ đổi kích thước, kể cả đổi màn hình / UiScale).
    function fit() {
      bar.classList.remove('two'); bar.style.zoom = '';
      var have = bar.clientWidth;
      if (bar.scrollWidth <= have + 1) return;           // vừa trên một hàng
      bar.classList.add('two');                           // không vừa → 2 hàng
      var need = 0;
      bar.querySelectorAll('.row').forEach(function (r) { need = Math.max(need, r.scrollWidth); });
      if (need > have + 1) {
        bar.style.zoom = String(Math.max(0.4, have / need)); // vẫn không vừa → thu nhỏ theo tỉ lệ
      // Chữ ở cỡ nhỏ không co tuyến tính (làm tròn theo từng ký tự): đo lại sau khi zoom và chỉnh thêm cho tới khi không hàng nào còn tràn.
      var z = parseFloat(bar.style.zoom) || 1;
      for (var i = 0; i < 5 && z > 0.4; i++) {
        var over = 1;
        bar.querySelectorAll('.row').forEach(function (r) { over = Math.max(over, r.scrollWidth / Math.max(1, r.clientWidth)); });
        if (over <= 1.001) break;
        z = Math.max(0.4, z / over * 0.99);
        bar.style.zoom = String(z);
      }
      }
    }
    function send() {
      fit();
      var h = Math.ceil(bar.getBoundingClientRect().height * (window.devicePixelRatio || 1));
      if (h && h !== last) { last = h; post({ action: '__height', height: h }); }
    }
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    setTimeout(send, 50);
  })();

  // Ctrl+R: ẩn/hiện khung kết quả của SQL Query (RawSqlControl.ToggleResultPanel); đồng thời chặn "tải lại trang" mặc định của WebView2.
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && (e.key === 'r' || e.key === 'R')) {
      e.preventDefault(); e.stopPropagation();
      window.chrome.webview.postMessage(JSON.stringify({ action: 'toggle-results' }));
    }
  }, true);

  document.getElementById('btnOpen').addEventListener('click', () => post({ action: 'open' }));
  document.getElementById('btnSave').addEventListener('click', () => post({ action: 'save' }));
  document.getElementById('btnRun').addEventListener('click', () => post({ action: 'run' }));
  document.getElementById('btnDebugTarget').addEventListener('click', () => post({ action: 'debug-target' }));
  document.getElementById('btnWriteSchema').addEventListener('click', () => post({ action: 'write-schema' }));
  document.getElementById('btnCheckFields').addEventListener('click', () => post({ action: 'check-fields' }));
  document.getElementById('btnComment').addEventListener('click', () => post({ action: 'comment' }));
  document.getElementById('btnUncomment').addEventListener('click', () => post({ action: 'uncomment' }));
  document.getElementById('btnOptions').addEventListener('click', () => post({ action: 'options' }));
  var btnHist = document.getElementById('btnHistory'); if (btnHist) btnHist.addEventListener('click', () => post({ action: 'history' }));
  ['Claude', 'Gemini'].forEach((n) => { var b = document.getElementById('btnAsk' + n); if (b) b.addEventListener('click', () => post({ action: 'ask-ai', engine: n.toLowerCase() })); });
  document.getElementById('btnBeauty').addEventListener('click', () => post({ action: 'beauty' }));

  document.getElementById('chkWordWrap').addEventListener('change', (e) => {
    post({ action: 'toggle-wrap', value: e.target.checked });
  });
  document.getElementById('defaultTypeSelect').addEventListener('change', function (e) {
    post({ action: 'default-type', value: parseInt(e.target.value, 10) });
    e.target.value = '0'; // one-off transform, not a persistent mode — snaps back like the WinForms combo did
  });
  document.getElementById('dbSelect').addEventListener('change', function (e) {
    post({ action: 'db', value: parseInt(e.target.value, 10) });
  });

  // Every checkable button shares one handler keyed by data-toggle — optimistic local
  // toggle for instant feedback, C# then confirms/corrects via window.setToggle.
  document.getElementById('bar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    btn.classList.toggle('active');
    post({ action: 'toggle', which: btn.getAttribute('data-toggle') });
  });

  // ---- Called from C# (RawSqlControl) ----
  window.setToggle = function (key, on) {
    var btn = document.querySelector('[data-toggle="' + key + '"]');
    if (btn) btn.classList.toggle('active', !!on);
  };

  window.setDatabase = function (index) {
    document.getElementById('dbSelect').value = String(index);
  };

  // Phím tắt hiện hành (Template giao diện → "Phím tắt"): cập nhật chú thích các nút.
  window.applyKeymap = function () {
    var m = window.__bcodeEditorKeys || {};
    var k = function (id, def) { return Object.prototype.hasOwnProperty.call(m, id) ? m[id] : def; };
    var run = [k('editor.run', 'F5'), k('editor.run2', 'Ctrl+Enter')].filter(Boolean).join(' / ');
    document.getElementById('btnRun').title = 'Execute' + (run ? ' (' + run + ')' : '');
    var bt = k('editor.beauty', 'F7'); document.getElementById('btnBeauty').title = 'Định dạng câu lệnh SQL' + (bt ? ' (' + bt + ')' : '');
    var wr = k('editor.wrap', 'Alt+Z'); document.getElementById('chkWordWrap').parentElement.title = 'Tự động xuống dòng' + (wr ? ' (' + wr + ')' : '');
  };
  if (window.__bcodeEditorKeys) window.applyKeymap();

  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  };
</script>
</body>
</html>
