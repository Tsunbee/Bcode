<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body { display: flex; flex-direction: column; background: var(--panel); }
  main { flex: 1; overflow-y: auto; padding: 14px clamp(10px, 3vw, 24px) 8px; }
  h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  section { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 12px; margin-bottom: 10px; }
  section h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 16px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl input { flex: 1; min-width: 0; width: 100%; }
  input[type="text"], input[type="password"] { user-select: text; -webkit-user-select: text; font-family: inherit; font-size: 13px; color: var(--text);
            background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  input[readonly] { opacity: .7; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px clamp(10px, 3vw, 24px); background: var(--panel-alt); border-top: 1px solid var(--border); }
  footer .grow { flex: 1 1 240px; min-width: 0; font-size: 12.5px; line-height: 1.35; }
  #status.err { color: var(--danger); } #status.ok { color: var(--success); }
  .btn-border { border-color: var(--border); }
  footer .actions { display: flex; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<main>
  <h2 id="title">Edit Project</h2>

  <section>
    <h3>Kết nối SQL Server</h3>
    <div class="grid">
      <div class="full"><label for="server">Server Name</label><div class="ctl"><input type="text" id="server" /></div></div>
      <div><label for="user">Login User</label><div class="ctl"><input type="text" id="user" autocomplete="off" /></div></div>
      <div><label for="pass">Password</label>
        <div class="ctl"><input type="password" id="pass" autocomplete="off" /><button class="btn btn-border" id="btnShow" title="Hiện/ẩn mật khẩu">Hiện</button></div></div>
    </div>
  </section>

  <section>
    <h3>Database</h3>
    <div class="grid">
      <div><label for="sysDb">Sys Data</label><div class="ctl"><input type="text" id="sysDb" /></div></div>
      <div><label for="appDb">App Data</label><div class="ctl"><input type="text" id="appDb" /></div></div>
      <div class="full"><label for="dbAccess">DB Access (tự ghép từ Sys Data, App Data)</label><div class="ctl"><input type="text" id="dbAccess" readonly /></div></div>
    </div>
  </section>

  <section>
    <h3>Dự án</h3>
    <div class="grid">
      <div><label for="id">ID</label><div class="ctl"><input type="text" id="id" /></div></div>
      <div><label for="wlink">Login WLink</label><div class="ctl"><input type="text" id="wlink" /></div></div>
    </div>
  </section>

  <section>
    <h3>Đường dẫn</h3>
    <div class="grid">
      <div class="full"><label for="programPath">Program Path</label><div class="ctl"><input type="text" id="programPath" /></div></div>
      <div class="full"><label for="sourcePath">Source Path</label><div class="ctl"><input type="text" id="sourcePath" /></div></div>
      <div class="full"><label for="mobilePath">Mobile Path</label><div class="ctl"><input type="text" id="mobilePath" /></div></div>
      <div class="full"><label for="workingPath">Working Path</label><div class="ctl"><input type="text" id="workingPath" /></div></div>
      <div><label for="registry">Registry Name</label><div class="ctl"><input type="text" id="registry" /></div></div>
    </div>
  </section>
</main>

<footer>
  <button class="btn btn-border" id="btnTest">Test Connection</button>
  <div class="grow" id="status"></div>
  <div class="actions">
    <button class="btn btn-border" id="btnCancel">Cancel</button>
    <button class="btn btn-primary" id="btnOk">OK</button>
  </div>
</footer>

<script>
  const FIELDS = ['server', 'user', 'pass', 'sysDb', 'appDb', 'id', 'wlink', 'programPath', 'sourcePath', 'mobilePath', 'workingPath', 'registry'];
  const $ = (id) => document.getElementById(id);
  function post(action, data) { window.chrome.webview.postMessage(JSON.stringify({ action, data })); }
  function collect() { const o = {}; FIELDS.forEach((f) => { o[f] = $(f).value; }); return o; }
  function updateDbAccess() { $('dbAccess').value = `${$('sysDb').value.trim()}, ${$('appDb').value.trim()}`; }

  $('sysDb').addEventListener('input', updateDbAccess);
  $('appDb').addEventListener('input', updateDbAccess);
  $('btnShow').onclick = () => {
    const p = $('pass');
    const show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('btnShow').textContent = show ? 'Ẩn' : 'Hiện';
  };
  $('btnTest').onclick = () => { setStatus('Đang kiểm tra...', ''); $('btnTest').disabled = true; post('test', collect()); };
  $('btnOk').onclick = () => post('ok', collect());
  $('btnCancel').onclick = () => post('cancel');
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') post('cancel');
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT') post('ok', collect());
  });

  function setStatus(text, kind) { const s = $('status'); s.textContent = text; s.className = kind || ''; }

  // ---- Called from C# ----
  window.setTheme = (isDark) => document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  window.init = (state) => {
    $('title').textContent = state.title;
    FIELDS.forEach((f) => { $(f).value = state.item[f] || ''; });
    updateDbAccess();
    $('server').focus();
    $('server').select();
  };
  window.setStatus = setStatus;
  window.testDone = (text, ok) => { setStatus(text, ok ? 'ok' : 'err'); $('btnTest').disabled = false; };

  post('ready');
</script>
</body>
</html>
