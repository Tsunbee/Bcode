<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<script src="autoscale.js"></script>
<style>
  body { display: flex; flex-direction: column; background: var(--panel); }
  header { padding: 12px 16px 8px; background: var(--panel-alt); border-bottom: 1px solid var(--border); }
  header h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  header p { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .btn-border { border-color: var(--border); }
  .count { margin-left: auto; align-self: center; font-size: 12px; color: var(--text-muted); }

  main { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 8px;
         background: var(--panel-alt); cursor: grab; transition: background-color 100ms; }
  .row:hover { background: var(--button-back); }
  .row.hidden-tool .label { opacity: .5; text-decoration: line-through; }
  .row.dragging { opacity: .4; }
  .row.over-top { box-shadow: 0 -2px 0 var(--accent); }
  .row.over-bottom { box-shadow: 0 2px 0 var(--accent); }
  .grip { color: var(--text-muted); font-size: 14px; letter-spacing: -2px; user-select: none; cursor: grab; width: 16px; text-align: center; }
  .row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .pos { font-size: 11px; color: var(--text-muted); width: 24px; text-align: right; flex: none; }
  .mv { padding: 2px 7px; border-radius: 6px; font-size: 12px; flex: none; }

  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel-alt); border-top: 1px solid var(--border); }
  footer .hint { flex: 1 1 200px; font-size: 12px; color: var(--text-muted); }
  footer .actions { display: flex; gap: 8px; margin-left: auto; }
  @media (max-width: 420px) { .pos { display: none; } header, .tools, main, footer { padding-left: 10px; padding-right: 10px; } }
</style>
</head>
<body>
<header>
  <h2>Quick Access</h2>
  <p>Tick để hiện nút trên thanh công cụ. <b>Kéo thả</b> dòng (hoặc bấm ▲ ▼) để đổi vị trí — thứ tự từ trên xuống dưới là thứ tự các nút từ trái sang phải.</p>
</header>
<div class="tools">
  <button class="btn btn-border" id="bAll">Hiện tất cả</button>
  <button class="btn btn-border" id="bNone">Ẩn tất cả</button>
  <button class="btn btn-border" id="bReset" title="Trả về thứ tự và hiển thị mặc định">Mặc định</button>
  <span class="count" id="count"></span>
</div>
<main><div id="list"></div></main>
<footer>
  <span class="hint" id="hint"></span>
  <div class="actions">
    <button class="btn btn-border" id="bCancel">Cancel</button>
    <button class="btn btn-primary" id="bOk">OK</button>
  </div>
</footer>

<script>
  let items = [];      // { key, label, visible }
  let defaults = [];   // thứ tự mặc định (mảng key) để nút "Mặc định"
  let dragKey = null;
  const $ = (id) => document.getElementById(id);
  function post(action, data) { window.chrome.webview.postMessage(JSON.stringify({ action, data })); }

  function move(from, to) {
    if (from === to || to < 0 || to >= items.length) return;
    const [it] = items.splice(from, 1);
    items.splice(to, 0, it);
    render();
  }

  function render() {
    const host = $('list');
    host.textContent = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (it.visible ? '' : ' hidden-tool');
      row.draggable = true;
      row.dataset.key = it.key;

      const grip = document.createElement('span'); grip.className = 'grip'; grip.textContent = '⋮⋮';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.visible;
      cb.onchange = () => { it.visible = cb.checked; row.classList.toggle('hidden-tool', !it.visible); count(); };
      const label = document.createElement('span'); label.className = 'label'; label.textContent = it.label;
      label.onclick = () => { cb.checked = !cb.checked; cb.onchange(); };
      const pos = document.createElement('span'); pos.className = 'pos'; pos.textContent = i + 1;
      const up = document.createElement('button'); up.className = 'mv'; up.textContent = '▲'; up.title = 'Lên'; up.onclick = () => move(i, i - 1);
      const dn = document.createElement('button'); dn.className = 'mv'; dn.textContent = '▼'; dn.title = 'Xuống'; dn.onclick = () => move(i, i + 1);
      row.append(grip, cb, label, pos, up, dn);

      row.addEventListener('dragstart', (e) => { dragKey = it.key; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', it.key); });
      row.addEventListener('dragend', () => { dragKey = null; document.querySelectorAll('.row').forEach((r) => r.classList.remove('dragging', 'over-top', 'over-bottom')); });
      row.addEventListener('dragover', (e) => {
        if (!dragKey || dragKey === it.key) return;
        e.preventDefault();
        const r = row.getBoundingClientRect();
        const before = e.clientY < r.top + r.height / 2;
        row.classList.toggle('over-top', before); row.classList.toggle('over-bottom', !before);
      });
      row.addEventListener('dragleave', () => row.classList.remove('over-top', 'over-bottom'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragKey || dragKey === it.key) return;
        const r = row.getBoundingClientRect();
        const before = e.clientY < r.top + r.height / 2;
        const from = items.findIndex((x) => x.key === dragKey);
        let to = items.findIndex((x) => x.key === it.key) + (before ? 0 : 1);
        if (from < to) to--;
        move(from, to);
      });
      host.appendChild(row);
    });
    count();
  }

  function count() { const v = items.filter((x) => x.visible).length; $('count').textContent = `${v}/${items.length} nút đang hiện`; }

  $('bAll').onclick = () => { items.forEach((x) => x.visible = true); render(); };
  $('bNone').onclick = () => { items.forEach((x) => x.visible = false); render(); };
  $('bReset').onclick = () => {
    const order = new Map(defaults.map((k, i) => [k, i]));
    items.sort((a, b) => (order.get(a.key) ?? 1e9) - (order.get(b.key) ?? 1e9));
    items.forEach((x) => x.visible = true);
    render();
  };
  $('bOk').onclick = () => post('ok', { items: items.map((x) => ({ key: x.key, visible: x.visible })) });
  $('bCancel').onclick = () => post('cancel');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('cancel'); });

  window.setTheme = (isDark) => document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  window.init = (state) => {
    items = state.items.map((x) => ({ key: x.key, label: x.label, visible: !!x.visible }));
    defaults = state.defaults || items.map((x) => x.key);
    render();
  };

  post('ready');
</script>
</body>
</html>
