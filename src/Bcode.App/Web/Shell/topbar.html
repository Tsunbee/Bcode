<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  /* Nội dung thật: tự XUỐNG DÒNG khi hẹp (trước đây cố định 1 hàng cao 46px nên các nút bên phải bị cắt mất). */
  #bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 4px 8px;
    gap: 4px 6px;
    min-height: 38px;
  }
  .brand { font-weight: 700; color: var(--accent); padding: 0 10px 0 4px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  .ws-group { display: flex; align-items: center; gap: 6px; }
  #dbNameLabel { user-select: text; -webkit-user-select: text; cursor: text; }
  .group { flex-wrap: wrap; }
  /* Hẹp thì thu gọn (không ẩn): nút nhỏ lại, bỏ chữ phụ; phần còn lại tự xuống dòng. */
  @media (max-width: 900px) {
    .ws-group .muted { display: none; } /* chữ "WS:" */
    #scriptGroup button { padding: 4px 6px; font-size: 11px; }
    #wsSelect { max-width: 220px; }
  }
  @media (max-width: 600px) {
    .brand { display: none; }
    #btnQuickAccess { font-size: 0; padding: 6px; } /* Chỉ hiện icon ngôi sao */
    #btnQuickAccess .icon { margin: 0; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="brand">Bcode</div>
  <button class="btn btn-icon" id="btnSettings" title="Settings (File / Actions)"><span class="icon icon-gear"></span></button>
  <button class="btn" id="btnActions" title="Các hành động nhanh">Actions ▾</button>
  <div class="group" id="scriptGroup">
    <button class="btn" data-script="add">Add Script</button>
    <button class="btn" data-script="view">View Script</button>
    <button class="btn" data-script="clear">Clear Script</button>
    <button class="btn" data-script="save">Save Script</button>
    <button class="btn" data-script="copy">Copy Script</button>
  </div>
  <div class="spacer"></div>
  <div class="ws-group">
    <span class="muted">WS:</span>
    <select id="wsSelect"></select>
  </div>
  <div class="ws-group" id="dbGroup">
    <button class="btn" id="dbToggleSys" data-db="sys">Sys</button>
    <button class="btn" id="dbToggleApp" data-db="app">App</button>
    <span class="muted" id="dbNameLabel"></span>
  </div>
  <button class="btn btn-icon" id="btnTheme" title="Đổi giao diện sáng/tối"><span class="icon icon-theme dark" id="themeIcon"></span></button>
  <button class="btn btn-pill btn-primary" id="btnQuickAccess" title="Chọn tính năng hiển thị trên toolbar"><span class="icon icon-star"></span>Quick Access</button>

</div>
<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }


  // Báo chiều cao nội dung cho host (px thiết bị) mỗi khi đổi — host chỉnh chiều cao WebView2 theo đó, nên khi cửa sổ hẹp
  // và nội dung xuống dòng thì thanh cao thêm thay vì bị cắt mất phần dưới/phần bên phải.
  (function () {
    var bar = document.getElementById('bar'), last = 0;
    function send() {
      var h = Math.ceil(bar.getBoundingClientRect().height * (window.devicePixelRatio || 1));
      if (h && h !== last) { last = h; post({ action: '__height', height: h }); }
    }
    if (window.ResizeObserver) new ResizeObserver(send).observe(bar);
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    setTimeout(send, 50);
  })();

  document.getElementById('btnSettings').addEventListener('click', () => post({ action: 'settings' }));
  document.getElementById('btnActions').addEventListener('click', () => post({ action: 'show-actions-menu' }));
  document.getElementById('btnQuickAccess').addEventListener('click', () => post({ action: 'quickaccess' }));
  document.getElementById('btnTheme').addEventListener('click', () => post({ action: 'theme' }));
  document.getElementById('dbGroup').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-db]');
    if (btn) { _dbView = btn.getAttribute('data-db'); renderDbLabel(); post({ action: 'select-db', which: _dbView }); }
  });
  document.getElementById('scriptGroup').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-script]');
    if (btn) post({ action: 'script', which: btn.getAttribute('data-script') });
  });
  document.getElementById('wsSelect').addEventListener('change', function (e) {
    post({ action: 'select-ws', index: parseInt(e.target.value, 10) });
  });

  // ---- Called from C# (MainForm) ----
  // Template giao diện: sắp lại thứ tự + đổi chữ/font/màu các nút Script. cfg = { order:[id...], items:{ id:{ text, css:{...} } } }.
  window.applyLayout = function (json) {
    var cfg = JSON.parse(json), grp = document.getElementById('scriptGroup'), btns = {};
    grp.querySelectorAll('[data-script]').forEach(function (b) {
      if (b.dataset.orig === undefined) { b.dataset.orig = b.textContent; b.dataset.pos = Object.keys(btns).length; }
      btns[b.getAttribute('data-script')] = b;
    });
    var ids = (cfg.order || []).filter(function (id) { return btns[id]; });
    Object.keys(btns).sort(function (a, b) { return btns[a].dataset.pos - btns[b].dataset.pos; })
      .forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    ids.forEach(function (id) {
      var b = btns[id], it = (cfg.items || {})[id] || {};
      grp.appendChild(b);
      b.textContent = it.text || b.dataset.orig;
      b.removeAttribute('style');
      Object.keys(it.css || {}).forEach(function (k) { b.style[k] = it.css[k]; });
    });
  };

  window.setWorkspaces = function (namesJson) {
    var names = JSON.parse(namesJson);
    var sel = document.getElementById('wsSelect');
    sel.innerHTML = '';
    names.forEach(function (name, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  };

  window.setSelectedWs = function (index) {
    document.getElementById('wsSelect').value = index;
  };

  var _dbNames = { sys: '', app: '' };
  var _dbView = 'app';

  function renderDbLabel() {
    document.getElementById('dbNameLabel').textContent = _dbNames[_dbView] || '';
    document.getElementById('dbToggleSys').classList.toggle('active', _dbView === 'sys');
    document.getElementById('dbToggleApp').classList.toggle('active', _dbView === 'app');
  }

  window.setDbView = function (which) { _dbView = which === 'sys' ? 'sys' : 'app'; renderDbLabel(); };

  window.setDbNames = function (sysDb, appDb) {
    _dbNames.sys = sysDb || '';
    _dbNames.app = appDb || '';
    renderDbLabel();
  };
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeIcon').classList.toggle('dark', isDark);
  };
</script>
</body>
</html>
