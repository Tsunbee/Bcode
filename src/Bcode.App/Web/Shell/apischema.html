<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<script src="autoscale.js"></script>
<style>
  body {
    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0;
    background: var(--panel);
  }
  .main-split { display: flex; flex: 1; overflow: hidden; }
  .left-pane {
    width: 250px;
    background: var(--panel-alt);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 8px;
    box-sizing: border-box;
  }
  .api-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 8px 0;
  }
  .api-item {
    padding: 8px 10px;
    background: var(--button-back);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .api-item.active {
    background: var(--selection);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .right-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    overflow: hidden;
    gap: 8px;
  }
  .header-grid {
    display: grid;
    grid-template-columns: 100px 1fr 90px 1.2fr;
    gap: 8px;
    align-items: center;
  }
  .header-grid .full { grid-column: span 3; }
  .table-container {
    flex: 1;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th {
    background: var(--panel-alt);
    position: sticky;
    top: 0;
    text-align: left;
    color: var(--text-muted);
  }
  td input[type="text"] { width: 100%; height: 24px; font-size: 12px; }
  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actions-bar {
    padding: 8px 12px;
    background: var(--panel-alt);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  @media (max-width: 900px) {
    /* Đẩy cột danh sách API (trái) lên phía trên và giới hạn chiều cao */
    .main-split { flex-direction: column; }
    .left-pane { 
        width: 100%; 
        height: 200px; 
        border-right: none; 
        border-bottom: 1px solid var(--border); 
    }
    
    /* Thu lưới nhập liệu từ 4 cột thành 2 cột */
    .header-grid { grid-template-columns: 100px 1fr; }
    .header-grid .full { grid-column: span 1; }
  }
</style>
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--button-back); font-size: 12px; }
  .chip b { color: var(--accent); font-weight: 600; }
  .chip .tag { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--panel-alt); color: var(--text-muted); }
  .chip button { padding: 0 6px; border-radius: 10px; line-height: 1.3; }
  .chip { cursor: pointer; }
  .chip.on { border-color: var(--accent); background: var(--selection); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--text-muted); display: inline-block; }
  .chip.on .dot { border-color: var(--accent); background: var(--accent); }
  .suggest-wrap { position: relative; }
  #tblSuggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.45); display: none; }
  #tblSuggest .sg { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #tblSuggest .sg.on, #tblSuggest .sg:hover { background: var(--selection); }
  #tblSuggest .sg em { color: var(--text-muted); font-style: normal; font-size: 11px; }
  #tblSuggest mark { background: transparent; color: var(--accent); font-weight: 600; }
  td.c, th.c { text-align: center; }
  td.src { color: var(--accent); font-size: 12px; white-space: nowrap; }
  td.dup input.txt-field { outline: 1px solid #e5484d; }
  /* Chọn nhiều dòng (Ctrl+A / Ctrl+Click / Shift+Click / kéo) → Space tick / bỏ tick cả nhóm */
  #colTableBody tr.rsel td { background: var(--selection); }
  #colTableBody tr.rsel td:first-child { box-shadow: 3px 0 0 var(--accent) inset; }
  .table-container:focus { outline: none; }
  .table-container.dragging { user-select: none; }
  tr.manual td.src { font-style: italic; }
  tr.manual .del-col { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; cursor: pointer; background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 3px; }
  tr.manual .del-col:hover { color: #e5484d; border-color: #e5484d; }
  .muted { color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="main-split">
    <div class="left-pane">
      <div style="font-weight: 600; color: var(--accent);">Danh sách API</div>
      <div class="api-list" id="apiList"></div>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-primary" style="flex: 1;" id="btnAddApi">+ Thêm</button>
        <button class="btn" id="btnDeleteApi">Xóa</button>
      </div>
    </div>

    <div class="right-pane">
      <div class="header-grid">
        <label>Tên API:</label>
        <input type="text" id="txtApiName" class="full" />

        <label>Tên hàm API:</label>
        <div class="full" style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="txtFunc" style="width:260px" spellcheck="false" placeholder="Set + controller của bảng" />
          <button class="btn" id="btnFuncAuto" title="Đặt lại tên hàm = Set + controller (Dir) của bảng đầu tiên">↻ Tự đặt</button>
          <span class="muted" id="funcInfo"></span>
        </div>

        <label>Thêm bảng:</label>
        <div class="suggest-wrap full">
          <input type="text" id="txtTable" placeholder="Gõ để lọc bảng / view (vd dmkh, ctgs, SVTran) — chọn để THÊM vào API, có thể thêm nhiều bảng..." autocomplete="off" spellcheck="false" style="width:100%" />
          <div id="tblSuggest"></div>
        </div>

        <label>Bảng đã chọn:</label>
        <div class="chips full" id="tblChips"></div>

        <label>Mô tả xử lý:</label>
        <input type="text" id="txtDesc" class="full" placeholder="Mô tả nghiệp vụ / logic..." />
      </div>

      <div class="toolbar-actions">
        <button class="btn" id="btnFilterSys">Bỏ cột hệ thống</button>
        <button class="btn" id="btnCamel">Đổi sang camelCase</button>
        <button class="btn" id="btnUndoName" title="Trả tên trường API về tên trước khi bấm camelCase">↩ Về tên cũ</button>
        <button class="btn" id="btnReqDb" title="Tick cột Bắt buộc cho các cột NOT NULL của bảng (không tính cột identity)">☑ Tick bắt buộc (NOT NULL)</button>
        <button class="btn" id="btnReqClear">Bỏ tick bắt buộc</button>
        <button class="btn" id="btnAddCol" title="Thêm 1 cột KHÔNG có trong bảng database (cột tự khai): sửa được mọi ô, ✕ để xoá; lưu cùng API và xuất ra Word như cột thật">＋ Thêm cột</button>
        <button class="btn" id="btnGenProc">⚡ Gen Store OPENJSON</button>
        <button class="btn" id="btnMockData">🎲 Tạo Mock Data (Top 5 DB)</button>
        <span class="muted" id="colInfo"></span>
      </div>

      <div class="table-container" tabindex="0">
        <table>
          <thead>
            <tr>
              <th style="width: 36px; text-align: center;"><input type="checkbox" id="chkAll" checked title="Chọn / bỏ chọn tất cả cột&#10;Trong lưới: Ctrl+A chọn mọi dòng · Ctrl+Click / Shift+Click / kéo chuột chọn nhiều dòng · Space tick / bỏ tick các dòng đang chọn" /></th>
              <th style="width: 13%;">Bảng nguồn</th>
              <th style="width: 15%;">Cột DB</th>
              <th style="width: 11%;">Kiểu dữ liệu</th>
              <th class="c" style="width: 50px;" title="Khóa chính (lấy từ DB, tick sửa được)">🔑 PK</th>
              <th class="c" style="width: 64px;" title="Trường bắt buộc nhập — xuất ra Word">Bắt buộc</th>
              <th style="width: 16%;">Tên trường API</th>
              <th style="width: 18%;" title="Tiêu đề tiếng Việt của field ở controller Dir của bảng (source dự án), không có thì lấy từ điển field FCode — sửa tay được">Tên tiếng Việt</th>
              <th>Quy tắc / Logic</th>
            </tr>
          </thead>
          <tbody id="colTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <label style="display:flex; align-items:center; gap:6px; margin-right:auto;" title="Bản gửi đối tác: Word không có Bảng DB / Bảng nguồn / Cột CSDL — mỗi trường định nghĩa bằng Tên tiếng Việt">
      <input type="checkbox" id="chkHideSource" /> Bỏ database nguồn khi xuất Word
    </label>
    <button class="btn btn-primary" id="btnExportWord">📄 Xuất tất cả API ra Word (.doc)</button>
    <button class="btn" id="btnClose">Đóng</button>
  </div>

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  var _apis = [];
  var _activeIdx = 0;
  var _systemCols = ["datetime0", "datetime2", "user_id0", "user_id2", "date0", "time0", "date2", "time2", "status", "sysorder"];
  var _allTables = { '0': [], '1': [] };   // db -> [tên bảng / view]

  function newApi(n) { return { name: 'API ' + n, desc: '', func: '', funcAuto: true, tables: [], columns: [], view: '' }; }
  var _hideSource = false;

  /// Tên hàm tự đặt = "Set" + controller Dir của bảng đầu tiên (chưa tìm được controller thì tạm theo tên bảng).
  function funcFor(t) {
    if (!t) return '';
    var n = String(t.controller || t.table || '').replace(/^.*\./, '').replace(/[^A-Za-z0-9_]/g, '');
    return n ? 'Set' + n : '';
  }
  function autoFunc(a) { if (a && a.funcAuto) a.func = funcFor(a.tables[0]); }
  function renderFuncInfo(a) {
    var t = a && a.tables[0];
    $('funcInfo').textContent = !t ? 'Tự đặt khi thêm bảng: Set + controller của bảng.'
      : (a.funcAuto ? 'Tự đặt' : 'Đã sửa tay') + ' · ' + (t.controller ? (t.menu ? 'sysid ' + t.controller + ' của menu ' + t.menu : 'controller Dir ' + t.controller + ' (không thấy menu dùng bảng)')
          + (t.others && t.others.length ? ' · menu khác cùng bảng: ' + t.others.join(', ') : '')
      : (t.infoDone ? 'không thấy menu (sysid) / controller Dir nào dùng ' + t.table + ' — dùng tên bảng' : 'đang tìm menu của ' + t.table + '…'));
  }

  // Tự lưu (ApiSchemaStore theo dự án) sau mỗi lần sửa — đóng form mở lại vẫn còn các API.
  var _saveTimer = 0;
  function queueSave() { clearTimeout(_saveTimer); _saveTimer = setTimeout(function () { post({ action: 'save', state: window.getState() }); }, 500); }
  window.getState = function () { syncActiveApi(); return { hideSource: _hideSource, active: _activeIdx, apis: _apis }; };
  /// Các cột đang hiện: chỉ bảng đang chọn (view = "db|bảng"), hoặc tất cả khi view rỗng.
  function vis(a) { return a.columns.filter(function (c) { return !a.view || c.tkey === a.view || c.manual; }); }
  var tkeyOf = function (db, t) { return db + '|' + t; };

  /// Ghi các ô đang sửa trên màn hình vào model (hàng nào cũng có data-i = chỉ số cột trong API).
  function syncActiveApi() {
    var a = _apis[_activeIdx]; if (!a) return;
    a.name = $('txtApiName').value;
    a.desc = $('txtDesc').value;
    var fv = $('txtFunc').value.trim();
    if (fv !== (a.func || '')) { a.func = fv; a.funcAuto = false; }
    document.querySelectorAll('#colTableBody tr').forEach(function (r) {
      var c = a.columns[+r.dataset.i]; if (!c) return;
      c.selected = r.querySelector('.chk-col').checked;
      if (c.manual) { c.colName = r.querySelector('.txt-col').value; c.dataType = r.querySelector('.txt-type').value; }
      c.isPk = r.querySelector('.chk-pk').checked;
      c.required = r.querySelector('.chk-req').checked;
      c.fieldDesc = r.querySelector('.txt-field').value;
      c.logicDesc = r.querySelector('.txt-logic').value;
      var vi = r.querySelector('.txt-vi').value;
      if (vi !== (c.viName || '')) { c.viName = vi; c.viUser = true; }
    });
  }

  function renderList() {
    var el = $('apiList');
    el.innerHTML = '';
    _apis.forEach(function (a, i) {
      var d = document.createElement('div');
      d.className = 'api-item' + (i === _activeIdx ? ' active' : '');
      d.textContent = a.name || '(Chưa đặt tên)';
      d.onclick = function () { syncActiveApi(); _activeIdx = i; renderList(); renderDetail(); };
      el.appendChild(d);
    });
    queueSave();
  }

  function renderChips() {
    var a = _apis[_activeIdx]; var el = $('tblChips'); el.innerHTML = '';
    if (!a || !a.tables.length) { el.innerHTML = '<span class="muted">Chưa chọn bảng nào.</span>'; return; }
    if (a.view && !a.tables.some(function (t) { return tkeyOf(t.db, t.table) === a.view; })) a.view = '';
    var pick = function (key) { syncActiveApi(); a.view = key; renderDetail(); };
    if (a.tables.length > 1) {
      var all = document.createElement('span'); all.className = 'chip' + (a.view ? '' : ' on');
      all.innerHTML = '<span class="dot"></span><b>Tất cả</b><span class="tag">' + a.columns.length + ' cột</span>';
      all.title = 'Hiện cột của mọi bảng'; all.onclick = function () { pick(''); };
      el.appendChild(all);
    }
    a.tables.forEach(function (t, i) {
      var key = tkeyOf(t.db, t.table);
      var s = document.createElement('span'); s.className = 'chip' + ((a.view === key || a.tables.length === 1) ? ' on' : '');
      var n = a.columns.filter(function (c) { return c.tkey === key; }).length;
      s.innerHTML = '<span class="dot"></span><b>' + esc(t.table) + '</b><span class="tag">' + (t.db === '1' ? 'Sys' : 'App') + ' · ' + n + ' cột</span>';
      s.title = 'Bấm để chỉ hiện cột của bảng này';
      s.onclick = function () { pick(key); };
      var x = document.createElement('button'); x.textContent = '✕'; x.title = 'Bỏ bảng này (và các cột lấy từ nó)';
      x.onclick = function (e) { e.stopPropagation(); syncActiveApi(); a.tables.splice(i, 1); a.columns = a.columns.filter(function (c) { return c.tkey !== key; }); _rsel = new Set(); if (a.view === key) a.view = ''; autoFunc(a); renderDetail(); };
      s.appendChild(x); el.appendChild(s);
    });
  }

  function dupNames(a) {
    var count = {};
    a.columns.forEach(function (c) { if (c.selected) { var k = (c.fieldDesc || '').toLowerCase(); count[k] = (count[k] || 0) + 1; } });
    return count;
  }

  function renderDetail() {
    var a = _apis[_activeIdx];
    if (!a) return;
    $('txtApiName').value = a.name;
    $('txtDesc').value = a.desc;
    $('txtFunc').value = a.func || '';
    renderFuncInfo(a);
    renderChips();

    var count = dupNames(a);
    var tbody = $('colTableBody');
    tbody.innerHTML = '';
    var multi = a.tables.length > 1;
    if (_selApi !== _activeIdx) { _rsel = new Set(); _anchor = -1; _selApi = _activeIdx; }
    a.columns.forEach(function (c, i) {
      if (a.view && c.tkey !== a.view && !c.manual) return;
      var tr = document.createElement('tr');
      tr.dataset.i = i;
      if (_rsel.has(i)) tr.className = 'rsel';
      if (c.manual) tr.className += ' manual';
      var dup = c.selected && count[(c.fieldDesc || '').toLowerCase()] > 1;
      tr.innerHTML =
        '<td class="c"><input type="checkbox" class="chk-col"' + (c.selected ? ' checked' : '') + ' /></td>' +
        (c.manual
          ? '<td class="src" title="Cột thêm tay — không có trong bảng database">' + esc(c.tname || '(thêm tay)') + '<button class="del-col" title="Xoá cột thêm tay này">✕</button></td>' +
            '<td><input type="text" class="txt-col" placeholder="tên cột" value="' + esc(c.colName) + '" /></td>' +
            '<td><input type="text" class="txt-type" placeholder="nvarchar(255)" value="' + esc(c.dataType) + '" /></td>'
          : '<td class="src" title="' + esc(c.tname || '') + '">' + esc(c.tname || '') + '</td>' +
            '<td>' + esc(c.colName) + '</td>' +
            '<td>' + esc(c.dataType) + '</td>') +
        '<td class="c"><input type="checkbox" class="chk-pk"' + (c.isPk ? ' checked' : '') + ' /></td>' +
        '<td class="c"><input type="checkbox" class="chk-req"' + (c.required ? ' checked' : '') + ' /></td>' +
        '<td' + (dup ? ' class="dup" title="Trùng tên trường API với cột khác — đổi tên để không đè nhau"' : '') + '><input type="text" class="txt-field" value="' + esc(c.fieldDesc) + '" /></td>' +
        '<td><input type="text" class="txt-vi" value="' + esc(c.viName || '') + '" /></td>' +
        '<td><input type="text" class="txt-logic" value="' + esc(c.logicDesc) + '" /></td>';
      tbody.appendChild(tr);
    });
    queueSave();
    var sel = a.columns.filter(function (c) { return c.selected; }).length;
    $('chkAll').checked = vis(a).length > 0 && vis(a).every(function (c) { return c.selected; });
    $('colInfo').textContent = a.columns.length ? ((a.view ? 'Đang hiện ' + vis(a).length + ' cột của bảng đã chọn · ' : '') + sel + '/' + a.columns.length + ' cột · ' + a.columns.filter(function (c) { return c.selected && c.isPk; }).length + ' khóa chính · ' + a.columns.filter(function (c) { return c.selected && c.required; }).length + ' bắt buộc' + (multi ? ' · ' + a.tables.length + ' bảng' : '')) : '';
  }

  // ---- Chọn nhiều dòng của lưới cột: Ctrl+A (khi không gõ trong ô chữ) / Ctrl+Click / Shift+Click / kéo chuột → Space hoặc bấm ô ✓ của 1 dòng
  //      đang chọn = tick / bỏ tick cả nhóm. _rsel = chỉ số cột trong a.columns (đổi API thì bỏ chọn).
  var _rsel = new Set(), _anchor = -1, _dragging = false, _selApi = -1;
  var grid = document.querySelector('.table-container');
  function rows() { return Array.prototype.slice.call(document.querySelectorAll('#colTableBody tr')); }
  function paintSel() { rows().forEach(function (r) { r.classList.toggle('rsel', _rsel.has(+r.dataset.i)); }); }
  function rangeSel(from, to) {
    var idx = rows().map(function (r) { return +r.dataset.i; });
    var x = idx.indexOf(from), y = idx.indexOf(to);
    if (x < 0 || y < 0) return;
    _rsel = new Set(idx.slice(Math.min(x, y), Math.max(x, y) + 1));
  }
  function focusGrid() { try { grid.focus({ preventScroll: true }); } catch (e) { grid.focus(); } }
  /// Space: đảo cả nhóm — đang tick hết thì bỏ hết, còn lại thì tick hết.
  function toggleSel() {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    var list = []; _rsel.forEach(function (i) { if (a.columns[i]) list.push(a.columns[i]); });
    if (!list.length) return;
    var allOn = list.every(function (c) { return c.selected; });
    list.forEach(function (c) { c.selected = !allOn; });
    renderDetail();
    $('colInfo').textContent = (allOn ? 'Đã bỏ tick ' : 'Đã tick ') + list.length + ' cột đang chọn.';
  }
  $('colTableBody').addEventListener('mousedown', function (e) {
    var tr = e.target.closest('tr'); if (!tr || e.button !== 0) return;
    if (e.target.closest('.del-col')) return;
    var i = +tr.dataset.i;
    var onChk = e.target.matches('input[type="checkbox"]');
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (_rsel.has(i)) _rsel.delete(i); else _rsel.add(i);
      _anchor = i; paintSel(); focusGrid(); return;
    }
    if (e.shiftKey && _anchor >= 0) { e.preventDefault(); rangeSel(_anchor, i); paintSel(); focusGrid(); return; }
    if (e.target.matches('input[type="text"]')) return;              // bấm vào ô chữ = sửa chữ, giữ nguyên vùng chọn
    if (onChk && _rsel.has(i) && _rsel.size > 1) return;              // bấm ✓ của 1 dòng trong nhóm đang chọn = đổi cả nhóm (xem 'change')
    _rsel = new Set([i]); _anchor = i; _dragging = true; grid.classList.add('dragging'); paintSel();
    if (!onChk) { e.preventDefault(); focusGrid(); }
  });
  $('colTableBody').addEventListener('mouseover', function (e) {
    if (!_dragging) return;
    var tr = e.target.closest('tr'); if (!tr) return;
    rangeSel(_anchor, +tr.dataset.i); paintSel();
  });
  document.addEventListener('mouseup', function () { _dragging = false; grid.classList.remove('dragging'); });
  document.addEventListener('keydown', function (e) {
    var ae = document.activeElement;
    var typing = ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox'));
    if (typing) return;                                               // Ctrl+A / Space trong ô chữ giữ nguyên nghĩa thường
    var inGrid = !ae || ae === document.body || (ae.closest && ae.closest('.table-container'));
    if (!inGrid) return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault();
      var idx = rows().map(function (r) { return +r.dataset.i; });
      _rsel = new Set(idx); _anchor = idx.length ? idx[0] : -1; paintSel(); focusGrid();
      $('colInfo').textContent = 'Đã chọn ' + idx.length + ' dòng — Space để tick / bỏ tick cả nhóm.';
    } else if (e.key === ' ' && !e.ctrlKey && !e.altKey && _rsel.size) {
      e.preventDefault();
      toggleSel();
    }
  });
  $('colTableBody').addEventListener('change', function (e) {
    var t = e.target;
    if (t.classList.contains('chk-col')) {
      var i = +t.closest('tr').dataset.i;
      if (_rsel.has(i) && _rsel.size > 1)
        rows().forEach(function (r) { if (_rsel.has(+r.dataset.i)) r.querySelector('.chk-col').checked = t.checked; });
    }
    syncActiveApi(); renderDetail();
  });
  $('colTableBody').addEventListener('click', function (e) {
    var del = e.target.closest('.del-col'); if (!del) return;
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    a.columns.splice(+del.closest('tr').dataset.i, 1);
    _rsel = new Set(); _anchor = -1;
    renderDetail();
  });
  // Cột thêm tay: gõ tên cột mà Tên trường API còn trống / đang theo tên cột cũ thì điền theo.
  $('colTableBody').addEventListener('input', function (e) {
    if (!e.target.classList.contains('txt-col')) return;
    var f = e.target.closest('tr').querySelector('.txt-field');
    var prev = e.target.dataset.prev || '';
    if (!f.value || f.value === prev.toLowerCase()) f.value = e.target.value.toLowerCase();
    e.target.dataset.prev = e.target.value;
  });
  $('btnAddCol').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    a.columns.push({ selected: true, colName: '', dataType: 'nvarchar(255)', isPk: false, nullable: true, identity: false, required: false,
      fieldDesc: '', logicDesc: '', viName: '', viUser: true, tkey: '', tname: '(thêm tay)', tdb: '', manual: true });
    _rsel = new Set([a.columns.length - 1]); _anchor = a.columns.length - 1;
    renderDetail();
    var tr = document.querySelector('#colTableBody tr[data-i="' + (a.columns.length - 1) + '"]');
    if (tr) { tr.scrollIntoView({ block: 'nearest' }); tr.querySelector('.txt-col').focus(); }
    $('colInfo').textContent = 'Đã thêm 1 cột thêm tay — gõ tên cột, kiểu, tên trường API…; ✕ ở cột Bảng nguồn để xoá.';
  };
  // Gõ dở trong ô (chưa rời ô) cũng lưu.
  document.querySelector('.right-pane').addEventListener('input', function (e) { if (e.target.id !== 'txtTable') queueSave(); });
  $('txtFunc').addEventListener('change', function () { syncActiveApi(); renderFuncInfo(_apis[_activeIdx]); });
  $('btnFuncAuto').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    a.funcAuto = true; autoFunc(a); renderDetail();
    // Tra lại menu của bảng đầu (sysid có thể đổi / lần trước chưa tra theo menu) — kết quả về qua setTableInfo, tự đặt lại tên hàm.
    var t = a.tables[0];
    if (t) {
      var key = tkeyOf(t.db, t.table);
      t.infoDone = false; renderFuncInfo(a);
      post({ action: 'table-info', db: t.db, table: t.table, cols: a.columns.filter(function (c) { return c.tkey === key; }).map(function (c) { return c.colName; }) });
    }
  };

  $('btnAddApi').onclick = function () {
    syncActiveApi();
    _apis.push(newApi(_apis.length + 1));
    _activeIdx = _apis.length - 1;
    renderList(); renderDetail();
  };

  $('btnDeleteApi').onclick = function () {
    if (_apis.length <= 1) return;
    _apis.splice(_activeIdx, 1);
    _activeIdx = Math.max(0, _activeIdx - 1);
    renderList(); renderDetail();
  };

  $('txtApiName').oninput = function (e) {
    if (_apis[_activeIdx]) {
      _apis[_activeIdx].name = e.target.value;
      document.querySelectorAll('.api-item')[_activeIdx].textContent = e.target.value || '(Chưa đặt tên)';
    }
  };

  // ---------------- chọn bảng: lọc + gợi ý (App và Sys cùng 1 ô) ----------------
  var _sg = { items: [], on: -1 };
  function suggestItems(q) {
    q = q.trim().toLowerCase();
    var all = [];
    ['0', '1'].forEach(function (db) { _allTables[db].forEach(function (t) { all.push({ db: db, table: t }); }); });
    if (!q) return all.slice(0, 60);
    var starts = [], has = [];
    all.forEach(function (x) {
      var full = x.table.toLowerCase(), short = full.replace(/^[^.]*\./, '');
      if (short.indexOf(q) === 0 || full.indexOf(q) === 0) starts.push(x); else if (full.indexOf(q) >= 0) has.push(x);
    });
    return starts.concat(has).slice(0, 80);
  }
  function hl(text, q) {
    var i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }
  function showSuggest() {
    var q = $('txtTable').value.trim();
    _sg.items = suggestItems(q); _sg.on = _sg.items.length ? 0 : -1;
    var box = $('tblSuggest');
    if (!_sg.items.length) { box.innerHTML = '<div class="sg"><em>Không có bảng nào khớp' + (_allTables['0'].length + _allTables['1'].length ? '' : ' (đang tải danh sách bảng…)') + '</em></div>'; box.style.display = 'block'; return; }
    box.innerHTML = _sg.items.map(function (x, i) {
      return '<div class="sg' + (i === _sg.on ? ' on' : '') + '" data-i="' + i + '"><span>' + hl(x.table, q) + '</span><em>' + (x.db === '1' ? 'Sys Data' : 'App Data') + '</em></div>';
    }).join('');
    box.style.display = 'block';
  }
  function markSuggest(n) {
    _sg.on = Math.max(0, Math.min(_sg.items.length - 1, n));
    document.querySelectorAll('#tblSuggest .sg').forEach(function (d, i) { d.classList.toggle('on', i === _sg.on); if (i === _sg.on) d.scrollIntoView({ block: 'nearest' }); });
  }
  function hideSuggest() { $('tblSuggest').style.display = 'none'; }
  function addTable(x) {
    var a = _apis[_activeIdx]; if (!a || !x) return;
    syncActiveApi();
    if (a.tables.some(function (t) { return t.db === x.db && t.table.toLowerCase() === x.table.toLowerCase(); })) { $('colInfo').textContent = 'Bảng ' + x.table + ' đã có trong API này.'; return; }
    a.tables.push({ db: x.db, table: x.table, controller: '' });
    a.view = tkeyOf(x.db, x.table);
    autoFunc(a);
    renderChips(); renderDetail();
    post({ action: 'load-columns', db: x.db, table: x.table });
    $('txtTable').value = ''; hideSuggest();
  }
  $('txtTable').addEventListener('input', showSuggest);
  $('txtTable').addEventListener('focus', showSuggest);
  $('txtTable').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if ($('tblSuggest').style.display !== 'block') showSuggest(); else markSuggest(_sg.on + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); markSuggest(_sg.on - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (_sg.on >= 0) addTable(_sg.items[_sg.on]); }
    else if (e.key === 'Escape') hideSuggest();
  });
  $('tblSuggest').addEventListener('mousedown', function (e) { var d = e.target.closest('.sg[data-i]'); if (d) { e.preventDefault(); addTable(_sg.items[+d.dataset.i]); } });
  document.addEventListener('mousedown', function (e) { if (!e.target.closest('.suggest-wrap')) hideSuggest(); });

  // ---------------- thao tác trên cột ----------------
  $('btnFilterSys').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    vis(a).forEach(function (c) { if (_systemCols.indexOf(String(c.colName).toLowerCase()) >= 0) c.selected = false; });
    renderDetail();
  };

  function toCamel(val) {
    if (val.indexOf('_') < 0) return val;
    var parts = val.split('_').filter(function (p) { return p.length; });
    return parts[0].toLowerCase() + parts.slice(1).map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }).join('');
  }
  $('btnCamel').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    vis(a).forEach(function (c) {
      var nv = toCamel(c.fieldDesc || '');
      if (nv !== c.fieldDesc) { if (c.prevField === undefined) c.prevField = c.fieldDesc; c.fieldDesc = nv; }
    });
    renderDetail();
  };
  $('btnUndoName').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    var n = 0;
    vis(a).forEach(function (c) { if (c.prevField !== undefined) { c.fieldDesc = c.prevField; delete c.prevField; n++; } });
    renderDetail();
    $('colInfo').textContent = n ? 'Đã trả ' + n + ' tên trường về tên cũ.' : 'Chưa có tên nào đổi sang camelCase để trả lại.';
  };
  $('btnReqDb').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    var n = 0;
    vis(a).forEach(function (c) { if (c.selected && c.nullable === false && !c.identity) { c.required = true; n++; } });
    renderDetail();
    $('colInfo').textContent = 'Đã tick bắt buộc ' + n + ' cột NOT NULL (cột identity và cột nullable không tick). Sửa tay được ở cột Bắt buộc.';
  };
  $('btnReqClear').onclick = function () {
    syncActiveApi();
    var a = _apis[_activeIdx]; if (!a) return;
    vis(a).forEach(function (c) { c.required = false; });
    renderDetail();
  };

  $('btnGenProc').onclick = function () { syncActiveApi(); post({ action: 'gen-proc', api: _apis[_activeIdx] }); };
  $('btnMockData').onclick = function () { syncActiveApi(); post({ action: 'gen-mock-data', api: _apis[_activeIdx] }); };

  $('chkAll').onchange = function (e) {
    var a = _apis[_activeIdx]; if (!a) return;
    syncActiveApi();
    vis(a).forEach(function (c) { c.selected = e.target.checked; });
    renderDetail();
  };

  $('btnExportWord').onclick = function () {
    syncActiveApi();
    post({ action: 'export-word', apis: _apis, hideSource: _hideSource });
  };
  $('chkHideSource').onchange = function (e) { _hideSource = e.target.checked; queueSave(); };
  $('btnClose').onclick = function () { post({ action: 'close' }); };
  window.setInfo = function (msg) { $('colInfo').textContent = msg; };

  // ---------------- nhận dữ liệu từ C# ----------------
  window.setTables = function (tables, db) {
    _allTables[String(db === undefined ? '0' : db)] = tables || [];
    if (document.activeElement === $('txtTable')) showSuggest();
  };

  /// Cột của 1 bảng vừa thêm (key = "db|bảng"): gộp vào API đang mở; trùng tên trường với cột đã có thì thêm tiền tố tên bảng.
  window.setColumns = function (cols, key) {
    var a = _apis[_activeIdx]; if (!a) return;
    var parts = String(key || '|').split('|'), db = parts[0], tname = parts.slice(1).join('|');
    if (!a.tables.some(function (t) { return t.db === db && t.table === tname; })) return;     // bảng đã bị bỏ trong lúc chờ
    a.columns = a.columns.filter(function (c) { return c.tkey !== key; });
    _rsel = new Set();
    var used = {}; a.columns.forEach(function (c) { used[(c.fieldDesc || '').toLowerCase()] = 1; });
    var short = tname.replace(/^[^.]*\./, '').toLowerCase();
    (cols || []).forEach(function (c) {
      c.tkey = key; c.tname = tname; c.tdb = db; c.required = false; c.viName = c.viName || ''; c.viUser = false;
      if (used[String(c.fieldDesc).toLowerCase()]) c.fieldDesc = short + '_' + c.fieldDesc;
      used[String(c.fieldDesc).toLowerCase()] = 1;
      a.columns.push(c);
    });
    renderDetail();
  };

  /// Controller Dir của 1 bảng vừa thêm (C# tìm trong Source Path, có thể chậm): ghi vào mọi API có bảng đó, điền Tên tiếng Việt
  /// cho cột chưa sửa tay, đặt lại tên hàm nếu bảng là bảng đầu tiên và tên hàm đang ở chế độ tự đặt.
  window.setTableInfo = function (key, info) {
    syncActiveApi();
    info = info || {};
    _apis.forEach(function (a) {
      a.tables.forEach(function (t, i) {
        if (tkeyOf(t.db, t.table) !== key) return;
        t.controller = info.controller || ''; t.menu = info.menu || ''; t.others = info.others || []; t.infoDone = true;
        if (i === 0) autoFunc(a);
      });
      a.columns.forEach(function (c) {
        if (c.tkey === key && !c.viUser && info.vi && info.vi[c.colName]) c.viName = info.vi[c.colName];
      });
    });
    renderList(); renderDetail();
  };

  window.initFirstApi = function () {
    _apis = [newApi(1)];
    _activeIdx = 0;
    renderList(); renderDetail();
  };

  /// Mở lại form: các API đã lưu của dự án (ApiSchemaStore).
  window.initApis = function (st) {
    _apis = (st && st.apis && st.apis.length) ? st.apis : [newApi(1)];
    _apis.forEach(function (a) {
      a.tables = a.tables || []; a.columns = a.columns || []; a.view = a.view || '';
      if (a.funcAuto === undefined) a.funcAuto = true;
      a.tables.forEach(function (t) { t.infoDone = true; });
    });
    _activeIdx = Math.max(0, Math.min(_apis.length - 1, (st && st.active) || 0));
    _hideSource = !!(st && st.hideSource);
    $('chkHideSource').checked = _hideSource;
    renderList(); renderDetail();
  };
</script>
</body>
</html>
