<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bhoo</title>
<link rel="stylesheet" href="retro.css">
<style>
  .me { display: flex; gap: 8px; padding: 8px; align-items: flex-start; }
  .avatar {
    width: 48px; height: 48px; flex: none; border: 1px solid #0f2a52; display: flex; align-items: center; justify-content: center;
    color: #fff; font: bold 24px Tahoma; text-shadow: 0 1px 1px rgba(0,0,0,.45); box-shadow: 0 0 0 2px #fff, 1px 1px 3px 2px rgba(0,0,0,.35); cursor: pointer;
  }
  .meinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .myrow { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 1px 2px; border-radius: 2px; }
  .myrow:hover { background: rgba(255,255,255,.18); }
  .myname { font-weight: bold; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .myrow .arrow { font-size: 8px; opacity: .85; }
  #myText { width: 100%; background: rgba(255,255,255,.92); border-color: #0f2a52; color: #222; font-style: italic; }
  #myText:focus { font-style: normal; }
  .tabs { display: flex; padding: 0 6px; gap: 2px; background: var(--face); border-bottom: 1px solid var(--dark); padding-top: 5px; }
  .tab { padding: 4px 12px 3px; border: 1px solid var(--dark); border-bottom: 0; border-radius: 4px 4px 0 0; background: linear-gradient(#fff, #e3e0d0); margin-bottom: -1px; }
  .tab.on { background: linear-gradient(#fff, #fbfaf5); font-weight: bold; border-top: 2px solid var(--accent); padding-top: 3px; box-shadow: 0 -1px 2px rgba(0,0,0,.06); }
  .tools { display: flex; align-items: center; gap: 2px; padding: 3px 5px; background: linear-gradient(#fff, #f3f1e8); border-bottom: 1px solid #dcd8c6; }
  .tools .tb { width: 28px; min-width: 28px; padding: 0; }
  .tools .srch { margin-left: 4px; flex: 1; min-width: 0; position: relative; display: flex; }
  .tools .srch .ico { position: absolute; left: 5px; top: 3px; width: 14px; height: 14px; opacity: .75; }
  .tools input { flex: 1; min-width: 0; height: 21px; padding-left: 22px; border-radius: 10px; }
  #tree { flex: 1; overflow: auto; background: #fff; padding: 3px 0 10px; }
  .grp { display: flex; align-items: center; gap: 4px; padding: 3px 6px; margin: 4px 3px 1px; font-weight: bold; color: #1f4882; cursor: pointer;
    border-radius: 3px; background: linear-gradient(90deg, #e3ecf8, rgba(227,236,248,0)); border-left: 3px solid #5c8fcf; }
  .grp:hover { text-decoration: underline; }
  .grp .tw { width: 10px; font-size: 8px; color: #555; }
  .row { display: flex; align-items: center; gap: 5px; padding: 2px 6px 2px 18px; margin: 0 3px; cursor: default; min-height: 24px; border-radius: 3px; border: 1px solid transparent; }
  .row:hover { background: linear-gradient(#f5f9ff, #e4eefb); border-color: #c5d6ee; }
  .row.sel { background: linear-gradient(#4a86d8, #2c63b8); border-color: #1d4f9e; color: #fff; }
  .row.sel .stx, .row.sel .muted { color: #dfe8f7; }
  .row .nm { white-space: nowrap; }
  .row .mini { width: 20px; height: 20px; flex: none; border: 1px solid #8a9bb5; border-radius: 3px; box-shadow: 0 1px 1px rgba(0,0,0,.15); }
  .row.off .mini { opacity: .45; filter: grayscale(1); }
  .row .stx { color: #6d6a5d; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .row.off .nm { color: #9a9a9a; }
  .row .badge { margin-left: auto; flex: none; background: var(--accent); color: #000; border-radius: 8px; padding: 0 5px; font-size: 10px; }
  .room-ic { width: 16px; height: 16px; flex: none; border-radius: 3px; background: linear-gradient(#5c8fcf, #2b5a9a); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .room-ic.pub { background: linear-gradient(#f0b429, #c47a00); font-weight: bold; font-size: 11px; }
  .rlist { height: 170px; }
  .rrow { display: grid; grid-template-columns: 18px auto 1fr; column-gap: 5px; align-items: center; padding: 3px 4px; cursor: default; }
  .rrow:hover { background: #e8eef8; } .rrow.sel { background: var(--sel); color: #fff; } .rrow.sel .muted { color: #dfe8f7; }
  .rrow .rtopic { grid-column: 2 / -1; font-size: 10px; font-style: italic; }
  .empty { padding: 14px 16px; color: var(--muted); line-height: 1.5; user-select: text; }
  .warn { margin: 4px 6px; padding: 5px 7px; background: #ffffe1; border: 1px solid #c9b45a; line-height: 1.4; user-select: text; }
  .warn.bad { background: #fde4e0; border-color: #d27b6f; }
  .warn button { margin-top: 4px; }
  .bottom { padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--shadow); }
  .bottom .ad { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 3px;
    background: linear-gradient(135deg, #1f4882, #2f6db5 60%, #e8a400 160%); color: #fff; overflow: hidden; }
  .bottom .ad svg { width: 70px; flex: none; }
  .bottom .ad div { font-size: 10px; line-height: 1.3; }
</style>
</head>
<body>
<div class="menubar"><span data-m="bhoo">Bhoo</span><span data-m="contacts">Bạn bè</span><span data-m="actions">Hành động</span><span data-m="help">Trợ giúp</span></div>
<div class="band me">
  <div class="avatar" id="avatar" title="Bấm để đổi ảnh đại diện"></div>
  <div class="meinfo">
    <div class="myrow" id="myRow" title="Đổi trạng thái"><span id="mySt"></span><span class="myname" id="myName"></span><span class="arrow">▼</span></div>
    <input id="myText" maxlength="100" placeholder="Bạn đang nghĩ gì?…" spellcheck="false" title="Dòng trạng thái — Enter để lưu">
  </div>
</div>
<div class="tabs"><div class="tab on">Bạn bè</div></div>
<div class="tools">
  <button class="tb row" id="bNewRoom" title="Mở phòng chat nhóm"><span class="ic" data-ic="newroom"></span></button>
  <button class="tb row" id="bPub" title="Phòng chat công cộng trong LAN"><span class="ic" data-ic="rooms"></span></button>
  <button class="tb row" id="bAddIp" title="Thêm máy bằng IP (máy khác mạng con)"><span class="ic" data-ic="addip"></span></button>
  <div class="srch"><span class="ico" data-ic="search"></span><input id="search" placeholder="Tìm bạn…" spellcheck="false"></div>
</div>
<div id="warns"></div>
<div id="tree"></div>
<div class="bottom">
  <div class="ad" id="ad"></div>
</div>
<div class="statusbar"><span class="grow" id="sb"></span><span id="fw" title="Tường lửa"></span></div>
<script src="common.js"></script>
<script src="icons.js"></script>
<script src="buddy.js"></script>
</body>
</html>
