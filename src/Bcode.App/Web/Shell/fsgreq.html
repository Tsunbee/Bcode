<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  /* Tự scale theo cỡ cửa sổ (rem 12px → 16px); mật độ / bo góc / viền theo Template giao diện (--dens, --r, --bw trong shell.css). */
  html { font-size: clamp(12px, calc(0.4vw + 7.5px), 16px); }
  html, body { overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--bg); font-size: 1rem; user-select: text; -webkit-user-select: text; }
  button, input, select { font: inherit; color: var(--text); }
  button { background: var(--button-back); border: var(--bw) solid var(--border); border-radius: var(--r); padding: calc(.3rem * var(--dens)) calc(.8rem * var(--dens)); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; pointer-events: none; }
  input[type=text] { background: var(--input); border: var(--bw) solid var(--border); border-radius: var(--r); padding: calc(.3rem * var(--dens)) .5rem; }
  input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; padding: .5rem .8rem; background: var(--panel); border-bottom: var(--bw) solid var(--border); }
  #bar label { color: var(--text-muted); display: inline-flex; align-items: center; gap: .35rem; }
  #bar input { width: 9rem; } #bar #q { width: 14rem; }
  #chips { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; padding: .45rem .8rem; border-bottom: var(--bw) solid var(--border); }
  .chip { display: inline-flex; align-items: center; gap: .35rem; padding: calc(.2rem * var(--dens)) .7rem; border: var(--bw) solid var(--border); border-radius: 999px; background: var(--button-back); cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--button-back)); font-weight: 600; }
  .chip small { color: var(--text-muted); }
  .chip.late { border-color: #d9534f; } .chip.late.on { background: color-mix(in srgb, #d9534f 28%, var(--button-back)); }
  #saved { flex: none; display: none; flex-wrap: wrap; align-items: center; gap: .35rem; padding: .3rem .8rem; border-bottom: var(--bw) solid var(--border); color: var(--text-muted); font-size: .9rem; } #saved.on { display: flex; }
  #saved .sv { display: inline-flex; align-items: center; gap: .3rem; padding: 0 .55rem; border: var(--bw) solid var(--border); border-radius: 999px; background: var(--button-back); color: var(--text); } #saved .sv b { font-weight: 600; } #saved .sv button { padding: 0 .3rem; border: none; background: none; color: var(--text-muted); } #saved .sv button:hover { color: #e66; }
  #vf { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .9rem; padding: .35rem .8rem; border-bottom: var(--bw) solid var(--border); } body.dash #vf { display: none; }
  #vf label { color: var(--text-muted); display: inline-flex; align-items: center; gap: .35rem; } #vf select { max-width: 13rem; } #vf button { padding: .1rem .6rem; }
  #info { color: var(--text-muted); margin-left: auto; }
  #msg { display: none; flex: none; padding: .4rem .8rem; background: color-mix(in srgb, var(--danger) 22%, transparent); border-bottom: var(--bw) solid var(--danger); white-space: pre-wrap; }
  #msg.on { display: block; } #msg.on.note { background: color-mix(in srgb, var(--accent) 16%, transparent); border-bottom-color: var(--accent); }
  #wrap { flex: 1; min-height: 0; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th { position: sticky; top: 0; z-index: 1; background: var(--panel-alt); text-align: left; padding: .3rem .5rem; border: var(--bw) solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  th:hover { color: var(--accent); }
  td { padding: .22rem .5rem; border: var(--bw) solid color-mix(in srgb, var(--border) 70%, transparent); vertical-align: top; }
  td.nd { max-width: 34rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #dtModal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; }
  #dtModal.show { display: flex; }
  #dtBox { width: min(60rem, 92vw); max-height: 86vh; display: flex; flex-direction: column; background: var(--panel, #222); color: var(--text, #ddd); border: 1px solid var(--border, #555); border-radius: .5rem; padding: .8rem 1rem; gap: .5rem; }
  #dtBox .dtHead { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 1.05rem; }
  #dtBox .dtBtns button { margin-left: .4rem; }
  #dtMeta { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .92rem; opacity: .85; }
  #dtBody { overflow: auto; white-space: pre-wrap; word-break: break-word; user-select: text; line-height: 1.5; border-top: 1px solid var(--border, #555); padding-top: .5rem; }
  td.c { text-align: center; white-space: nowrap; } td.nw { white-space: nowrap; }
  tr:hover td { background: var(--selection); }
  tr.late td { background: color-mix(in srgb, #d9534f 26%, transparent); }
  tr.due td { background: color-mix(in srgb, #e0a800 26%, transparent); }
  tr.late td.st, tr.due td.st { font-weight: 700; }
  .tag { display: inline-block; padding: 0 .45rem; border-radius: 999px; border: var(--bw) solid var(--border); white-space: nowrap; }
  .g-undone .tag { border-color: #e0a800; } .g-done .tag { border-color: #2e9a5b; } .g-up .tag { border-color: #3b7dd8; } .g-wait .tag { border-color: #8e8e8e; } .g-cancel .tag { border-color: #8e5cc9; color: var(--text-muted); }
  .legend { display: inline-flex; align-items: center; gap: .3rem; color: var(--text-muted); } .legend i { width: .9rem; height: .9rem; border-radius: 3px; display: inline-block; }
  #bar input.w { width: 8rem; }
  .seg { display: inline-flex; } .seg button { border-radius: 0; margin-left: -1px; } .seg button:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; } .seg button:last-child { border-radius: 0 var(--r) var(--r) 0; }
  .seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  select { background: var(--input); border: var(--bw) solid var(--border); border-radius: var(--r); padding: calc(.25rem * var(--dens)) .4rem; color: var(--text); font: inherit; }
  #dash { flex: 1; min-height: 0; overflow: auto; padding: .8rem; display: none; flex-direction: column; gap: .9rem; }
  body.dash #dash { display: flex; } body.dash #wrap, body.dash #chips { display: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem; }
  .kpi { border: var(--bw) solid var(--border); border-radius: var(--r-lg); background: var(--panel); padding: .55rem .8rem; cursor: pointer; }
  .kpi:hover { border-color: var(--accent); }
  .kpi b { display: block; font-size: 1.7rem; line-height: 1.15; } .kpi span { color: var(--text-muted); font-size: .88rem; }
  .kpi.late { border-color: #d9534f; } .kpi.late b { color: #e66; } .kpi.due b { color: #e0a800; }
  .brk { width: 100%; border-collapse: collapse; font-size: .94rem; } .brk td, .brk th { padding: .3rem .55rem; border: var(--bw) solid color-mix(in srgb, var(--border) 70%, transparent); }
  .brk tbody tr { cursor: pointer; } .brk tbody tr:hover td { background: var(--selection); } .brk td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .brk tr.tot td { font-weight: 700; background: var(--panel-alt); border-top: calc(var(--bw) * 2) solid var(--border); cursor: default; } .brk tr[data-proj] { cursor: pointer; }
  .brk td.late { color: #e66; font-weight: 700; } .brk td.bar { width: 30%; min-width: 8rem; padding: .3rem .5rem; }
  .stack { display: flex; height: .8rem; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--border) 50%, transparent); }
  .stack i { display: block; height: 100%; } .s-undone { background: #e0a800; } .s-done { background: #2e9a5b; } .s-up { background: #3b7dd8; } .s-wait { background: #8e8e8e; } .s-cancel { background: #8e5cc9; } .s-other { background: #555; }
  .dh { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; } .dh h3 { margin: 0; font-size: 1.05rem; }
  #prio { flex: 1; min-height: 0; overflow: auto; padding: .8rem; display: none; flex-direction: column; gap: .8rem; }
  body.prio #prio { display: flex; } body.prio #wrap, body.prio #chips, body.prio #dash { display: none; }
  .pnote { color: var(--text-muted); font-size: .9rem; line-height: 1.45; border: var(--bw) dashed var(--border); border-radius: var(--r); padding: .45rem .7rem; }
  .ptabs { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .pt { width: 100%; border-collapse: collapse; font-size: .92rem; } .pt th { position: sticky; top: 0; background: var(--panel-alt); text-align: left; padding: .3rem .5rem; border: var(--bw) solid var(--border); white-space: nowrap; }
  .pt td { padding: .25rem .5rem; border: var(--bw) solid color-mix(in srgb, var(--border) 70%, transparent); vertical-align: top; } .pt tr:hover td { background: var(--selection); }
  .pt td.n { text-align: center; font-weight: 700; } .pt td.nd { max-width: 30rem; } .pt td.nd div { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv { display: inline-block; padding: 0 .5rem; border-radius: 999px; border: var(--bw) solid var(--border); white-space: nowrap; }
  .lv.e { border-color: #2e9a5b; color: #4cc27e; } .lv.m { border-color: #e0a800; color: #e0a800; } .lv.h { border-color: #d9534f; color: #e66; }
  .why { display: inline-block; margin: .1rem .2rem .1rem 0; padding: 0 .4rem; border-radius: 4px; background: color-mix(in srgb, var(--border) 45%, transparent); font-size: .82rem; white-space: nowrap; } .why.r { background: color-mix(in srgb, #d9534f 30%, transparent); } .why.g { background: color-mix(in srgb, #2e9a5b 30%, transparent); }
  mark { background: color-mix(in srgb, #e0a800 55%, transparent); color: inherit; border-radius: 2px; }
  .empty { padding: 2rem; text-align: center; color: var(--text-muted); }
</style>
</head>
<body data-area="result">
<div id="bar">
  <label>Mã dự án <input id="maDa" class="w" type="text" placeholder="nhiều mã: A, B" title="Nhiều giá trị cách nhau dấu phẩy / khoảng trắng; trống = mọi dự án" /></label>
  <label>Bộ phận LT <input id="bpLt" class="w" type="text" placeholder="nhiều phòng: P1, P2" title="bp_lt — kéo nhiều phòng lập trình cùng lúc" /></label>
  <label>Người <input id="person" class="w" type="text" placeholder="LT hoặc triển khai" title="Khớp ma_lt1 HOẶC ma_nv1 — không cần biết người đó đứng ở cột nào" /></label>
  <label>Mã YC <input id="fcode" class="w" type="text" placeholder="vd TLKSXD-054" title="Kéo các yêu cầu có mã chứa chữ này (nhiều mã cách nhau dấu phẩy)" /></label>
  <label>Nội dung <input id="content" class="w" type="text" placeholder="từ khoá trong nội dung" title="Kéo các yêu cầu có nội dung chứa TẤT CẢ các từ này" /></label>
  <label>Lập trình <input id="lt" class="w" type="text" placeholder="ma_lt1" title="Chỉ cột ma_lt1; nhiều giá trị cách nhau dấu phẩy" /></label>
  <label>Triển khai <input id="nv" class="w" type="text" placeholder="ma_nv1" title="Chỉ cột ma_nv1; nhiều giá trị cách nhau dấu phẩy" /></label>
  <button id="btnFetch" class="primary" title="Kéo yêu cầu từ database FSG (chỉ đọc)">⟳ Kéo về</button>
  <label title="Tự kéo lại để theo dõi">Tự làm mới <select id="auto"><option value="0">Tắt</option><option value="2">2 phút</option><option value="5">5 phút</option><option value="10">10 phút</option></select></label>
  <span class="seg"><button id="vwList" class="on">Chi tiết</button><button id="vwDash">Dashboard</button><button id="vwPrio" title="Gợi ý nên làm yêu cầu nào trước, việc nào dễ / khó">Gợi ý ưu tiên</button></span>
  <label>Tìm <input id="q" type="text" placeholder="tìm trong dữ liệu: mã YC, nội dung, menu… (nhiều từ)" /></label>
  <button id="btnCopy" title="Chép các dòng đang hiện (dạng bảng, dán vào Excel)">Copy</button>
  <span id="info"></span>
</div>
<div id="saved"></div>
<div id="vf"></div>
<div id="chips"></div>
<div id="msg"></div>
<div id="dash"></div>
<div id="prio"></div>
<div id="dtModal"><div id="dtBox">
  <div class="dtHead"><b id="dtTitle"></b><span class="dtBtns"><button id="dtCopy">Copy nội dung</button><button id="dtClose">Đóng (Esc)</button></span></div>
  <div id="dtMeta"></div>
  <div id="dtBody"></div>
</div></div>
<div id="wrap"><div class="empty" id="empty">Nhập điều kiện rồi bấm “Kéo về”.</div><table id="tbl" hidden></table></div>

<script>
(() => {
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Trạng thái yêu cầu → nhóm
  const STATUS = { DD: ['Đã duyệt', 'undone'], TH: ['Đang thực hiện', 'undone'], DT: ['Đang test', 'done'], OK: ['Đã test', 'done'], UP: ['Đã up', 'up'], CH: ['Chờ', 'wait'], KL: ['Không làm', 'cancel'] };
  const GROUPS = [['undone', 'Chưa làm', 'DD, TH'], ['done', 'Hoàn thành', 'DT, OK'], ['up', 'Up', 'UP'], ['wait', 'Chờ', 'CH'], ['cancel', 'Hủy', 'KL']];
  const COLS = [['maDa', 'Mã DA'], ['menuId', 'Menu ID'], ['tenMenuNgan', 'Tên menu'], ['trangTlks', 'Trang TLKS'], ['tlksYn', 'Có trong TLKS'], ['bpLt', 'BP lập trình'], ['fcode1', 'Mã yêu cầu'], ['noiDung', 'Nội dung yêu cầu'],
    ['maLt1', 'Lập trình'], ['maNv1', 'Triển khai'], ['ngayHt', 'Hạn hoàn thành'], ['trangThai', 'Trạng thái']];

  let prioShown = [];
  let vfil = { maDa: '', maLt1: '', maNv1: '' }, fetchedAt = '', dimF = [], tlksF = '', view = 'list', timer = 0, rows = [], today = '', on = new Set(GROUPS.map((g) => g[0]).concat(['other'])), onlyLate = false, sortKey = '', sortDir = 1;
  const stOf = (r) => { const k = String(r.trangThai || '').trim().toUpperCase(); return STATUS[k] ? { code: k, label: STATUS[k][0], group: STATUS[k][1] } : { code: k, label: k || '(trống)', group: 'other' }; };
  // Tới hạn mà chưa hoàn thành = nhóm “Chưa làm” (DD, TH) có hạn <= hôm nay: quá hạn (đỏ) hoặc đến hạn hôm nay (vàng).
  const dueOf = (r) => { if (stOf(r).group !== 'undone' || !r.ngayHt || !today) return ''; return r.ngayHt < today ? 'late' : r.ngayHt === today ? 'due' : ''; };
  // tlks_yn: 1 / True / Y = có trong tài liệu khảo sát; 0 / False / N = ngoài TLKS; trống = chưa khai
  const tlksOf = (r) => { const v = String(r.tlksYn == null ? '' : r.tlksYn).trim().toLowerCase(); return ['1', 'true', 'y', 'yes', 'c', 'có', 'co', 'x'].includes(v) ? 'yes' : ['0', 'false', 'n', 'no', 'k', 'không', 'khong'].includes(v) ? 'no' : 'unk'; };
  const TL = { yes: 'Trong TLKS (=1)', no: 'Ngoài TLKS (=0)', unk: 'Chưa khai TLKS' };
  const fmtAt = (t) => t ? t.slice(8, 10) + '/' + t.slice(5, 7) + ' ' + t.slice(11, 16) : '';
  const fmtDate = (d) => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';

  // Ô "Tìm": không phân biệt hoa thường / dấu, nhiều từ = phải chứa tất cả; tìm trong mã yêu cầu, nội dung, menu, mã DA, người, trạng thái
  const nrm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  const qWords = () => nrm($('q').value).split(/\s+/).filter(Boolean);
  const qOk = (r) => { const w = qWords(); if (!w.length) return true; const h = nrm([r.maDa, r.menuId, r.tenMenuNgan, r.bpLt, r.fcode1, r.noiDung, r.maLt1, r.maNv1, r.trangThai].join(' ')); return w.every((x) => h.includes(x)); };
  const hl = (txt) => { const w = qWords(); const e = esc(txt); if (!w.length) return e; const n = nrm(txt); if (n.length !== String(txt).length) return e; const mark = new Array(n.length).fill(false); w.forEach((x) => { let i = n.indexOf(x); while (i >= 0) { for (let k = i; k < i + x.length; k++) mark[k] = true; i = n.indexOf(x, i + x.length); } }); let o = '', on2 = false; const t = String(txt); for (let k = 0; k < t.length; k++) { if (mark[k] && !on2) { o += '<mark>'; on2 = true; } if (!mark[k] && on2) { o += '</mark>'; on2 = false; } o += esc(t[k]); } return o + (on2 ? '</mark>' : ''); };
  const vfOk = (r) => Object.keys(vfil).every((k) => !vfil[k] || String(r[k] || '') === vfil[k]);
  // Lọc nhanh trên dữ liệu đã kéo: dự án / lập trình / triển khai (chọn trong danh sách các giá trị có trong dữ liệu, kèm số yêu cầu)
  const renderVf = () => {
    const defs = [['maDa', 'Dự án'], ['maLt1', 'Lập trình'], ['maNv1', 'Triển khai']];
    defs.forEach(([k]) => { if (vfil[k] && !rows.some((r) => String(r[k] || '') === vfil[k])) vfil[k] = ''; });
    const opts = (k) => { const m = new Map(); rows.forEach((r) => { const v = String(r[k] || ''); m.set(v, (m.get(v) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])); };
    $('vf').innerHTML = defs.map(([k, t]) => `<label>${t} <select data-vf="${k}"><option value="">Tất cả</option>${opts(k).map(([v, n]) => `<option value="${esc(v)}"${vfil[k] === v ? ' selected' : ''}>${esc(v || '(trống)')} (${n})</option>`).join('')}</select></label>`).join('')
      + (Object.values(vfil).some(Boolean) ? '<button id="vfClear" title="Bỏ các lọc dự án / lập trình / triển khai">✕ Bỏ lọc</button>' : '');
  };
  $('vf').addEventListener('change', (e) => { const k = e.target.dataset.vf; if (k) { vfil[k] = e.target.value; render(); } });
  $('vf').addEventListener('click', (e) => { if (e.target.id === 'vfClear') { vfil = { maDa: '', maLt1: '', maNv1: '' }; render(); } });
  const visible = () => {
    let v = rows.filter((r) => dimF.every((f) => String(r[f.k] || '') === f.v) && vfOk(r) && (!tlksF || tlksOf(r) === tlksF) && on.has(stOf(r).group) && (!onlyLate || dueOf(r) === 'late' || dueOf(r) === 'due')
      && qOk(r));
    if (sortKey) v = v.slice().sort((a, b) => (String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), 'vi', { numeric: true })) * sortDir);
    return v;
  };

  const DIMS = [['bpLt', 'Bộ phận lập trình'], ['maLt1', 'Lập trình'], ['maNv1', 'Triển khai'], ['maDa', 'Dự án']];
  let scope = '';   // '' = tổng tất cả dự án | mã dự án = chỉ dự án đó | '*' = tất cả + bảng tổng từng dự án
  let dim = 'maLt1', dim2 = 'maDa';   // mặc định: Lập trình × Dự án
  const renderChips = () => {
    const cnt = (g) => rows.filter((r) => stOf(r).group === g).length;
    const late = rows.filter((r) => dueOf(r) === 'late').length, due = rows.filter((r) => dueOf(r) === 'due').length;
    $('chips').innerHTML = GROUPS.map(([g, t, codes]) => `<span class="chip${on.has(g) ? ' on' : ''}" data-g="${g}" title="${codes}">${t} <small>${cnt(g)}</small></span>`).join('')
      + (rows.some((r) => stOf(r).group === 'other') ? `<span class="chip${on.has('other') ? ' on' : ''}" data-g="other" title="Trạng thái khác">Khác <small>${cnt('other')}</small></span>` : '')
      + (tlksF ? `<span class="chip on" data-untl="1" title="Bỏ lọc TLKS">${TL[tlksF]} ✕</span>` : '')
      + dimF.map((f, i) => `<span class="chip on" data-undim="${i + 1}" title="Bỏ lọc theo chiều này">${esc((DIMS.find((d) => d[0] === f.k) || [0, f.k])[1])}: ${esc(f.v || '(trống)')} ✕</span>`).join('')

  $('saved').addEventListener('click', (e) => { const b = e.target.closest('[data-drop]'); if (b && confirm('Bỏ dữ liệu đã lưu của dự án ' + b.dataset.drop + '? (kéo lại là có)')) post('drop', { ma: b.dataset.drop }); });
  $('chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (c.dataset.untl) tlksF = ''; else if (c.dataset.undim) dimF.splice(+c.dataset.undim - 1, 1); else if (c.dataset.late) onlyLate = !onlyLate; else { const g = c.dataset.g; if (on.has(g)) on.delete(g); else on.add(g); }
    render();
  });
  // Bấm vào ô "Nội dung yêu cầu" (hoặc nhấp đúp dòng) → xem đầy đủ nội dung + thông tin yêu cầu; không cắt chữ, chọn / copy được.
  let shown = [];
  $('prio').addEventListener('click', (e) => { const td = e.target.closest('td.nd'); const tr = td && td.closest('tr[data-pi]'); if (tr && prioShown[+tr.dataset.pi]) openDetail(prioShown[+tr.dataset.pi]); });
  const openDetail = (r) => {
    const s = stOf(r);
    $('dtTitle').textContent = (r.fcode1 || '') + (r.tenMenuNgan ? ' — ' + r.tenMenuNgan : '');
    $('dtMeta').innerHTML = [['Mã DA', r.maDa], ['Menu ID', r.menuId], ['BP lập trình', r.bpLt], ['Lập trình', r.maLt1], ['Triển khai', r.maNv1], ['Hạn hoàn thành', fmtDate(r.ngayHt)], ['Trạng thái', s.label]]
      .map(([k, x]) => `<span><b>${k}:</b> ${esc(x || '—')}</span>`).join('');
    $('dtBody').textContent = String(r.noiDung == null ? '' : r.noiDung);
    $('dtModal').classList.add('show');
  };
  $('tbl').addEventListener('click', (e) => { const td = e.target.closest('td.nd'); if (!td) return; const tr = td.closest('tr[data-i]'); if (tr && shown[+tr.dataset.i]) openDetail(shown[+tr.dataset.i]); });
  $('tbl').addEventListener('dblclick', (e) => { const tr = e.target.closest('tr[data-i]'); if (tr && shown[+tr.dataset.i]) openDetail(shown[+tr.dataset.i]); });
  $('dtClose').onclick = () => $('dtModal').classList.remove('show');
  $('dtModal').addEventListener('click', (e) => { if (e.target.id === 'dtModal') $('dtModal').classList.remove('show'); });
  $('dtCopy').onclick = () => { const t = $('dtBody').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }); $('dtCopy').textContent = 'Đã copy'; setTimeout(() => { $('dtCopy').textContent = 'Copy nội dung'; }, 1200); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('dtModal').classList.remove('show'); });
  $('tbl').addEventListener('click', (e) => { const th = e.target.closest('th[data-k]'); if (!th) return; if (sortKey === th.dataset.k) sortDir = -sortDir; else { sortKey = th.dataset.k; sortDir = 1; } render(); });
  $('q').addEventListener('input', render);
  const fetchNow = () => post('fetch', { maDa: $('maDa').value, bpLt: $('bpLt').value, person: $('person').value, fcode: $('fcode').value, content: $('content').value, programmer: $('lt').value, deployer: $('nv').value });
  $('btnFetch').addEventListener('click', fetchNow);
  ['maDa', 'bpLt', 'person', 'fcode', 'content', 'lt', 'nv'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchNow(); }));
  $('btnCopy').addEventListener('click', () => {
    const v = visible(); if (!v.length) return;
    const line = (r) => [r.maDa, r.menuId, r.tenMenuNgan, r.trangTlks, r.tlksYn, r.bpLt, r.fcode1, String(r.noiDung || '').replace(/[\t\r\n]+/g, ' '), r.maLt1, r.maNv1, fmtDate(r.ngayHt), stOf(r).label].join('\t');
    post('copy', { text: COLS.map((c) => c[1]).join('\t') + '\r\n' + v.map(line).join('\r\n') });
  });

  window.fsgReq = {
    init(i) { $('maDa').value = i.maDa || ''; $('bpLt').value = i.bpLt || ''; $('person').value = i.person || ''; $('lt').value = i.programmer || ''; $('nv').value = i.deployer || ''; $('fcode').value = i.fcode || ''; $('content').value = i.content || ''; },
    setBusy(b) { $('btnFetch').disabled = b; $('btnFetch').textContent = b ? 'Đang kéo…' : '⟳ Kéo về'; },
    onData(r) {
      $('msg').className = r.error ? 'on' : ''; $('msg').textContent = r.error || '';
      if (r.rows) rows = r.rows; today = r.today || today; fetchedAt = r.fetchedAt || fetchedAt;
      const pj = r.projects || [];
      $('saved').className = pj.length ? 'on' : '';
      $('saved').innerHTML = pj.length ? '<span>Dữ liệu đã lưu:</span>' + pj.map((x) => `<span class="sv" title="Kéo lúc ${esc(fmtAt(x.at))}"><b>${esc(x.ma || '(trống)')}</b> ${x.n} yêu cầu · ${esc(fmtAt(x.at))}<button data-drop="${esc(x.ma)}" title="Bỏ dữ liệu đã lưu của dự án này">✕</button></span>`).join('') : '';
      render();
      if (r.cached && !r.error) { $('msg').className = 'on note'; $('msg').textContent = 'Đang hiện dữ liệu đã lưu lần kéo trước' + (fetchedAt ? ' (' + fmtAt(fetchedAt) + ')' : '') + ' — bấm “Kéo về” để cập nhật.'; }
      if (!r.error && !rows.length) { $('empty').hidden = false; $('empty').textContent = 'Không có yêu cầu nào theo điều kiện đã nhập.'; }
    },
  };
  window.setTheme = window.setTheme || function () {};
  post('ready');
})();
</script>
</body>
</html>
