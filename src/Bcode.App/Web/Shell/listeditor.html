<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="dialog.css" />
<style>
  .wrap { flex: 1; min-height: 0; display: flex; gap: .6rem; }
  .side { flex: none; display: flex; flex-direction: column; gap: .4rem; }
  .side button { padding: calc(.3rem * var(--dens)) .6rem; min-width: 2.4rem; font-size: 1.05rem; }
  .tbl input[type=text] { width: 100%; box-sizing: border-box; background: transparent; border-color: transparent; font-family: Consolas, 'Cascadia Mono', monospace; }
  .tbl input[type=text]:focus { background: var(--input); border-color: var(--accent); }
  .tbl td.n { width: 2.6rem; text-align: right; color: var(--text-muted); cursor: pointer; user-select: none; }
  .tbl tr.sel td.n { background: var(--accent); color: var(--on-accent); }
  .tbl td { max-width: none; padding: .05rem .2rem; }
</style>
</head>
<body>
<div class="dlg-main">
  <div id="cap" class="muted"></div>
  <div class="wrap">
    <div class="tbl-wrap"><table class="tbl"><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    <div class="side">
      <button id="bUp" title="Đưa dòng lên (Ctrl+↑)">↑</button><button id="bDown" title="Đưa dòng xuống (Ctrl+↓)">↓</button>
      <button id="bAdd" title="Thêm dòng bên dưới (Ctrl+Enter)">＋</button><button id="bDel" class="danger" title="Xoá dòng đang chọn (Ctrl+Delete)">✕</button>
    </div>
  </div>
</div>
<div class="dlg-bar"><span id="status" class="status"></span><button id="bCancel">Cancel</button><button id="bSave" class="primary">✓ Save</button></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let cols = [], n = 0, sel = 0;       // cols[i] = { name, items: [] }; n = số dòng

  function render(focusRow, focusCol) {
    $('head').innerHTML = '<tr><th style="width:2.6rem"></th>' + cols.map((c) => '<th>' + esc(c.name) + '</th>').join('') + '</tr>';
    let html = '';
    for (let r = 0; r < n; r++) {
      html += '<tr data-r="' + r + '"' + (r === sel ? ' class="sel"' : '') + '><td class="n">' + (r + 1) + '</td>' +
        cols.map((c, ci) => '<td><input type="text" data-r="' + r + '" data-c="' + ci + '" value="' + esc(c.items[r] || '') + '" spellcheck="false"></td>').join('') + '</tr>';
    }
    $('rows').innerHTML = html;
    $('status').textContent = n + ' dòng';
    if (focusRow != null) { const el = $('rows').querySelector('input[data-r="' + focusRow + '"][data-c="' + (focusCol || 0) + '"]'); if (el) { el.focus(); el.select(); } }
  }
  function normalize() { cols.forEach((c) => { while (c.items.length < n) c.items.push(''); }); }
  const move = (d) => { const j = sel + d; if (j < 0 || j >= n) return; cols.forEach((c) => { const t = c.items[sel]; c.items[sel] = c.items[j]; c.items[j] = t; }); const col = focusedCol(); sel = j; render(j, col); };
  const focusedCol = () => { const a = document.activeElement; return a && a.dataset && a.dataset.c ? parseInt(a.dataset.c, 10) : 0; };
  const addRow = () => { const at = sel + 1; cols.forEach((c) => c.items.splice(at, 0, '')); n++; sel = at; render(at, 0); };
  const delRow = () => { if (!n) return; cols.forEach((c) => c.items.splice(sel, 1)); n--; sel = Math.min(sel, n - 1); if (sel < 0) sel = 0; render(n ? sel : null, 0); };

  $('rows').addEventListener('input', (e) => { const t = e.target; if (t.dataset.r != null) cols[parseInt(t.dataset.c, 10)].items[parseInt(t.dataset.r, 10)] = t.value; });
  $('rows').addEventListener('focusin', (e) => { const t = e.target; if (t.dataset.r != null) { sel = parseInt(t.dataset.r, 10); document.querySelectorAll('#rows tr').forEach((tr) => tr.classList.toggle('sel', parseInt(tr.dataset.r, 10) === sel)); } });
  $('rows').addEventListener('click', (e) => { const td = e.target.closest('td.n'); if (td) { sel = parseInt(td.parentElement.dataset.r, 10); render(sel, 0); } });
  $('rows').addEventListener('keydown', (e) => {
    const t = e.target; if (t.dataset.r == null) return; const r = parseInt(t.dataset.r, 10), c = parseInt(t.dataset.c, 10);
    if (e.ctrlKey && e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.ctrlKey && e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); addRow(); }
    else if (e.ctrlKey && e.key === 'Delete') { e.preventDefault(); delRow(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); const el = $('rows').querySelector('input[data-r="' + (r + 1) + '"][data-c="' + c + '"]'); if (el) { el.focus(); el.select(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); const el = $('rows').querySelector('input[data-r="' + (r - 1) + '"][data-c="' + c + '"]'); if (el) { el.focus(); el.select(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (r === n - 1 && c === cols.length - 1) { sel = r; addRow(); } else { const nc = c + 1 < cols.length ? [r, c + 1] : [r + 1, 0]; const el = $('rows').querySelector('input[data-r="' + nc[0] + '"][data-c="' + nc[1] + '"]'); if (el) { el.focus(); el.select(); } } }
  });
  $('bUp').onclick = () => move(-1); $('bDown').onclick = () => move(1); $('bAdd').onclick = addRow; $('bDel').onclick = delRow;
  const save = () => post('save', { columns: cols.map((c) => ({ name: c.name, items: c.items })) });
  $('bSave').onclick = save; $('bCancel').onclick = () => post('cancel');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('cancel'); else if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  window.listEditor = {
    init(d) { $('cap').textContent = d.caption; cols = d.columns.map((c) => ({ name: c.name, items: c.items.slice() })); n = Math.max(1, ...cols.map((c) => c.items.length)); normalize(); sel = 0; render(0, 0); },
  };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
</body>
</html>
