<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body { display: flex; flex-direction: column; background: var(--panel); }
  input[type="text"], textarea { user-select: text; -webkit-user-select: text; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(200px, 30%) 1fr; }
  .left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel-alt); }
  .left .top { display: flex; gap: 6px; padding: 8px; }
  .left .top input { flex: 1; min-width: 0; }
  .list { flex: 1; overflow-y: auto; }
  .cat { padding: 6px 10px 3px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); position: sticky; top: 0; background: var(--panel-alt); }
  .item { padding: 6px 12px 6px 18px; cursor: pointer; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid transparent; }
  .item:hover { background: var(--button-back); }
  .item.sel { background: var(--selection); border-left-color: var(--accent); }
  .empty { padding: 20px 12px; color: var(--text-muted); text-align: center; font-size: 12.5px; }

  .right { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 16px; gap: 8px; }
  .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
  label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 3px; }
  .right input[type="text"] { width: 100%; }
  textarea { flex: 1; min-height: 160px; width: 100%; resize: none; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
             padding: 10px; font: 13px/1.5 Consolas, monospace; outline: none; tab-size: 4; }
  textarea:focus { border-color: var(--accent); }
  .cwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .none { margin: auto; color: var(--text-muted); }

  .pathbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 14px; background: var(--panel-alt); border-top: 1px solid var(--border); font-size: 12px; }
  .pathbar .k { color: var(--text-muted); white-space: nowrap; }
  .pathbar code { flex: 1 1 260px; min-width: 0; word-break: break-all; user-select: text; -webkit-user-select: text; font-family: Consolas, monospace; font-size: 12px; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 14px; background: var(--panel-alt); border-top: 1px solid var(--border); }
  #status { flex: 1 1 200px; min-width: 0; font-size: 12.5px; color: var(--text-muted); }
  #status.ok { color: var(--success); } #status.err { color: var(--danger); } #status.dirty { color: var(--warning); }
  footer .actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .btn-border { border-color: var(--border); }
  .btn-danger { color: var(--danger); border-color: var(--danger); } .btn-danger:hover { background: var(--danger); color: #fff; }
  @media (max-width: 640px) { .split { grid-template-columns: 1fr; grid-template-rows: minmax(120px, 34%) 1fr; } .left { border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<div class="split">
  <div class="left">
    <div class="top">
      <input type="text" id="q" placeholder="Lọc snippet..." spellcheck="false" />
      <button class="btn btn-border" id="bNew" title="Thêm snippet mới">＋ New</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="right" id="editor">
    <div class="row2">
      <div><label for="name">Name</label><input type="text" id="name" spellcheck="false" /></div>
      <div><label for="cat">Category</label><input type="text" id="cat" list="cats" spellcheck="false" /><datalist id="cats"></datalist></div>
      <div><label for="proj">Dự án (trống = mọi dự án)</label><input type="text" id="proj" list="projs" spellcheck="false" placeholder="mọi dự án" /><datalist id="projs"></datalist></div>
    </div>
    <div class="cwrap"><label for="content">Nội dung</label><textarea id="content" spellcheck="false"></textarea></div>
  </div>
</div>

<div class="pathbar">
  <span class="k">📁 Lưu tại:</span>
  <code id="path"></code>
  <button class="btn btn-border" id="bCopyPath" title="Copy đường dẫn đầy đủ">Copy</button>
  <button class="btn btn-border" id="bOpen" title="Mở thư mục chứa file">Mở thư mục</button>
</div>
<footer>
  <div id="status"></div>
  <div class="actions">
    <button class="btn btn-danger" id="bDelete">Delete</button>
    <button class="btn btn-border" id="bClose">Đóng</button>
    <button class="btn btn-border" id="bSave" title="Lưu toàn bộ snippet xuống file (Ctrl+S)">💾 Save</button>
    <button class="btn btn-primary" id="bInsert" title="Chèn nội dung vào Script Editor đang mở">Insert vào Script Editor</button>
  </div>
</footer>

<script>
  let curProject = '', onlyCur = false;
  let items = [];       // { name, category, content }
  let sel = -1;
  let dirty = false;
  const $ = (id) => document.getElementById(id);
  function post(action, data) { window.chrome.webview.postMessage(JSON.stringify({ action, data })); }
  function setStatus(text, kind) { const s = $('status'); s.textContent = text || ''; s.className = kind || ''; }
  function markDirty() { if (!dirty) { dirty = true; setStatus('● Có thay đổi chưa lưu', 'dirty'); } }

  function flush() {
    if (sel < 0 || !items[sel]) return;
    items[sel].name = $('name').value.trim();
    items[sel].category = $('cat').value.trim() || 'General';
    items[sel].project = $('proj').value.trim();
    items[sel].content = $('content').value;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const host = $('list'); host.textContent = '';
    const groups = new Map();
    items.forEach((it, i) => {
      if (q && !(it.name + ' ' + it.category + ' ' + it.content + ' ' + (it.project || '')).toLowerCase().includes(q)) return;
      if (onlyCur && it.project && it.project.toLowerCase() !== curProject.toLowerCase()) return;
      if (!groups.has(it.category)) groups.set(it.category, []);
      groups.get(it.category).push(i);
    });
    if (!groups.size) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = items.length ? 'Không có snippet nào khớp.' : 'Chưa có snippet. Bấm ＋ New.'; host.appendChild(e); }
    [...groups.keys()].forEach((cat) => {
      const c = document.createElement('div'); c.className = 'cat'; c.textContent = cat; host.appendChild(c);
      groups.get(cat).forEach((i) => {
        const d = document.createElement('div'); d.className = 'item' + (i === sel ? ' sel' : ''); d.textContent = (items[i].name || '(chưa đặt tên)') + (items[i].project ? '  ·  ' + items[i].project : '');
        d.title = cat + ' / ' + items[i].name;
        d.onclick = () => { flush(); select(i); };
        host.appendChild(d);
      });
    });
    const dl = $('cats'); dl.textContent = '';
    [...new Set(items.map((x) => x.category))].forEach((c) => { const o = document.createElement('option'); o.value = c; dl.appendChild(o); });
  }

  function select(i) {
    sel = i;
    const it = items[i];
    $('editor').style.visibility = it ? 'visible' : 'hidden';
    if (it) { $('name').value = it.name; $('cat').value = it.category; $('proj').value = it.project || ''; $('content').value = it.content; }
    $('bDelete').disabled = !it; $('bInsert').disabled = !it;
    render();
  }

  // Sửa trên ô nào cũng cập nhật ngay vào danh sách (list bên trái đổi tên theo) và đánh dấu chưa lưu.
  ['name', 'cat', 'proj', 'content'].forEach((id) => $(id).addEventListener('input', () => { flush(); markDirty(); if (id !== 'content') render(); }));
  $('q').addEventListener('input', render);

  $('bNew').onclick = () => { flush(); items.push({ name: 'New Snippet', category: $('cat').value.trim() || 'General', content: '', project: onlyCur ? curProject : $('proj').value.trim() }); markDirty(); select(items.length - 1); $('name').focus(); $('name').select(); };
  $('bDelete').onclick = () => {
    if (sel < 0) return;
    if (!confirm('Xoá snippet "' + items[sel].name + '"?\n\n(Chỉ ghi xuống file khi bấm Save.)')) return;
    items.splice(sel, 1); markDirty(); select(Math.min(sel, items.length - 1));
  };
  function save() { flush(); post('save', { items }); }
  $('bSave').onclick = save;
  $('bInsert').onclick = () => { flush(); post('insert', { content: items[sel] ? items[sel].content : '' }); };
  $('bClose').onclick = () => { if (dirty && !confirm('Có thay đổi chưa lưu. Đóng và bỏ qua?')) return; post('close'); };
  $('bCopyPath').onclick = () => post('copyPath');
  $('bOpen').onclick = () => post('openFolder');
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if (e.key === 'Escape') $('bClose').click();
  });

  // ---- Called from C# ----
  window.setTheme = (isDark) => document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  window.init = (state) => {
    items = state.items.map((x) => ({ name: x.name || '', category: x.category || 'General', content: x.content || '', project: x.project || '' }));
    curProject = state.currentProject || ''; onlyCur = !!curProject;
    const pl = $('projs'); pl.textContent = ''; (state.projects || []).forEach((p) => { const o = document.createElement('option'); o.value = p; pl.appendChild(o); });
    const cb = $('onlyCur'); if (cb) { cb.checked = onlyCur; cb.parentElement.style.display = curProject ? '' : 'none'; document.getElementById('curName').textContent = curProject; }
    $('path').textContent = state.path;
    dirty = false;
    select(items.length ? 0 : -1);
    if (!items.length) $('editor').style.visibility = 'hidden';
  };
  window.saved = (ok, message) => { if (ok) dirty = false; setStatus(message, ok ? 'ok' : 'err'); };

  post('ready');
</script>
</body>
</html>
