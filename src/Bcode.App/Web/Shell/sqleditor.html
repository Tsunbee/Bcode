<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body, #editor-container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1e1e1e;
        }
        /* Chấm cảnh báo ở lề trái (glyph margin), ngay bên cạnh dòng code bị lỗi dấu
           (thiếu/dư dấu nháy, dấu ngoặc, dấu phẩy...) — xem lintSqlPunctuation(). */
        .bcodeDauError::before { content: '●'; color: #f14c4c; font-size: 13px; line-height: 18px; }
        .bcodeDauWarn::before { content: '●'; color: #e2c08d; font-size: 13px; line-height: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="editor-container"></div>

    <script>
        var editor;
        var isReady = false;
        
        // Quản lý trạng thái Copilot Inline
        window.copilotEnabled = true;
        // Gợi ý TỰ ĐỘNG khi đang gõ (bật/tắt ở menu ⚙). Tắt thì chỉ còn gợi ý khi bấm Alt+\ (gọi tay).
        window.copilotAuto = true;
        var _copilotReqCounter = 0;
        var _copilotResolvers = {};
        var _copilotDebounceTimer = null;
        var _lateCopilotSuggestion = null; // { text, position, modelVersion }
        // Danh sách bảng trong Database nạp từ C#
        var _dbTables = [];
        window.setDatabaseTables = function (tables) {
            _dbTables = tables || [];
        };

        // ================================================================
        // CẢNH BÁO SAI DẤU TRONG SQL — dấu nháy đơn ' chưa đóng, dấu ngoặc
        // ( ) [ ] không khớp, dấu phẩy , dư thừa ngay trước khi câu lệnh kết
        // thúc. Chạy hoàn toàn ở client (không đụng C#/server), quét lại có
        // debounce mỗi khi gõ, hiện gạch chân đỏ/vàng ngay dưới chỗ lỗi (hover
        // để xem chi tiết) + 1 chấm ở lề trái ngay cạnh dòng đó.
        //
        // CHỦ ĐÍCH THU HẸP PHẠM VI: chỉ bắt 3 lỗi có thể xác định chắc chắn,
        // không đoán "thiếu dấu phẩy giữa 2 cột" hay tương tự — dễ báo sai vì
        // SQL cho phép nhiều cú pháp hợp lệ trông giống lỗi (alias không có
        // AS, xuống dòng tuỳ ý...). Nếu Bee cần bắt thêm kiểu lỗi khác thì nói
        // để bổ sung, thay vì đoán rộng ra dễ gây báo sai (false positive).
        // ================================================================
        var _lintDebounceTimer = null;
        var _dauDecorationIds = [];

        function scheduleSqlLint() {
            if (_lintDebounceTimer) clearTimeout(_lintDebounceTimer);
            _lintDebounceTimer = setTimeout(runSqlLint, 500);
        }

        function runSqlLint() {
            if (!editor || !window.monaco) return;
            var model = editor.getModel();
            if (!model) return;

            var issues = lintSqlPunctuation(model.getValue());

            var markers = issues.map(function (it) {
                return {
                    severity: it.severity === 'error' ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning,
                    message: it.message,
                    startLineNumber: it.line,
                    startColumn: it.column,
                    endLineNumber: it.line,
                    endColumn: it.column + 1
                };
            });
            monaco.editor.setModelMarkers(model, 'bcode-dau', markers);

            var glyphs = issues.map(function (it) {
                return {
                    range: new monaco.Range(it.line, 1, it.line, 1),
                    options: {
                        isWholeLine: false,
                        glyphMarginClassName: it.severity === 'error' ? 'bcodeDauError' : 'bcodeDauWarn',
                        glyphMarginHoverMessage: { value: it.message }
                    }
                };
            });
            _dauDecorationIds = editor.deltaDecorations(_dauDecorationIds, glyphs);
        }

        // Quét toàn bộ text 1 lượt, tự theo dõi đang ở trong chuỗi '...'/comment
        // --.../ /*...*/ hay không, để không báo sai vì dấu nằm TRONG chuỗi hay
        // comment (ví dụ dấu ( trong 1 câu comment tiếng Việt không phải lỗi).
        function lintSqlPunctuation(text) {
            var issues = [];
            var n = text.length;
            var i = 0, line = 1, col = 1;
            var state = 'normal'; // normal | string | linecomment | blockcomment
            var stringStartLine = 0, stringStartCol = 0, stringStartOffset = 0;
            var parenStack = [];
            var bracketStack = [];
            var maskedChars = [];
            var stringSpans = []; // { start, line, col } — vị trí bắt đầu (dấu ' mở) của mỗi chuỗi, kể cả '' rỗng

            function step(ch) {
                maskedChars.push(ch);
                if (ch === '\n') { line++; col = 1; } else { col++; }
            }

            while (i < n) {
                var ch = text.charAt(i);
                var next = i + 1 < n ? text.charAt(i + 1) : '';

                if (state === 'normal') {
                    if (ch === '-' && next === '-') { state = 'linecomment'; step(' '); i++; step(' '); i++; continue; }
                    if (ch === '/' && next === '*') { state = 'blockcomment'; step(' '); i++; step(' '); i++; continue; }
                    if (ch === "'") {
                        state = 'string'; stringStartLine = line; stringStartCol = col; stringStartOffset = i;
                        stringSpans.push({ start: i, line: line, col: col });
                        step('#'); i++; continue;
                    }
                    if (ch === '(') { parenStack.push({ line: line, column: col }); step(ch); i++; continue; }
                    if (ch === ')') {
                        if (parenStack.length === 0) {
                            issues.push({ severity: 'error', line: line, column: col, message: 'Dấu ")" thừa — không có dấu "(" tương ứng phía trước.' });
                        } else {
                            parenStack.pop();
                        }
                        step(ch); i++; continue;
                    }
                    if (ch === '[') { bracketStack.push({ line: line, column: col }); step(ch); i++; continue; }
                    if (ch === ']') {
                        if (bracketStack.length === 0) {
                            issues.push({ severity: 'error', line: line, column: col, message: 'Dấu "]" thừa — không có dấu "[" tương ứng phía trước.' });
                        } else {
                            bracketStack.pop();
                        }
                        step(ch); i++; continue;
                    }
                    step(ch); i++; continue;
                }

                if (state === 'string') {
                    // ĐÃ SỬA (báo sai "dư dấu phẩy"): nội dung chuỗi trước đây bị che bằng
                    // dấu cách ' ' giống hệt comment — khiến ",  'giá trị'  )" (dấu phẩy rồi
                    // tới 1 chuỗi rồi mới tới ")") bị hiểu lầm là "dấu phẩy rồi chỉ có
                    // khoảng trắng rồi tới )", tức dư dấu phẩy — SAI, vì thật ra có 1 chuỗi
                    // (nội dung hợp lệ) nằm giữa. Khác với comment (không phải code, có thể
                    // coi như "trong suốt"/bỏ qua được), 1 chuỗi '...' LÀ 1 giá trị thật của
                    // câu lệnh nên không được xem như khoảng trắng. Che bằng '#' (khác hẳn
                    // \s) để các rule dùng [ \t\r\n]* (chỉ được phép có khoảng trắng thật)
                    // không còn "xuyên" qua được nội dung chuỗi nữa — vẫn giữ nguyên độ dài
                    // để line/col không lệch.
                    if (ch === "'") {
                        if (next === "'") { step('#'); i++; step('#'); i++; continue; } // '' = dấu nháy thoát trong chuỗi
                        state = 'normal'; step('#'); i++; continue;
                    }
                    step('#'); i++; continue;
                }

                if (state === 'linecomment') {
                    if (ch === '\n') { state = 'normal'; step('\n'); i++; continue; }
                    step(' '); i++; continue;
                }

                if (state === 'blockcomment') {
                    if (ch === '*' && next === '/') { state = 'normal'; step(' '); i++; step(' '); i++; continue; }
                    step(ch === '\n' ? '\n' : ' '); i++; continue;
                }
            }

            if (state === 'string') {
                issues.push({ severity: 'error', line: stringStartLine, column: stringStartCol, message: 'Chuỗi bắt đầu bằng dấu \' ở đây nhưng chưa được đóng lại (thiếu dấu \' đóng chuỗi).' });
            }
            parenStack.forEach(function (p) {
                issues.push({ severity: 'error', line: p.line, column: p.column, message: 'Dấu "(" ở đây chưa có dấu ")" đóng tương ứng.' });
            });
            bracketStack.forEach(function (p) {
                issues.push({ severity: 'error', line: p.line, column: p.column, message: 'Dấu "[" ở đây chưa có dấu "]" đóng tương ứng.' });
            });

            // Dư dấu phẩy: 1 dấu , (trên bản đã che nội dung chuỗi/comment) mà theo
            // sau (bỏ qua khoảng trắng/xuống dòng) là dấu ) hoặc 1 từ khoá bắt đầu
            // mệnh đề tiếp theo, hoặc dấu ; hoặc hết câu lệnh — gần như luôn là gõ dư.
            var masked = maskedChars.join('');
            var trailingCommaRe = /,[ \t\r\n]*(\)|;|$|\b(FROM|WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|UNION|EXCEPT|INTERSECT|JOIN)\b)/gim;
            var m;
            while ((m = trailingCommaRe.exec(masked)) !== null) {
                var pos = offsetToLineCol(masked, m.index);
                issues.push({ severity: 'warning', line: pos.line, column: pos.col, message: 'Dư dấu phẩy "," ngay trước đây — kiểm tra lại danh sách cột/điều kiện có bị thừa dấu phẩy không.' });
                trailingCommaRe.lastIndex = m.index + 1;
            }

            // Chuỗi '...' nằm ngay sau tên bảng trong FROM/JOIN (chỉ cách nhau bởi
            // khoảng trắng, không có dấu , hay từ khoá nào khác chen vào) — SQL Server
            // không cho phép bí danh bảng là 1 chuỗi nháy đơn, nên đây gần như luôn là
            // dấu ' dư/gõ nhầm (vd: FROM sys.tables ''). CHỈ áp dụng ngay sau FROM/JOIN
            // để không đụng tới kiểu "SELECT cot 'Tên cột'" (đặt bí danh cột bằng chuỗi,
            // vốn là cú pháp hợp lệ và rất hay dùng trong SQL báo cáo).
            // ĐÃ SỬA (lỗi hiệu năng): trước đây masked.slice(0, sp.start) cắt lại TOÀN
            // BỘ phần đầu file cho MỖI chuỗi '...' tìm thấy — với script vài chục
            // nghìn dòng có nhiều giá trị chuỗi (insert dữ liệu hàng loạt...), số
            // chuỗi có thể lên tới hàng nghìn, khiến tổng chi phí thành bậc 2
            // (O(số_chuỗi × độ_dài_file)) và làm treo UI khi gõ. Vì regex chỉ cần
            // xem "FROM/JOIN <tên bảng>" nằm NGAY TRƯỚC dấu ' mở chuỗi, không cần
            // quét ngược cả file — chỉ cần cắt 1 cửa sổ ngắn phía trước là đủ (300
            // ký tự dư sức chứa tên bảng có schema + ngoặc vuông + AS dài nhất).
            var LOOKBACK_WINDOW = 300;
            var fromJoinAliasRe = /\b(FROM|JOIN)\s+[A-Za-z_][\w.\[\]]*(\s+AS)?\s*$/i;
            stringSpans.forEach(function (sp) {
                var before = masked.slice(Math.max(0, sp.start - LOOKBACK_WINDOW), sp.start);
                if (fromJoinAliasRe.test(before)) {
                    issues.push({ severity: 'warning', line: sp.line, column: sp.col, message: 'Dấu \' ngay sau tên bảng trong FROM/JOIN — bí danh bảng không được là chuỗi nháy đơn, kiểm tra lại có dư dấu \' (hoặc \'\') không.' });
                }
            });

            return issues;
        }

        function offsetToLineCol(str, offset) {
            var line = 1, col = 1;
            for (var k = 0; k < offset; k++) {
                if (str.charAt(k) === '\n') { line++; col = 1; } else { col++; }
            }
            return { line: line, col: col };
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '-- Viết 1 hoặc nhiều câu lệnh SQL...\nSELECT TOP 100 * FROM sys.tables;',
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 13,
                fontFamily: 'Consolas, "Courier New", monospace',
                minimap: { enabled: false },
                wordWrap: 'off',
                scrollBeyondLastLine: false,
                lineNumbers: 'on',
                renderLineHighlight: 'all',
                glyphMargin: true, // chấm cảnh báo sai dấu ở lề trái — xem lintSqlPunctuation()
                contextmenu: false,
                suggestOnTriggerCharacters: true,
                quickSuggestions: { other: true, comments: false, strings: false },
                inlineSuggest: { enabled: true } // Bật Ghost Text Copilot
            });

            // 1. TÌM CÁC BẢNG ĐÃ CÓ TRONG QUERY ĐỂ SUY RA BẢNG LIÊN QUAN
            function getExistingTablesInQuery(fullText) {
                var regex = /\b(?:FROM|JOIN|INTO|UPDATE)\s+([a-zA-Z0-9_#$]+)/gi;
                var found = [];
                var m;
                while ((m = regex.exec(fullText)) !== null) {
                    found.push(m[1].toLowerCase());
                }
                return found;
            }

            // 2. GỢI Ý DANH SÁCH BẢNG & BẢNG LIÊN QUAN (INTELLISENSE DROPDOWN)
            monaco.languages.registerCompletionItemProvider('sql', {
                triggerCharacters: [' ', '.', '[', ',', '\n'],
                provideCompletionItems: function (model, position) {
                    if (!_dbTables || _dbTables.length === 0) return { suggestions: [] };

                    var lineContent = model.getLineContent(position.lineNumber);
                    var textBefore = lineContent.substring(0, position.column - 1);

                    var isTableContext = /\b(FROM|JOIN|INTO|UPDATE|TABLE)\s+([a-zA-Z0-9_#$]*)$/i.test(textBefore) ||
                                         /\bFROM\s+[^;]+,\s*([a-zA-Z0-9_#$]*)$/i.test(textBefore) ||
                                         /\b(dbo\.)([a-zA-Z0-9_#$]*)$/i.test(textBefore);

                    if (!isTableContext) {
                        return { suggestions: [] };
                    }

                    var word = model.getWordUntilPosition(position);
                    var range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: word.startColumn,
                        endColumn: word.endColumn
                    };

                    var fullSql = model.getValue();
                    var existingTables = getExistingTablesInQuery(fullSql);
                    var commonCatalogs = ['dmkh', 'dmvt', 'dmkho', 'dmnv', 'dmtk', 'dmnt', 'dmbp', 'dmplvt'];

                    var suggestions = _dbTables.map(function (item) {
                        var tableName = item.name;
                        var lowerName = tableName.toLowerCase();
                        var isRelated = false;
                        var relationNote = "";

                        for (var i = 0; i < existingTables.length; i++) {
                            var ex = existingTables[i];
                            if (ex === lowerName) continue;

                            var exDigits = ex.replace(/[^0-9]/g, '');
                            var curDigits = lowerName.replace(/[^0-9]/g, '');

                            if (exDigits.length >= 2 && exDigits === curDigits) {
                                isRelated = true;
                                relationNote = "⭐ Chi tiết / Cùng bộ chứng từ (" + ex + ")";
                                break;
                            }

                            if ((ex.startsWith('ph') && lowerName.startsWith('ct') && ex.slice(2) === lowerName.slice(2)) ||
                                (ex.startsWith('h') && lowerName.startsWith('d') && ex.slice(1) === lowerName.slice(1)) ||
                                (ex.startsWith('m') && lowerName.startsWith('d') && ex.slice(1) === lowerName.slice(1))) {
                                isRelated = true;
                                relationNote = "⭐ Bảng chi tiết của " + ex;
                                break;
                            }
                        }

                        if (!isRelated && /\bJOIN\s+/i.test(textBefore) && commonCatalogs.indexOf(lowerName) >= 0) {
                            isRelated = true;
                            relationNote = "⭐ Danh mục hay dùng";
                        }

                        var sortPrefix = isRelated ? "0_" : "1_";
                        var displayDetail = isRelated ? relationNote : (item.kind === 'View' ? '[View]' : '[Table]');

                        return {
                            label: tableName,
                            kind: item.kind === 'View' ? monaco.languages.CompletionItemKind.Interface : monaco.languages.CompletionItemKind.Class,
                            detail: displayDetail,
                            insertText: tableName,
                            sortText: sortPrefix + tableName,
                            range: range
                        };
                    });

                    return { suggestions: suggestions };
                }
            });

            // 3. GỢI Ý COPILOT GHOST TEXT (FILL-IN-THE-MIDDLE CHO PROCEDURE / FUNCTION)
            monaco.languages.registerInlineCompletionsProvider('sql', {
                provideInlineCompletions: function (model, position, context, token) {
                    // Nếu vừa có gợi ý đến trễ và đúng vị trí con trỏ hiện tại thì dùng luôn, khỏi gọi AI lại
                    if (_lateCopilotSuggestion &&
                        _lateCopilotSuggestion.position.lineNumber === position.lineNumber &&
                        _lateCopilotSuggestion.position.column === position.column &&
                        _lateCopilotSuggestion.modelVersion === model.getVersionId()) {
                        var cached = _lateCopilotSuggestion;
                        _lateCopilotSuggestion = null;
                        return Promise.resolve({
                            items: [{
                                insertText: cached.text,
                                range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column)
                            }]
                        });
                    }
                    return new Promise(function (resolve) {
                        if (!window.copilotEnabled || !window.chrome || !window.chrome.webview) {
                            return resolve({ items: [] });
                        }

                        // triggerKind 1 = Explicit: người dùng bấm Alt+\ gọi tay — luôn cho chạy, ở mọi loại SQL.
                        var explicit = !!context && context.triggerKind === 1;
                        if (!explicit && !window.copilotAuto) {
                            return resolve({ items: [] });
                        }

                        // Tự động (đang gõ) chỉ kích hoạt khi đang ở Procedure hoặc Function
                        var fullText = model.getValue();
                        var isProcOrFunc = /\b(CREATE|ALTER)\s+(?:OR\s+ALTER\s+)?(PROC|PROCEDURE|FUNCTION)\b/i.test(fullText);
                        
                        if (!explicit && !isProcOrFunc) {
                            return resolve({ items: [] });
                        }

                        if (_copilotDebounceTimer) {
                            clearTimeout(_copilotDebounceTimer);
                        }

                        var reqId = ++_copilotReqCounter;
                        _copilotResolvers[reqId] = {
                            resolve: resolve,
                            position: position
                        };

                        _copilotDebounceTimer = setTimeout(function () {
                            var totalLines = model.getLineCount();
                            var prefix = "";

                            // Trích xuất code TRƯỚC con trỏ (Giữ header chứa param/declare nếu file dài)
                            if (position.lineNumber > 80) {
                                var headerText = model.getValueInRange({
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: 40,
                                    endColumn: model.getLineMaxColumn(40)
                                });

                                var nearText = model.getValueInRange({
                                    startLineNumber: Math.max(41, position.lineNumber - 50),
                                    startColumn: 1,
                                    endLineNumber: position.lineNumber,
                                    endColumn: position.column
                                });

                                prefix = headerText + "\n\n-- ... [code omitted] ...\n\n" + nearText;
                            } else {
                                prefix = model.getValueInRange({
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: position.lineNumber,
                                    endColumn: position.column
                                });
                            }

                            // Trích xuất 40 dòng code SAU con trỏ để AI biết phía dưới đã có gì
                            var endLine = Math.min(totalLines, position.lineNumber + 40);
                            var suffix = model.getValueInRange({
                                startLineNumber: position.lineNumber,
                                startColumn: position.column,
                                endLineNumber: endLine,
                                endColumn: model.getLineMaxColumn(endLine)
                            });

                            if (!prefix || prefix.trim().length === 0) {
                                return resolve({ items: [] });
                            }

                            // Gửi cả prefix và suffix sang C#
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'copilot-suggest',
                                requestId: reqId,
                                prefix: prefix,
                                suffix: suffix
                            }));
                        }, explicit ? 0 : 600);

                        token.onCancellationRequested(function () {
                            if (_copilotDebounceTimer) clearTimeout(_copilotDebounceTimer);
                            if (_copilotResolvers[reqId]) {
                                delete _copilotResolvers[reqId];
                                resolve({ items: [] });
                            }
                        });

                        setTimeout(function () {
                            if (_copilotResolvers[reqId]) {
                                delete _copilotResolvers[reqId];
                                resolve({ items: [] });
                            }
                        }, 10000);
                    });
                },
                freeInlineCompletions: function (completions) {}
            });

            // Alt+\ — gọi gợi ý AI ngay (kể cả khi đã tắt gợi ý tự động); Ctrl+I — hộp "AI: Sửa/Sinh SQL".
            editor.addCommand(monaco.KeyMod.Alt | monaco.KeyCode.Backslash, function () {
                editor.trigger('keyboard', 'editor.action.inlineSuggest.trigger', {});
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyI, function () {
                window.showAiEdit();
            });

            // 1. Phím tắt F5 hoặc Ctrl+Enter chạy câu lệnh
            editor.addCommand(monaco.KeyCode.F5, function () {
                window.chrome.webview.postMessage(JSON.stringify({ action: 'run' }));
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function () {
                window.chrome.webview.postMessage(JSON.stringify({ action: 'run' }));
            });

            // 2. Phím tắt F7 làm đẹp SQL
            editor.addCommand(monaco.KeyCode.F7, function () {
                window.chrome.webview.postMessage(JSON.stringify({ action: 'beauty' }));
            });

            // 3. Phím tắt Alt+Z đổi Word Wrap
            editor.addCommand(monaco.KeyMod.Alt | monaco.KeyCode.KeyZ, function () {
                window.chrome.webview.postMessage(JSON.stringify({ action: 'toggle-wrap-key' }));
            });

            // 4. Bắt tổ hợp phím Ctrl + Shift để chuyển tiếp về MainForm
            editor.onKeyDown(function (e) {
                if (e.ctrlKey && e.shiftKey) {
                    var keyMap = {};
                    keyMap[monaco.KeyCode.KeyQ] = 'Q';
                    keyMap[monaco.KeyCode.KeyL] = 'L';
                    keyMap[monaco.KeyCode.KeyT] = 'T';
                    keyMap[monaco.KeyCode.KeyC] = 'C';
                    keyMap[monaco.KeyCode.KeyW] = 'W';
                    keyMap[monaco.KeyCode.KeyF] = 'F';
                    keyMap[monaco.KeyCode.KeyR] = 'R';
                    keyMap[monaco.KeyCode.KeyO] = 'O';
                    keyMap[monaco.KeyCode.KeyU] = 'U';
                    keyMap[monaco.KeyCode.KeyG] = 'G';
                    keyMap[monaco.KeyCode.KeyE] = 'E';
                    keyMap[monaco.KeyCode.Digit4] = 'D4';

                    var mapped = keyMap[e.keyCode];
                    if (mapped) {
                        e.preventDefault();
                        e.stopPropagation();

                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'global-key',
                                key: mapped
                            }));
                        }
                    }
                }
            });

            // 5. Bắt chuột trái để tắt menu chuột phải, hoặc Ctrl + chuột phải để mở procedure
            editor.onMouseDown(function (e) {
                if (e.event.leftButton) {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(JSON.stringify({
                            action: 'close-context-menu'
                        }));
                    }
                }

                if (e.event.rightButton && e.event.ctrlKey) {
                    var position = e.target.position;
                    if (position) {
                        var word = editor.getModel().getWordAtPosition(position);
                        if (word && word.word) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'open-proc',
                                word: word.word
                            }));
                        }
                    }
                }
            });

            // 6. Bắt sự kiện chuột phải trực tiếp trên Monaco Editor gửi về C#
            editor.onContextMenu(function (e) {
                if (e.event.ctrlKey) return;

                e.event.preventDefault();
                e.event.stopPropagation();

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({
                        action: 'show-context-menu',
                        x: Math.round(e.event.posx || e.event.browserEvent.clientX),
                        y: Math.round(e.event.posy || e.event.browserEvent.clientY)
                    }));
                }
            });

            // 7. Cảnh báo sai dấu (', (), [], dư dấu phẩy) — quét lại mỗi khi nội dung
            // đổi (gõ tay, setEditorText từ C#, F7 làm đẹp SQL... đều đi qua sự kiện
            // này), có debounce để khỏi quét lại từng ký tự một lúc gõ nhanh.
            editor.onDidChangeModelContent(scheduleSqlLint);
            scheduleSqlLint();

            isReady = true;
            window.chrome.webview.postMessage(JSON.stringify({ action: 'editor-ready' }));
        });

        window.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        }, true);

        // --- CÁC HÀM GỌI TỪ C# ---
        window.setCopilotSuggestion = function (reqId, suggestionText) {
            var entry = _copilotResolvers[reqId];
            if (entry) {
                if (suggestionText && suggestionText.length > 0) {
                    entry.resolve({
                        items: [{
                            insertText: suggestionText,
                            range: new monaco.Range(
                                entry.position.lineNumber,
                                entry.position.column,
                                entry.position.lineNumber,
                                entry.position.column
                            )
                        }]
                    });
                } else {
                    entry.resolve({ items: [] });
                }
                delete _copilotResolvers[reqId];
            } else if (suggestionText && suggestionText.length > 0 && editor) {
                // Trả lời trễ, request cũ đã hết hạn -> lưu lại và ép Monaco hỏi lại ngay
                var pos = editor.getPosition();
                _lateCopilotSuggestion = {
                    text: suggestionText,
                    position: pos,
                    modelVersion: editor.getModel().getVersionId()
                };
                editor.trigger('copilot', 'editor.action.inlineSuggest.trigger');
            }
        };

        window.setCopilotAuto = function (on) {
            window.copilotAuto = !!on;
        };

        // ---- Ctrl+I: hộp AI sửa/sinh SQL ----
        var _aiEditId = 0, _aiEditDone = null;
        window.showAiEdit = function () {
            if (!editor || document.getElementById('aiEditOverlay')) return;
            var sel = editor.getSelection();
            var selected = editor.getModel().getValueInRange(sel);
            var dark = !document.documentElement.classList.contains('light');
            var c = dark
                ? { bg: '#252526', fg: '#dcdcdc', mut: '#969696', inp: '#1e1e1e', bd: '#3f3f46', ac: '#f5a623', on: '#1c1608', btn: '#3e3e42' }
                : { bg: '#ffffff', fg: '#202020', mut: '#6e6e6e', inp: '#f5f5f6', bd: '#d2d5d9', ac: '#c47300', on: '#ffffff', btn: '#e1e3e6' };

            var ov = document.createElement('div');
            ov.id = 'aiEditOverlay';
            ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50000;display:flex;align-items:center;justify-content:center;padding:12px;font:13px "Segoe UI",sans-serif';
            var box = document.createElement('div');
            box.style.cssText = 'background:' + c.bg + ';color:' + c.fg + ';border:1px solid ' + c.bd + ';border-radius:8px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5)';
            function el(tag, css, text) { var e = document.createElement(tag); e.style.cssText = css || ''; if (text) e.textContent = text; return e; }
            var head = el('div', 'background:' + c.ac + ';color:' + c.on + ';padding:9px 14px;font-weight:600',
                selected ? 'AI: Sửa SQL (đang chọn đoạn)' : 'AI: Sinh SQL tại con trỏ');
            var body = el('div', 'padding:12px;display:flex;flex-direction:column;gap:6px;overflow:auto');
            var ta = 'width:100%;box-sizing:border-box;background:' + c.inp + ';color:' + c.fg + ';border:1px solid ' + c.bd + ';border-radius:4px;padding:6px;font:13px Consolas,monospace;resize:vertical';
            var l1 = el('div', 'color:' + c.mut, 'Yêu cầu (Ctrl+Enter để gửi) — AI biết cấu trúc các bảng đang dùng trong script');
            var ins = el('textarea', ta); ins.rows = 3;
            ins.placeholder = selected ? 'Ví dụ: thêm điều kiện ma_dvcs, đổi sang LEFT JOIN dmkh...' : 'Ví dụ: truy vấn tổng tiền theo khách hàng trong tháng...';
            var l2 = el('div', 'color:' + c.mut, 'Đề xuất từ AI');
            var out = el('textarea', ta); out.rows = 10; out.readOnly = true;
            var status = el('div', 'color:' + c.mut + ';font-size:12px;min-height:16px');
            var row = el('div', 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px');
            function btn(text, primary) {
                return el('button', 'border:1px solid ' + (primary ? c.ac : c.bd) + ';background:' + (primary ? c.ac : c.btn) + ';color:' + (primary ? c.on : c.fg) + ';border-radius:4px;padding:5px 14px;cursor:pointer;font:inherit', text);
            }
            var bGen = btn('Generate', true), bIns = btn('Insert'), bClose = btn('Close');
            bIns.disabled = true;
            function close() { ov.remove(); _aiEditDone = null; editor.focus(); }
            bClose.onclick = close;

            function generate() {
                var instruction = ins.value.trim();
                if (!instruction) return;
                bGen.disabled = true; bIns.disabled = true;
                out.value = ''; status.textContent = 'Đang hỏi Claude...';
                var id = ++_aiEditId;
                _aiEditDone = function (reqId, text, error) {
                    if (reqId !== id) return;
                    bGen.disabled = false;
                    if (error) { status.textContent = error; return; }
                    out.value = text; status.textContent = 'Xong — xem lại rồi bấm Insert.'; bIns.disabled = !text;
                };
                window.chrome.webview.postMessage(JSON.stringify({
                    action: 'ai-edit', requestId: id, instruction: instruction, selection: selected, script: editor.getValue()
                }));
            }
            bGen.onclick = generate;
            ins.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); generate(); } });
            ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); close(); } });
            bIns.onclick = function () {
                // Có chọn đoạn → thay đoạn đó; không chọn → chèn tại con trỏ.
                editor.executeEdits('ai-edit', [{ range: sel, text: out.value, forceMoveMarkers: true }]);
                close();
            };

            row.append(bGen, bIns, bClose);
            body.append(l1, ins, l2, out, status, row);
            box.append(head, body);
            ov.appendChild(box);
            document.body.appendChild(ov);
            ins.focus();
        };
        window.setAiEditResult = function (reqId, text, error) { if (_aiEditDone) _aiEditDone(reqId, text, error); };

        window.setCopilotEnabled = function (enabled) {
            window.copilotEnabled = !!enabled;
        };

        window.getEditorText = function () {
            return editor ? editor.getValue() : "";
        };

        window.getSelectedText = function () {
            if (!editor) return "";
            var sel = editor.getSelection();
            return editor.getModel().getValueInRange(sel);
        };

        window.setEditorText = function (text) {
            if (editor) editor.setValue(text);
        };

        window.replaceSelection = function (text) {
            if (!editor) return;
            var sel = editor.getSelection();
            editor.executeEdits('bcode', [{
                range: sel,
                text: text,
                forceMoveMarkers: true
            }]);
        };

        window.setTheme = function (isDark) {
            document.documentElement.classList.toggle('light', !isDark);
            if (window.monaco) {
                monaco.editor.setTheme(isDark ? 'vs-dark' : 'vs');
            }
        };

        window.setWordWrap = function (wrap) {
            if (editor) {
                editor.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
            }
        };

        window.setFontSize = function (delta) {
            if (editor) {
                var cur = editor.getOption(monaco.editor.EditorOption.fontSize);
                editor.updateOptions({ fontSize: Math.max(8, cur + delta) });
            }
        };

        window.toggleComment = function (comment) {
            if (!editor) return;
            var actionId = comment === true ? 'editor.action.addCommentLine'
                : comment === false ? 'editor.action.removeCommentLine'
                : 'editor.action.commentLine';
            var action = editor.getAction(actionId);
            if (action) action.run();
        };
    </script>
</body>
</html>
