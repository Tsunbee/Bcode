<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="dialog.css" />
</head>
<body>
<div class="tabs"><button id="t1" class="on">Not exists in Command</button><button id="t2">Difference Sysid</button><span class="grow"></span><span id="sum" class="muted" style="align-self:center"></span></div>
<div class="dlg-main"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>WMenu Id</th><th>Bar</th><th>Menu Id</th><th>Link</th><th>Sysid</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="dlg-bar"><span class="grow"></span><button id="bClose">Đóng</button></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const post = (action) => window.chrome.webview.postMessage(JSON.stringify({ action }));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let data = { notExists: [], diffSysid: [] }, tab = 1;
  function render() {
    const list = tab === 1 ? data.notExists : data.diffSysid;
    $('rows').innerHTML = list.map((r) => '<tr><td>' + esc(r.wmenuId) + '</td><td title="' + esc(r.bar) + '">' + esc(r.bar) + '</td><td>' + esc(r.menuId) + '</td><td title="' + esc(r.link) + '">' + esc(r.link) + '</td><td>' + esc(r.sysId) + '</td></tr>').join('');
    $('t1').classList.toggle('on', tab === 1); $('t2').classList.toggle('on', tab === 2);
  }
  $('t1').onclick = () => { tab = 1; render(); }; $('t2').onclick = () => { tab = 2; render(); };
  $('bClose').onclick = () => post('close');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('close'); });
  window.dupMenu = {
    init(d) {
      data = d; $('sum').textContent = 'Not exists in Command: ' + d.notExists.length + '    Difference Sysid: ' + d.diffSysid.length;
      tab = d.notExists.length || !d.diffSysid.length ? 1 : 2; render();
    },
  };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
</body>
</html>
