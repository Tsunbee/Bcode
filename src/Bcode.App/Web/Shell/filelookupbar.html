<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--panel);
    overflow: hidden;
    width: 100%;
  }

  /* Khung nội dung cao theo nội dung — C# đặt chiều cao thanh theo số đo này (xem __height ở dưới). */
  #bar {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 5px;
    width: 100%;
    min-width: 0;
  }

  .muted {
    color: var(--text-muted);
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 12px;
  }

  input[type="text"] {
    flex: 1 1 0;
    min-width: 50px;
    height: 24px;
    padding: 2px 6px;
    font-size: 12px;
  }

  select {
    flex-shrink: 0;
    height: 24px;
    font-size: 12px;
  }

  button {
    flex-shrink: 0;
    white-space: nowrap;
    height: 24px;
    padding: 0 8px;
    font-size: 12px;
    cursor: pointer;
  }

  label {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 12px;
    user-select: none;
    cursor: pointer;
  }
  @media (max-width: 700px) {
    .row { flex-wrap: wrap; height: auto; }
    #searchInput { min-width: 120px; flex: 1; }
    #btnOnlyShow, #extSelect { flex: 1; } /* Giúp các nút phân bổ đều không gian */
  }
  input.table-input { flex: 1; min-width: 120px; }
  input.where-input { flex: 1.5; min-width: 150px; }
  input.order-input { flex: 1; min-width: 100px; }
</style>
</head>
<body>
 <div id="bar">
  <div class="row">
    <span class="muted">Path:</span>
    <input type="text" id="pathInput" placeholder="\\server\CustomerPro\...\App_Data" />
    <button class="btn btn-primary" id="btnLoad">Load</button>
  </div>
  <div class="row">
    <select id="extSelect">
      <option value=".*" selected>.* (tất cả)</option>
      <option value=".f">.f</option>
      <option value=".xml">.xml</option>
      <option value=".aspx">.aspx</option>
      <option value=".xlsx">.xlsx</option>
      <option value=".rpt">.rpt</option>
    </select>
    <button class="btn active" id="btnOnlyShow" data-toggle="only-show">Only Show .*</button>
    <button class="link-btn" id="btnSearchBoxToggle">SearchBox ▾</button>
    <input type="text" id="searchInput" placeholder="Search..." />
  </div>
  <div class="row">
    <button class="btn" id="btnCopyTo" title="Copy các file đã tick (hoặc file đang chọn) sang thư mục khác, có đổi tên">Copy to... (0)</button>
    <button class="btn" id="btnCheckAll" title="Tick mọi file đang hiện trên cây">Tick tất cả</button>
    <button class="btn" id="btnUncheckAll" title="Bỏ mọi dấu tick">Bỏ tick</button>
    <button class="btn" id="btnGrant" title="Cấp source (.xml) từ kho SourceCollection cho các file đã tick (hoặc file đang chọn), tự chọn theo phiên bản">Cấp source</button>
  </div>
 </div>

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }

  // Báo chiều cao nội dung (px thiết bị, gồm DPI + tỉ lệ giao diện) mỗi khi đổi — cột cây hẹp làm các hàng xuống dòng thì thanh cao thêm thay vì bị cắt.
  (function () {
    var bar = document.getElementById('bar'), last = 0;
    function send() {
      var h = Math.ceil(bar.getBoundingClientRect().height * (window.devicePixelRatio || 1));
      if (h && h !== last) { last = h; post({ action: '__height', height: h }); }
    }
    if (window.ResizeObserver) new ResizeObserver(send).observe(bar);
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    setTimeout(send, 50);
  })();

  function load() { post({ action: 'load', path: document.getElementById('pathInput').value }); }

  document.getElementById('btnLoad').addEventListener('click', load);
  document.getElementById('pathInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') load();
  });

  document.getElementById('extSelect').addEventListener('change', function (e) {
    post({ action: 'ext', value: e.target.value });
  });

  document.getElementById('btnOnlyShow').addEventListener('click', function (e) {
    e.target.classList.toggle('active');
    post({ action: 'toggle-only-show' });
  });

  document.getElementById('btnCopyTo').addEventListener('click', function () { post({ action: 'copy-to' }); });
  document.getElementById('btnGrant').addEventListener('click', function () { post({ action: 'grant-source' }); });
  document.getElementById('btnCheckAll').addEventListener('click', function () { post({ action: 'check-all', value: true }); });
  document.getElementById('btnUncheckAll').addEventListener('click', function () { post({ action: 'check-all', value: false }); });
  window.setCheckedCount = function (n) { document.getElementById('btnCopyTo').textContent = 'Copy to... (' + n + ')'; };

  document.getElementById('btnSearchBoxToggle').addEventListener('click', function () {
    post({ action: 'toggle-searchbox' });
  });

  // Debounced live filename search — mirrors the original's "search as you type", just
  // batched a little so fast typing doesn't fire a full tree rebuild per keystroke.
  var searchDebounce, searchOnEnter = false;
  document.getElementById('searchInput').addEventListener('input', function (e) {
    clearTimeout(searchDebounce);
    if (searchOnEnter) return;   // Template → Tìm file: "Ấn Enter mới tìm" (máy yếu) — gõ không chạy tìm
    var value = e.target.value;
    searchDebounce = setTimeout(function () { post({ action: 'search', value: value }); }, 200);
  });
  // Enter = lọc ngay, không chờ hết 200 ms.
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    clearTimeout(searchDebounce);
    post({ action: 'search', value: e.target.value });
  });

  // ---- Called from C# (FileLookupControl) ----
  window.setOnlyShowLabel = function (text) {
    document.getElementById('btnOnlyShow').textContent = text;
  };
  window.setOnlyShowChecked = function (on) {
    document.getElementById('btnOnlyShow').classList.toggle('active', !!on);
  };
  window.setSearchBoxToggleText = function (text) {
    document.getElementById('btnSearchBoxToggle').textContent = text;
  };
  window.setSearchOnEnter = function (on) {
    searchOnEnter = !!on;
    if (on) clearTimeout(searchDebounce);
    document.getElementById('searchInput').placeholder = on ? 'Search... (Enter để tìm)' : 'Search...';
  };
  window.setPath = function (path) {
    document.getElementById('pathInput').value = path;
  };
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  };
</script>
</body>
</html>
