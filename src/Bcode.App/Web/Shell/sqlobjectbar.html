<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 5px 6px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  select, input[type="text"] { width: 100%; }
</style>
</head>
<body data-area="tree">
  <select id="dbSelect">
    <option value="0">App Data</option>
    <option value="1">Sys Data</option>
  </select>
  <input type="text" id="filterInput" placeholder="Lọc theo tên (gõ là lọc luôn)..." />

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }

  document.getElementById('dbSelect').addEventListener('change', function (e) {
    post({ action: 'db', value: parseInt(e.target.value, 10), filter: document.getElementById('filterInput').value });
  });
  document.getElementById('filterInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') post({ action: 'reload', filter: e.target.value });
  });
  // Gõ tới đâu lọc tới đó (không cần Enter): lọc ngay ở máy trên danh sách đã nạp sẵn nên không hỏi database; chờ 120ms sau phím cuối cho đỡ giật.
  var filterTimer = 0;
  document.getElementById('filterInput').addEventListener('input', function (e) {
    clearTimeout(filterTimer);
    var v = e.target.value;
    filterTimer = setTimeout(function () { post({ action: 'reload', filter: v }); }, 120);
  });

  // ---- Called from C# (SqlObjectTreeControl) ----
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  };
</script>
</body>
</html>
