<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 5px 6px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  select, input[type="text"] { width: 100%; }
</style>
</head>
<body data-area="tree">
  <select id="dbSelect">
    <option value="0">App Data</option>
    <option value="1">Sys Data</option>
  </select>
  <input type="text" id="filterInput" placeholder="Lọc theo tên (gõ là lọc luôn)..." />
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none"><input type="checkbox" id="textCheck" style="margin:0" />Tìm trong nội dung (text)</label>

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }
  var filterInput = document.getElementById('filterInput'), textCheck = document.getElementById('textCheck');

  document.getElementById('dbSelect').addEventListener('change', function (e) {
    post({ action: 'db', value: parseInt(e.target.value, 10), filter: filterInput.value, text: textCheck.checked });
  });
  filterInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(filterTimer); post({ action: 'reload', filter: e.target.value, text: textCheck.checked }); }
  });
  // Gõ tới đâu lọc tới đó (không cần Enter): lọc ngay ở máy trên danh sách đã nạp sẵn nên không hỏi database; chờ 120ms sau phím cuối cho đỡ giật.
  // Tìm trong nội dung thì phải hỏi database → chờ 500ms.
  var filterTimer = 0;
  filterInput.addEventListener('input', function (e) {
    clearTimeout(filterTimer);
    var v = e.target.value;
    filterTimer = setTimeout(function () { post({ action: 'reload', filter: v, text: textCheck.checked }); }, textCheck.checked ? 500 : 120);
  });
  textCheck.addEventListener('change', function () {
    clearTimeout(filterTimer);
    filterInput.placeholder = textCheck.checked ? 'Tìm chữ trong nội dung proc / func / view...' : 'Lọc theo tên (gõ là lọc luôn)...';
    post({ action: 'reload', filter: filterInput.value, text: textCheck.checked });
  });

  // ---- Called from C# (SqlObjectTreeControl) ----
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  };
</script>
</body>
</html>
