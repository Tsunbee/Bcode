<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BcodeViewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="main">
      <div id="editorPane">
        <!-- Tab strip: one row per open document (see tabs.js). Before it existed, opening
             a file replaced the one on screen and the only way back was the WinForms tree
             on the left, which forgets the caret position and the undo stack. -->
        <div id="tabStrip"></div>
        <div id="externalChangeBanner" class="externalChangeBanner" style="display:none;"></div>

        <!-- Two editor groups side by side; the second one is hidden until "Split" is used
             (see editor.js's toggleSplit). #splitDivider is draggable. -->
        <div id="editorArea">
          <div id="editorContainer"></div>
          <div id="splitDivider" style="display:none;"></div>
          <div id="editorSecondaryPane" style="display:none;">
            <div id="secondaryHeader">
              <select id="secondaryFilePicker" title="File hiển thị ở khung bên phải"></select>
              <span id="secondaryCloseBtn" title="Đóng khung tách">✕</span>
            </div>
            <div id="editorContainerSecondary"></div>
          </div>
        </div>

        <!-- One-line summary of the Problems list, shown only when there is something to
             say. The panel below can be closed; this can't be missed. -->
        <div id="problemsSummary" style="display:none;"></div>

        <!-- Bottom dock: Problems and Find-in-Files results share it, VSCode-style. -->
        <div id="bottomPanel" style="display:none;">
          <div id="bottomTabs"></div>
          <div id="bottomBody">
            <div id="problemsPanel" class="dockPane"></div>
            <div id="searchPanel" class="dockPane"></div>
            <div id="sqlPanel" class="dockPane"></div>
          </div>
        </div>
      </div>

      <!-- Outline (right): the document's structure as a tree, always visible rather than
           behind Ctrl+Shift+O — an FCode controller's shape is the thing you navigate by. -->
      <div id="outlinePanel" style="display:none;">
        <div id="outlineHeader">
          <span>Outline</span>
          <span id="outlineCloseBtn" title="Đóng">✕</span>
        </div>
        <input id="outlineFilter" type="text" placeholder="Lọc theo tên..." />
        <div id="outlineTree"></div>
      </div>
      <!-- Đã xóa khối <div id="chatPanel"> và <div id="chatReopenBtn"> -->
    </div>
  </div>

  <!-- First script on the page, before anything that can fail.
       A script error used to be completely silent here: the page would half-die (an editor
       with no suggestions, a toolbar button that does nothing) while still looking normal,
       with no console anyone sees and nothing written down. That turned one real bug into a
       long guessing game. This surfaces the message, the file and the line, so a screenshot
       is enough to identify it. Its own element rather than #validationBanners, which the
       validation pass clears on every keystroke. -->
  <script>
    (function () {
      function showPageError(text, detail) {
        var bar = document.getElementById('pageErrorBanner');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'pageErrorBanner';
          bar.className = 'pageErrorBanner';
          (document.body || document.documentElement).appendChild(bar);
        }
        var msg = document.createElement('span');
        msg.className = 'msg';
        msg.textContent = text;
        // The stack goes in the tooltip rather than the bar: a promise rejection carries no
        // file/line of its own, so without this a report of one is unactionable — but a
        // stack trace across the top of the editor is worse than the bug.
        msg.title = detail || text;
        var close = document.createElement('span');
        close.className = 'dismiss';
        close.textContent = '✕';
        close.title = 'Ẩn';
        close.onclick = function () { bar.remove(); };
        bar.innerHTML = '';
        bar.appendChild(msg);
        bar.appendChild(close);
      }

      window.addEventListener('error', function (e) {
        // A failed <script src> raises an error event on the element itself, where the
        // message fields are empty — worth reporting distinctly, since a missing file and a
        // throwing file look identical from the outside otherwise.
        if (e.target && e.target.tagName === 'SCRIPT') {
          showPageError('Lỗi nạp script: ' + (e.target.getAttribute('src') || '?'));
          return;
        }
        showPageError('Lỗi JS: ' + e.message + '  —  ' + (e.filename || '?') + ':' + e.lineno);
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;

        // A cancellation is not a failure. Monaco rejects with a CancellationError (whose
        // message is the literal "Canceled") every time it abandons a request that is still
        // in flight — a hover the mouse has moved away from, a suggestion superseded by the
        // next keystroke, a provider still running when the model changed. That happens
        // constantly during completely normal editing, and reporting it put a red bar on
        // screen for something that was working correctly. A bar that cries wolf is how
        // people learn to ignore the bar that matters.
        if (r && (r.name === 'CancellationError' || r.message === 'Canceled')) return;

        var text = 'Lỗi JS (promise): ' + (r && r.message ? r.message : String(r));
        showPageError(text, r && r.stack ? text + '

' + r.stack : text);
      });

      window.bcodeShowPageError = showPageError;
    })();
  </script>

  <script src="vs/loader.js"></script>
  <script src="theme.js"></script>
  <script src="fcode-language.js"></script>
  <script src="editor.js"></script>
  <script src="contextmenu.js"></script>
  <script src="completion.js"></script>
  <script src="history.js"></script>
  <script src="entity.js"></script>
  <script src="tabs.js"></script>
  <script src="dock.js"></script>
  <script src="problems.js"></script>
  <script src="search.js"></script>
  <script src="outline.js"></script>
  <script src="sqlrun.js"></script>
  <!-- Đã xóa chat.js -->
  <script>
    require.config({ paths: { vs: 'vs' } });
    require(['vs/editor/editor.main'], async function () {
      // Theme first, editor second: defineTheme/setTheme after the editor exists works,
      // but shows a dark flash before repainting whenever the chosen theme is a light one.
      await window.bcodeTheme.init();
      // Before the first model exists: a model created with an unregistered language id
      // silently ends up as plaintext. detectLanguage reads this flag.
      window.bcodeFcodeLanguageReady = await window.registerFcodeLanguage();
      window.bcodeViewer = new BcodeEditor('editorContainer');
      // IntelliSense (snippet / FCode XML / SQL / ghost text) — registered after the editor
      // exists because every provider needs the live instance, and kept in its own file
      // because editor.js is already the biggest thing here. See completion.js.
      // Before BcodeCompletion: its hover provider delegates here, and registering a
      // provider that would dereference a missing window.bcodeEntity is avoidable.
      window.bcodeEntity = new BcodeEntity(window.bcodeViewer);
      window.bcodeCompletion = new BcodeCompletion(window.bcodeViewer);
      // Panels, after the editor: each one binds to the live instance, and the outline's
      // definition/reference providers need a registered language to attach to.
      window.bcodeTabs = new BcodeTabs(window.bcodeViewer);
      window.bcodeProblems = new BcodeProblems(window.bcodeViewer);
      window.bcodeSearch = new BcodeSearch(window.bcodeViewer);
      window.bcodeOutline = new BcodeOutline(window.bcodeViewer);
      window.bcodeSqlRun = new BcodeSqlRun(window.bcodeViewer);
      // Đã xóa dòng khởi tạo BcodeChat

      // Tells the host the editor object now exists. MainForm waits for this before
      // opening the file it was launched with — WebView2's NavigationCompleted fires
      // earlier than this point (scripts loaded, but the await above not yet resumed),
      // and opening against a not-yet-created window.bcodeViewer silently does nothing.
      window.chrome.webview.hostObjects.host.NotifyPageReady();
    });
  </script>
</body>
</html>
