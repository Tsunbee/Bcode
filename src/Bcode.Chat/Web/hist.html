<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lịch sử chat — Bhoo</title>
<link rel="stylesheet" href="retro.css">
<style>
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; padding: 5px 8px; border-bottom: 1px solid var(--shadow); background: linear-gradient(#fbfaf5, #ece9d8); }
  .toolbar label { display: flex; align-items: center; gap: 4px; }
  .toolbar input[type=search] { width: 170px; height: 21px; }
  .toolbar input[type=date] { height: 21px; font: 11px Tahoma; }
  .toolbar select { height: 21px; max-width: 130px; }
  .toolbar .sp { flex: 1; }
  .main { flex: 1; display: flex; gap: 6px; padding: 6px; min-height: 0; }
  #convs { width: 210px; flex: none; overflow: auto; background: #fff; }
  .cv { display: flex; align-items: center; gap: 6px; padding: 4px 6px; cursor: default; border-bottom: 1px solid #f0efe8; }
  .cv:hover { background: #eef3fb; }
  .cv.sel { background: var(--sel); color: #fff; }
  .cv.sel .d { color: #dfe8f7; }
  .cv .pic { width: 26px; height: 26px; flex: none; border: 1px solid #8a9bb5; color: #fff; font: bold 13px Tahoma; display: flex; align-items: center; justify-content: center; }
  .cv .t { flex: 1; min-width: 0; }
  .cv .n { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv .d { color: var(--muted); font-size: 10px; }
  #log { flex: 1; overflow: auto; background: #fff; padding: 6px 10px; user-select: text; font-size: 12px; line-height: 1.45; word-wrap: break-word; }
  .ln { margin: 1px 0 3px; }
  .ln .who { font-weight: bold; }
  .ln .who.me { color: var(--me); } .ln .who.them { color: var(--them); }
  .ln .tm { color: #9a978a; font-size: 10px; }
  .ln .sm { width: 19px; height: 19px; }
  .ln .cvn { display: inline-block; background: #e8eef8; color: #1f4882; border-radius: 2px; padding: 0 4px; font-size: 10px; margin-right: 4px; cursor: pointer; }
  .sys { color: #6d6a5d; font-style: italic; font-size: 11px; margin: 3px 0; }
  .buzz { color: #d4141e; font-weight: bold; }
  .day { text-align: center; color: #8a877a; font-size: 10px; margin: 10px 0 4px; display: flex; align-items: center; gap: 6px; }
  .day::before, .day::after { content: ''; flex: 1; border-top: 1px solid #e3e0d0; }
  mark { background: #ffe86b; color: inherit; padding: 0; }
  .empty { color: var(--muted); padding: 20px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="toolbar">
  <label>🔎 <input type="search" id="q" placeholder="Tìm chữ trong cuộc chat này…"></label>
  <label>Người gửi <select id="who"><option value="">(tất cả)</option></select></label>
  <label>Từ <input type="date" id="from"></label>
  <label>đến <input type="date" id="to"></label>
  <div class="sp"></div>
  <button class="btn" id="bAll" title="Tìm chữ trong mọi cuộc chat trên máy này">Tìm mọi cuộc chat</button>
  <button class="btn" id="bOpen" title="Mở cửa sổ chat">💬 Mở chat</button>
  <button class="btn" id="bExport" title="Lưu cuộc chat đang xem ra file .txt">💾 Lưu .txt</button>
</div>
<div class="main">
  <div id="convs" class="sunken"></div>
  <div id="log" class="sunken"></div>
</div>
<div class="statusbar"><span class="grow" id="sb"></span></div>
<script src="common.js"></script>
<script src="hist.js"></script>
</body>
</html>
