<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body { display: flex; flex-direction: column; background: var(--panel); }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: var(--panel-alt); border-bottom: 1px solid var(--border); }
  .top input { flex: 1 1 200px; min-width: 0; }
  .top .count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .btn-border { border-color: var(--border); }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 34%) 1fr; }
  .list { overflow-y: auto; border-right: 1px solid var(--border); }
  .item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: var(--panel-alt); }
  .item.sel { background: var(--selection); }
  .item .t { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--text-muted); }
  .item .k { font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--button-back); color: var(--text); }
  .item .k.ai { background: var(--accent); color: var(--on-accent); }
  .item .p { margin-top: 3px; font-family: Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 14px; gap: 6px; }
  .detail label { font-size: 11.5px; color: var(--text-muted); }
  .detail .meta { font-size: 12px; color: var(--text-muted); }
  textarea { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
             font-family: Consolas, monospace; font-size: 13px; resize: none; user-select: text; -webkit-user-select: text; }
  #ctx, #ins { height: 54px; flex: none; }
  #res { flex: 1; min-height: 120px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions .sp { flex: 1; }
  #msg { font-size: 12.5px; color: var(--success); }
  .empty { padding: 30px 14px; text-align: center; color: var(--text-muted); }
  @media (max-width: 640px) {
    .split { grid-template-columns: 1fr; grid-template-rows: minmax(120px, 36%) 1fr; }
    .list { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="top">
  <input type="text" id="q" placeholder="Lọc theo nội dung gợi ý / yêu cầu..." />
  <span class="count" id="count"></span>
  <button class="btn btn-border btn-danger" id="btnClear" title="Xoá toàn bộ lịch sử">Xoá tất cả</button>
</div>
<div class="split">
  <div class="list" id="list"></div>
  <div class="detail" id="detail">
    <div class="meta" id="meta"></div>
    <label id="insLabel">Yêu cầu (Ctrl+I)</label><textarea id="ins" readonly></textarea>
    <label id="ctxLabel">Dòng đang gõ lúc đó</label><textarea id="ctx" readonly></textarea>
    <label>Đoạn AI đã gợi ý</label><textarea id="res" readonly></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="btnCopy">Copy</button>
      <button class="btn btn-border" id="btnInsert" title="Chèn vào vị trí con trỏ trong SQL Query">Chèn vào editor</button>
      <button class="btn btn-border btn-danger" id="btnDel">Xoá mục này</button>
      <span id="msg"></span>
      <span class="sp"></span>
      <button class="btn btn-border" id="btnClose">Đóng</button>
    </div>
  </div>
</div>

<script>
  let all = [], shown = [], sel = null;
  const $ = (id) => document.getElementById(id);
  function post(action, data) { window.chrome.webview.postMessage(JSON.stringify({ action, data })); }
  const fmt = (iso) => { const d = new Date(iso); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };

  function renderList() {
    const q = $('q').value.trim().toLowerCase();
    shown = all.filter((e) => !q || (e.result + ' ' + e.instruction + ' ' + e.context).toLowerCase().includes(q));
    const host = $('list');
    host.textContent = '';
    shown.forEach((e) => {
      const it = document.createElement('div');
      it.className = 'item' + (sel && sel.id === e.id ? ' sel' : '');
      const t = document.createElement('div'); t.className = 't';
      const k = document.createElement('span'); k.className = 'k' + (e.kind === 'Ctrl+I' ? ' ai' : ''); k.textContent = e.kind;
      const tm = document.createElement('span'); tm.textContent = fmt(e.time);
      t.append(k, tm);
      const p = document.createElement('div'); p.className = 'p';
      p.textContent = (e.instruction || e.result).replace(/\s+/g, ' ').trim();
      it.append(t, p);
      it.onclick = () => select(e);
      host.appendChild(it);
    });
    if (!shown.length) { const em = document.createElement('div'); em.className = 'empty'; em.textContent = all.length ? 'Không có mục nào khớp.' : 'Chưa có gợi ý nào được lưu.'; host.appendChild(em); }
    $('count').textContent = `${shown.length}/${all.length} mục`;
  }

  function select(e) {
    sel = e;
    $('meta').textContent = e ? `${e.kind} · ${e.engine} · ${fmt(e.time)}` : '';
    $('ins').value = e ? e.instruction : '';
    $('ctx').value = e ? e.context : '';
    $('res').value = e ? e.result : '';
    const hasIns = !!(e && e.instruction), hasCtx = !!(e && e.context);
    $('ins').style.display = $('insLabel').style.display = hasIns ? '' : 'none';
    $('ctx').style.display = $('ctxLabel').style.display = hasCtx ? '' : 'none';
    ['btnCopy', 'btnInsert', 'btnDel'].forEach((b) => { $(b).disabled = !e; });
    $('msg').textContent = '';
    renderList();
  }

  function flash(t) { $('msg').textContent = t; setTimeout(() => { $('msg').textContent = ''; }, 2500); }

  $('q').oninput = renderList;
  $('btnCopy').onclick = () => { if (sel) { post('copy', { text: sel.result }); flash('Đã copy.'); } };
  $('btnInsert').onclick = () => { if (sel) { post('insert', { text: sel.result }); flash('Đã chèn vào editor.'); } };
  $('btnDel').onclick = () => { if (sel) post('delete', { id: sel.id }); };
  $('btnClear').onclick = () => post('clear');
  $('btnClose').onclick = () => post('close');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('close'); });

  window.setTheme = (isDark) => document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  window.setItems = (items) => {
    all = items;
    const keep = sel && all.find((e) => e.id === sel.id);
    renderList();
    select(keep || all[0] || null);
  };

  post('ready');
</script>
</body>
</html>
