<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BcodeViewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="main">
      <div id="editorPane">
        <div id="validationBanners"></div>
        <div id="editorContainer"></div>
      </div>
      <div id="chatPanel">
        <div id="chatHeader">
          <span>AI (Claude)</span>
          <span id="chatCloseBtn" title="Ẩn panel AI">✕</span>
        </div>
        <div id="chatMessages"></div>
        <div id="chatInputRow">
          <textarea id="chatInput" rows="2" placeholder="Hỏi về file đang mở..."></textarea>
          <button id="chatSendBtn">Gửi</button>
        </div>
      </div>
    </div>
  </div>
  <div id="chatReopenBtn" title="Hiện panel AI (Claude)">AI</div>

  <script src="vs/loader.js"></script>
  <script src="editor.js"></script>
  <script src="contextmenu.js"></script>
  <script src="chat.js"></script>
  <script>
    require.config({ paths: { vs: 'vs' } });
    require(['vs/editor/editor.main'], function () {
      window.bcodeViewer = new BcodeEditor('editorContainer');
      window.bcodeChat = new BcodeChat('chatMessages', 'chatInput', 'chatSendBtn', window.bcodeViewer);
    });
  </script>
</body>
</html>
