<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="dialog.css" />
<style>
  #app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(16rem, 30%) minmax(0, 1fr); }
  @media (max-width: 760px) { #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 40% 60%; } }
  .left, .right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .left { border-right: var(--bw) solid var(--border); }
  .filters { flex: none; padding: .5rem .6rem; display: flex; flex-direction: column; gap: .45rem; background: var(--panel-alt); border-bottom: var(--bw) solid var(--border); }
  .filters input[type=text], .filters select { width: 100%; box-sizing: border-box; }
  .kinds { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
  .list { flex: 1; min-height: 0; overflow: auto; background: var(--input); }
  .tsec { flex: 0 0 40%; min-height: 6rem; display: flex; flex-direction: column; border-top: var(--bw) solid var(--accent); }
  .tsec .tq { flex: none; padding: .4rem .6rem; background: var(--panel-alt); display: flex; flex-direction: column; gap: .3rem; }
  .tsec .tq input { width: 100%; box-sizing: border-box; }
  .it .cnt { color: var(--accent); margin-left: .5rem; font-size: .88rem; } .it.sel .cnt { color: inherit; }
  .it { padding: calc(.2rem * var(--dens)) .6rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it:hover { background: var(--selection); } .it.sel { background: var(--accent); color: var(--on-accent); }
  .it .t { color: var(--text-muted); margin-left: .5rem; font-size: .88rem; } .it.sel .t { color: inherit; opacity: .8; }
  .it .db { color: var(--accent); margin-right: .4rem; font-size: .88rem; } .it.sel .db { color: inherit; }
  .tools { flex: none; display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; padding: .4rem .7rem; background: var(--panel-alt); border-bottom: var(--bw) solid var(--border); }
  .tools .nm { font-weight: 600; flex: 1; min-width: 6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview { flex: 1; min-height: 4rem; margin: 0; padding: .6rem .8rem; overflow: auto; background: var(--input); font: .95rem/1.45 Consolas, 'Cascadia Mono', monospace; white-space: pre; tab-size: 4; }
  #bottom { flex: 0 0 34%; min-height: 0; display: none; flex-direction: column; border-top: var(--bw) solid var(--border); overflow: auto; background: var(--panel); }
  #bottom .it { cursor: pointer; }
  .k { color: #569cd6; font-weight: 600; } .s { color: #ce9178; } .c { color: #6a9955; } .n { color: #b5cea8; }
  html[data-theme="light"] .k { color: #0000ff; } html[data-theme="light"] .s { color: #a31515; } html[data-theme="light"] .c { color: #008000; } html[data-theme="light"] .n { color: #098658; }
  mark { background: #f5a62366; color: inherit; }
  /* khung script: chọn được chữ (shell.css khoá user-select toàn trang), bấm vào thì nhận focus để Ctrl+A / Ctrl+F */
  #preview { user-select: text; -webkit-user-select: text; outline: none; }
  .pvwrap { position: relative; flex: 1; min-height: 4rem; display: flex; flex-direction: column; }
  /* thanh tìm nổi góc trên-phải như find widget của Monaco / findbar.html */
  .lkfind { position: absolute; top: .4rem; right: 1.4rem; z-index: 5; display: none; align-items: center; gap: .3rem; width: min(26rem, calc(100% - 3rem)); padding: .3rem .4rem .3rem .5rem;
    background: var(--panel-alt); border: var(--bw) solid var(--border); border-radius: var(--r); box-shadow: 0 2px 8px #0006; }
  .lkfind.show { display: flex; }
  .lkfind input { flex: 1; min-width: 0; }
  .lkfind .info { color: var(--text-muted); font-size: .88rem; white-space: nowrap; min-width: 3.5rem; text-align: right; }
  .lkfind .info.none { color: var(--danger, #e5534b); }
  .lkfind button { padding: .15rem .45rem; }
  ::highlight(lk-find) { background-color: #f5a62355; }
  ::highlight(lk-cur) { background-color: #f5a623; color: #000; }
</style>
</head>
<body>
<div id="app">
  <div class="left">
    <div class="filters">
      <div class="row"><span class="muted">DB:</span><select id="db" class="grow"><option value="0">App Data</option><option value="1">Sys Data</option><option value="2" selected>Cả hai (App + Sys)</option></select></div>
      <input type="text" id="q" placeholder="Search Text (tên object)..." spellcheck="false" autocomplete="off">
      <div class="kinds"><label class="chk"><input type="checkbox" class="kd" value="fn" checked> Function</label><label class="chk"><input type="checkbox" class="kd" value="proc" checked> Store</label><label class="chk"><input type="checkbox" class="kd" value="table" checked> Table</label><label class="chk"><input type="checkbox" class="kd" value="view" checked> View</label><label class="chk"><input type="checkbox" class="kd" value="trigger" checked> Trigger</label></div>
    </div>
    <div class="list" id="list"></div>
    <div class="tsec">
      <div class="tq"><input type="text" id="tq" placeholder="Search nội dung trong Function / Store / View / Trigger…" spellcheck="false" autocomplete="off"><span class="muted" id="tst">Gõ ≥ 2 ký tự — tìm trong cache nội dung (tự cập nhật khi object đổi).</span></div>
      <div class="list" id="tlist"></div>
    </div>
  </div>
  <div class="right">
    <div class="tools">
      <label class="chk"><input type="checkbox" class="md" value="search"> Show Search Text</label>
      <label class="chk"><input type="checkbox" class="md" value="data"> Show Data</label>
      <label class="chk"><input type="checkbox" class="md" value="history"> Show History</label>
      <button id="bTab">Mở trong Tab</button>
      <span class="nm" id="nm"></span>
    </div>
    <div class="pvwrap">
      <div class="lkfind" id="lkfind"><input type="text" id="fq" placeholder="Tìm trong script..." spellcheck="false" autocomplete="off"><span class="info" id="finfo"></span><button id="fprev" title="Tìm lùi (Shift+Enter / Shift+F3)">↑</button><button id="fnext" title="Tìm tiếp (Enter / F3)">↓</button><button id="fclose" title="Đóng (Esc)">✕</button></div>
      <pre id="preview" tabindex="0"></pre>
    </div>
    <div id="bottom"></div>
  </div>
</div>
<div class="dlg-bar" style="padding:.25rem .8rem"><span id="status" class="status"></span></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const say = (t, k) => { $('status').textContent = t || ''; $('status').className = 'status ' + (k || ''); };
  let defText = '', mode = '', hist = [], timer = 0, selEl = null;

  // ---- tô màu SQL gọn: chú thích / chuỗi / số / từ khoá ----
  const KW = 'select|from|where|and|or|not|in|is|null|as|join|inner|left|right|outer|full|cross|on|group|by|order|having|insert|into|values|update|set|delete|create|alter|drop|table|view|procedure|proc|function|trigger|begin|end|if|else|while|return|declare|exec|execute|with|union|all|distinct|top|case|when|then|like|between|exists|cast|convert|go|use|index|primary|key|foreign|references|default|identity|output|print|raiserror|try|catch|throw|cursor|open|close|fetch|next|for|after|instead|of|nocount|on|off|rollback|commit|transaction|tran';
  const TOKEN = new RegExp('(--[^\\n]*|/\\*[\\s\\S]*?\\*/)|(\'(?:[^\']|\'\')*\')|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:' + KW + ')\\b)', 'gi');
  function highlight(text) {
    let out = '', last = 0, m; TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(text))) {
      out += esc(text.slice(last, m.index));
      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : 'k';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>'; last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function search() {
    clearTimeout(timer);
    timer = setTimeout(() => post('search', { db: parseInt($('db').value, 10), filter: $('q').value, kinds: [...document.querySelectorAll('.kd:checked')].map((c) => c.value) }), 300);
  }
  $('q').addEventListener('input', search); $('db').addEventListener('change', search);
  document.querySelectorAll('.kd').forEach((c) => c.addEventListener('change', search));
  $('bTab').onclick = () => post('openInTab');

  // ---- khu 2: tìm theo NỘI DUNG (cache định nghĩa ở C#) ----
  let ttimer = 0, fromText = false, tsel = null;
  function textSearch() {
    clearTimeout(ttimer);
    const term = $('tq').value.trim();
    if (term.length < 2) { $('tlist').innerHTML = ''; $('tst').textContent = 'Gõ ≥ 2 ký tự — tìm trong cache nội dung (tự cập nhật khi object đổi).'; return; }
    ttimer = setTimeout(() => post('textsearch', { db: parseInt($('db').value, 10), term, kinds: [...document.querySelectorAll('.kd:checked')].map((c) => c.value) }), 350);
  }
  $('tq').addEventListener('input', textSearch);
  $('tq').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(ttimer); const term = $('tq').value.trim(); if (term.length >= 2) post('textsearch', { db: parseInt($('db').value, 10), term, kinds: [...document.querySelectorAll('.kd:checked')].map((c) => c.value) }); } });
  $('tlist').addEventListener('click', (e) => { const el = e.target.closest('.it'); if (!el) return; if (tsel) tsel.classList.remove('sel'); tsel = el; el.classList.add('sel'); fromText = true; post('select', { list: 'text', i: parseInt(el.dataset.i, 10) }); });

  function item(o, listName) { return '<div class="it" data-i="' + o.i + '" data-list="' + listName + '" title="' + esc(o.name) + '"><span class="db">' + (o.sys ? '[Sys]' : '[App]') + '</span>' + esc(o.name) + '<span class="t">(' + esc(o.kind) + ')</span></div>'; }
  $('list').addEventListener('click', (e) => { const el = e.target.closest('.it'); if (!el) return; fromText = false; if (selEl) selEl.classList.remove('sel'); selEl = el; el.classList.add('sel'); post('select', { list: 'results', i: parseInt(el.dataset.i, 10) }); });

  // ---- 3 ô Show ... = chọn một trong ba ----
  document.querySelectorAll('.md').forEach((c) => c.addEventListener('change', () => {
    document.querySelectorAll('.md').forEach((o) => { if (o !== c) o.checked = false; });
    mode = c.checked ? c.value : ''; post('mode', { mode }); renderBottom();
  }));
  function renderBottom(data) {
    const b = $('bottom');
    b.style.display = mode ? 'flex' : 'none';
    if (mode === 'search') {
      const term = ($('tq').value.trim() || $('q').value.trim()).toLowerCase(); if (!term) { b.innerHTML = '<div class="hint" style="padding:.5rem">Nhập từ khoá ở ô Search để xem các dòng khớp.</div>'; return; }
      const lines = defText.split('\n'), out = [];
      lines.forEach((l, i) => { if (l.toLowerCase().includes(term)) out.push('<div class="it" data-line="' + i + '">Dòng ' + (i + 1) + ': ' + esc(l.trim()) + '</div>'); });
      b.innerHTML = out.join('') || '<div class="hint" style="padding:.5rem">Không có dòng nào khớp.</div>';
    } else if (mode === 'history') {
      b.innerHTML = hist.map((o) => item(o, 'history')).join('') || '<div class="hint" style="padding:.5rem">Chưa xem object nào.</div>';
    } else if (mode === 'data') {
      if (data === undefined) { b.innerHTML = '<div class="hint" style="padding:.5rem">Đang tải dữ liệu...</div>'; return; }
      if (!data) { b.innerHTML = '<div class="hint" style="padding:.5rem">Show Data chỉ dùng cho Table.</div>'; return; }
      b.innerHTML = '<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl"><thead><tr>' + data.columns.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        data.rows.map((r) => '<tr>' + r.map((v) => '<td title="' + esc(v) + '">' + (v == null ? '<i class="muted">NULL</i>' : esc(v)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
  }
  $('bottom').addEventListener('click', (e) => {
    const h = e.target.closest('.it[data-list="history"]'); if (h) { post('select', { list: 'history', i: parseInt(h.dataset.i, 10) }); return; }
    const l = e.target.closest('.it[data-line]'); if (l) jumpToLine(parseInt(l.dataset.line, 10));
  });
  function jumpToLine(n) {
    const lines = defText.split('\n'), term = $('q').value.trim();
    const before = lines.slice(0, n).join('\n').length + (n ? 1 : 0), upto = before + (lines[n] || '').length;
    $('preview').innerHTML = highlight(defText.slice(0, before)) + '<mark id="hit">' + highlight(defText.slice(before, upto)) + '</mark>' + highlight(defText.slice(upto));
    const hit = $('hit'); if (hit) hit.scrollIntoView({ block: 'center' });
    afterRender(false);
  }

  // ---- khung script: Ctrl+A chọn hết, Ctrl+F thanh tìm (WebView2 tắt phím trình duyệt nên không có Ctrl+F sẵn) ----
  // Tô kết quả bằng CSS Custom Highlight (không đổi DOM của khung → không mất màu SQL / vùng chọn).
  const pv = $('preview'), fbar = $('lkfind'), fq = $('fq'), finfo = $('finfo');
  const hls = (window.CSS && CSS.highlights && window.Highlight) ? CSS.highlights : null;
  let fHits = [], fCur = -1, fNodes = null;
  const findOpen = () => fbar.classList.contains('show');
  function nodeMap() {
    if (fNodes) return fNodes;
    fNodes = []; let off = 0;
    const w = document.createTreeWalker(pv, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) { fNodes.push({ n, off }); off += n.nodeValue.length; }
    return fNodes;
  }
  function nodeAt(pos) {
    const m = nodeMap(); let lo = 0, hi = m.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (m[mid].off <= pos) lo = mid; else hi = mid - 1; }
    const e = m[lo]; return e ? [e.n, Math.min(Math.max(0, pos - e.off), e.n.nodeValue.length)] : [pv, 0];
  }
  function rangeOf(start, len) { const r = document.createRange(), a = nodeAt(start), b = nodeAt(start + len); r.setStart(a[0], a[1]); r.setEnd(b[0], b[1]); return r; }
  function scrollToRange(r) {
    const rc = r.getBoundingClientRect(), pc = pv.getBoundingClientRect();
    if (rc.top < pc.top + fbar.offsetHeight + 12 || rc.bottom > pc.bottom - 16) pv.scrollTop += rc.top - pc.top - pv.clientHeight / 3;
    if (rc.left < pc.left || rc.right > pc.right - 24) pv.scrollLeft += rc.left - pc.left - pv.clientWidth / 3;
  }
  function paintFind(scroll) {
    if (hls) { hls.delete('lk-find'); hls.delete('lk-cur'); }
    if (!findOpen() || !fHits.length) return;
    const len = fq.value.length;
    if (hls) { const all = new Highlight(); fHits.slice(0, 3000).forEach((p) => all.add(rangeOf(p, len))); hls.set('lk-find', all); }
    if (fCur < 0) return;
    const r = rangeOf(fHits[fCur], len);
    if (hls) hls.set('lk-cur', new Highlight(r));
    if (scroll) scrollToRange(r);
  }
  // mode: 'type' (đang gõ: giữ chỗ cũ nếu còn khớp), 'next', 'prev', 'reset' (object mới: từ đầu). Không phân biệt hoa thường, hết thì quay vòng.
  function runFind(mode, scroll) {
    const q = fq.value.toLowerCase(), text = pv.textContent.toLowerCase(), old = mode === 'reset' ? -1 : (fCur >= 0 ? fHits[fCur] : -1);
    fHits = [];
    if (q) for (let i = text.indexOf(q); i >= 0 && fHits.length < 9999; i = text.indexOf(q, i + 1)) fHits.push(i);
    const n = fHits.length;
    if (!n) fCur = -1;
    else if (mode === 'next') { fCur = fHits.findIndex((p) => p > old); if (fCur < 0) fCur = 0; }
    else if (mode === 'prev') { fCur = n - 1; for (let i = n - 1; i >= 0; i--) if (fHits[i] < old) { fCur = i; break; } }
    else { fCur = fHits.findIndex((p) => p >= Math.max(0, old)); if (fCur < 0) fCur = 0; }
    finfo.textContent = n ? (fCur + 1) + '/' + n + (n >= 9999 ? '+' : '') : (q ? 'Không có kết quả' : '');
    finfo.className = 'info' + (q && !n ? ' none' : '');
    paintFind(scroll !== false);
  }
  function afterRender(reset) { fNodes = null; if (findOpen()) runFind(reset ? 'reset' : 'type', false); }
  function openFind() {
    const sel = getSelection(), s = sel.toString();
    if (s && s.length <= 120 && !/[\r\n]/.test(s) && pv.contains(sel.anchorNode)) fq.value = s;   // chữ đang bôi đen 1 dòng → điền sẵn (như Monaco)
    fbar.classList.add('show'); fq.focus(); fq.select();
    runFind('type');
  }
  function closeFind() {
    const len = fq.value.length, cur = fCur >= 0 && fHits.length ? rangeOf(fHits[fCur], len) : null;
    fbar.classList.remove('show'); paintFind(false);
    pv.focus({ preventScroll: true });
    if (cur) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(cur); }   // để lại vùng chọn ở kết quả đang đứng (Ctrl+C được)
  }
  pv.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
    if (ctrl && e.code === 'KeyA') { e.preventDefault(); getSelection().selectAllChildren(pv); }
    else if (ctrl && e.code === 'KeyF') { e.preventDefault(); openFind(); }
    else if (e.key === 'F3' && findOpen() && fq.value) { e.preventDefault(); runFind(e.shiftKey ? 'prev' : 'next'); }
    else if (e.key === 'Escape' && findOpen()) { e.preventDefault(); closeFind(); }
  });
  fq.addEventListener('input', () => runFind('type'));
  fq.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'F3') { e.preventDefault(); runFind(e.shiftKey ? 'prev' : 'next'); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    else if (e.ctrlKey && !e.altKey && !e.shiftKey && e.code === 'KeyF') { e.preventDefault(); fq.select(); }
  });
  $('fnext').onclick = () => { runFind('next'); fq.focus(); };
  $('fprev').onclick = () => { runFind('prev'); fq.focus(); };
  $('fclose').onclick = closeFind;

  window.lookup = {
    onList(list) { $('list').innerHTML = list.map((o) => item(o, 'results')).join(''); selEl = null; },
    onDefinition(d) {
      defText = d.text; $('nm').textContent = d.name; $('preview').innerHTML = highlight(d.text); $('preview').scrollTop = 0; afterRender(true); if (mode === 'search') renderBottom();
      const tt = $('tq').value.trim().toLowerCase();
      if (fromText && tt && !d.text.startsWith('-- Đang tải')) { const n = d.text.split('\n').findIndex((l) => l.toLowerCase().includes(tt)); if (n >= 0) jumpToLine(n); }   // chọn từ khu tìm nội dung: nhảy tới dòng khớp đầu tiên
    },
    onTextList(list, note) { $('tlist').innerHTML = list.map((o) => '<div class="it" data-i="' + o.i + '" title="' + esc(o.name) + '"><span class="db">' + (o.sys ? '[Sys]' : '[App]') + '</span>' + esc(o.name) + '<span class="t">(' + esc(o.kind) + ')</span><span class="cnt">' + o.n + '×</span></div>').join(''); tsel = null; $('tst').textContent = note || ''; },
    onTextStatus(t) { $('tst').textContent = t || ''; },
    onHistory(list) { hist = list; if (mode === 'history') renderBottom(); },
    onData(d) { renderBottom(d); },
    onStatus: say,
  };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  post('search', { db: 2, filter: '', kinds: ['fn', 'proc', 'table', 'view', 'trigger'] });
})();
</script>
</body>
</html>
