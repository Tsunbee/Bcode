<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  html { font-size: clamp(12px, calc(0.4vw + 7.5px), 16px); }
  html, body { overflow: hidden; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); font-size: 1rem; user-select: text; -webkit-user-select: text; margin: 0; }
  button, input, select { font: inherit; color: var(--text); }
  .top { display: flex; align-items: center; gap: .5rem; padding: .5rem .8rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .top h2 { font-size: 1.05rem; margin: 0 .4rem 0 0; }
  .top .path { color: var(--text-muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46rem; }
  .top .grow { flex: 1; }
  #q { width: 16rem; padding: .25rem .5rem; background: var(--input); border: 1px solid var(--border); border-radius: 4px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .col:last-child { border-right: none; }
  body.nopk .main { grid-template-columns: minmax(0, 1fr); }
  body.nopk #colPk { display: none; }
  #bPk.on { border-color: var(--accent); color: var(--accent); }
  .det .more { color: var(--accent); cursor: pointer; font-size: .8rem; margin-top: .1rem; display: inline-block; }  .col h3 { margin: 0; padding: .45rem .8rem; font-size: .95rem; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: .5rem; align-items: center; }
  .col h3 .n { color: var(--text-muted); font-weight: normal; }
  .list { flex: 1; overflow: auto; }
  .item { padding: .45rem .8rem; border-bottom: 1px solid var(--border); cursor: default; }
  .item:hover { background: var(--panel-alt); }
  .item.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .item .t { font-weight: 600; word-break: break-all; }
  .item .s { color: var(--text-muted); font-size: .85rem; margin-top: .15rem; }
  .owner { display: inline-block; padding: 0 .4rem; border-radius: .6rem; font-size: .8rem; background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .done { color: #3fae5a; font-size: .8rem; }
  .grp { padding: .35rem .8rem; font-size: .85rem; font-weight: 600; background: var(--panel-alt); border-bottom: 1px solid var(--border); position: sticky; top: 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .grp:hover { background: color-mix(in srgb, var(--accent) 10%, var(--panel-alt)); }
  .grp .tw { display: inline-block; width: 1em; color: var(--text-muted); }
  .prog { display: inline-block; padding: 0 .4rem; border-radius: .6rem; font-size: .8rem; font-weight: normal; background: color-mix(in srgb, #3fae5a 22%, transparent); }
  .col h3 .tools { margin-left: auto; display: flex; gap: .35rem; align-items: center; font-weight: normal; font-size: .85rem; }
  .col h3 select { padding: .1rem .3rem; background: var(--input); border: 1px solid var(--border); border-radius: 4px; max-width: 14rem; }
  .col h3 button { padding: .05rem .45rem; }
  .det { border-top: 1px solid var(--border); max-height: 45%; overflow: auto; padding: .6rem .8rem; background: var(--panel); }
  .det:empty { display: none; }
  .det .k { color: var(--text-muted); font-size: .8rem; margin-top: .45rem; }
  .det pre { margin: .15rem 0 0; white-space: pre-wrap; word-break: break-word; font-family: Consolas, monospace; font-size: .85rem; }
  .det .acts { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
  .empty { padding: 1.2rem .8rem; color: var(--text-muted); }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="top">
  <h2>👥 Note &amp; update cả nhóm</h2>
  <span class="path" id="path"></span>
  <span class="grow"></span>
  <input type="text" id="q" placeholder="Lọc theo tên, người, nội dung..." spellcheck="false" autocomplete="off" />
  <button id="bPk" title="Hiện / ẩn cột các gói update đang có trong thư mục update của dự án">📦 Gói update</button>
  <button id="bOpen" title="Mở thư mục update trong Explorer">📂 Thư mục update</button>
  <button id="bRefresh" class="primary">⟳ Tải lại</button>
</div>
<div class="main">
  <div class="col" id="colPk">
    <h3>Gói update trong thư mục update <span class="n" id="pkCount"></span></h3>
    <div class="list" id="pk"></div>
    <div class="det" id="pkDet"></div>
  </div>
  <div class="col">
    <h3>Note cả nhóm <span class="n" id="ntCount"></span>
      <span class="tools">
        <select id="prog" title="Chỉ hiện y/c của lập trình này (dòng &quot;Lập trình: …&quot; trong nội dung y/c do Sync yêu cầu ghi; y/c không có dòng đó tính theo lập trình chính của file note)"><option value="">Lập trình: (tất cả)</option></select>
        <button id="bExpand" title="Bung tất cả người">⊞ Bung</button>
        <button id="bCollapse" title="Thu gọn tất cả người (chỉ còn dòng tên)">⊟ Thu gọn</button>
      </span></h3>
    <div class="list" id="nt"></div>
    <div class="det" id="ntDet"></div>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = (n) => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  let S = { packages: [], others: [], folder: '', update: '' }, selPk = -1, selNt = null;

  function match(text) {
    const toks = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const t = String(text || '').toLowerCase();
    return toks.every((x) => t.includes(x));
  }

  function renderPk() {
    const rows = S.packages.map((p, i) => ({ p, i })).filter(({ p }) => match([p.name, p.owner, p.description, p.note, p.usedBy].join(' ')));
    $('pkCount').textContent = '(' + rows.length + (rows.length !== S.packages.length ? '/' + S.packages.length : '') + ')';
    if (!S.packages.length) { $('pk').innerHTML = '<div class="empty">' + (S.update ? 'Chưa có gói update nào trong thư mục.' : 'Dự án chưa khai Working Path (thư mục update).') + '</div>'; $('pkDet').innerHTML = ''; return; }
    $('pk').innerHTML = rows.map(({ p, i }) => '<div class="item' + (i === selPk ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="t">' + (p.isFolder ? '📁 ' : '🗜 ') + esc(p.name) + '</div>' +
      '<div class="s">' + fmt(p.modified) + (p.owner ? ' · <span class="owner">' + esc(p.owner) + '</span>' : '') +
      (p.description ? ' · ' + esc(p.description.split('\n')[0].slice(0, 120)) : '') + '</div></div>').join('');
    renderPkDet();
  }

  function renderPkDet() {
    const p = S.packages[selPk];
    if (!p) { $('pkDet').innerHTML = ''; return; }
    $('pkDet').innerHTML = '<div class="t" style="font-weight:600;word-break:break-all">' + esc(p.name) + '</div>' +
      '<div class="k">Đường dẫn</div><pre>' + esc(p.path) + '</pre>' +
      (p.owner ? '<div class="k">Người tạo (theo tên gói)</div><pre>' + esc(p.owner) + '</pre>' : '') +
      (p.usedBy ? '<div class="k">Thuộc y/c</div><pre>' + esc(p.usedBy) + '</pre>' : '') +
      (p.description ? '<div class="k">description.txt</div><pre>' + esc(p.description) + '</pre>' : '') +
      (p.note ? '<div class="k">note.txt</div><pre>' + esc(p.note) + '</pre>' : '') +
      '<div class="acts"><button data-a="open">📂 Mở</button><button data-a="copy">⧉ Copy đường dẫn</button></div>';
  }

  // ---- Lập trình của y/c: dòng "Lập trình: X" do Sync yêu cầu ghi vào Request Content; không có thì lấy lập trình chính (nhiều y/c nhất) của file note ----
  const progRx = /Lập trình:\s*([^|\r\n]+)/;
  const progOfContent = (r) => { const m = progRx.exec(r.content || ''); return m ? m[1].trim().toUpperCase() : ''; };
  function indexProgs() {
    for (const o of S.others) {
      const cnt = {};
      o.requests.forEach((r) => { r._prog = progOfContent(r); if (r._prog) cnt[r._prog] = (cnt[r._prog] || 0) + 1; });
      o._progs = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
      o.requests.forEach((r) => { if (!r._prog) r._prog = o._progs[0] || ''; });
    }
  }
  // Y/c tạo tay (không Sync từ QLYC) trong file không có dòng "Lập trình:" nào → không biết lập trình: gom vào mục NO_PROG để vẫn lọc / thấy được.
  // Không nhớ lựa chọn lọc giữa các lần mở tab — lọc cũ còn đó từng làm cả file note toàn y/c tạo tay bị ẩn mà không biết.
  const NO_PROG = '\u0001';
  function fillProgs() {
    const cnt = {};
    S.others.forEach((o) => o.requests.forEach((r) => { const k = r._prog || NO_PROG; cnt[k] = (cnt[k] || 0) + 1; }));
    const cur = $('prog').value;
    $('prog').innerHTML = '<option value="">Lập trình: (tất cả)</option>' +
      Object.keys(cnt).filter((p) => p !== NO_PROG).sort().map((p) => '<option value="' + esc(p) + '">' + esc(p) + ' (' + cnt[p] + ')</option>').join('') +
      (cnt[NO_PROG] ? '<option value="' + NO_PROG + '">(chưa rõ lập trình — y/c tạo tay) (' + cnt[NO_PROG] + ')</option>' : '');
    $('prog').value = cnt[cur] ? cur : '';
  }

  // ---- Thu gọn / bung theo người: nhớ người đang BUNG (localStorage); mặc định nhiều người thì thu gọn hết, 1 người thì bung ----
  let expanded = null;
  try { const v = JSON.parse(localStorage.getItem('teamExpanded') || 'null'); if (Array.isArray(v)) expanded = new Set(v); } catch (e) { }
  const saveExpanded = () => { try { localStorage.setItem('teamExpanded', JSON.stringify([...expanded])); } catch (e) { } };
  const isOpen = (o) => (expanded ? expanded.has(o.owner) : S.others.length <= 1);
  function setOpen(owner, open) {
    if (!expanded) expanded = new Set(S.others.filter(isOpen).map((o) => o.owner));
    if (open) expanded.add(owner); else expanded.delete(owner);
    saveExpanded();
  }

  function renderNt() {
    let total = 0, shown = 0, html = '';
    const prog = $('prog').value;
    const filtering = !!(prog || $('q').value.trim());
    for (const o of S.others) {
      const reqs = o.requests.filter((r) => (!prog || (r._prog || NO_PROG) === prog) &&
        match([o.owner, r._prog, r.name, r.content, r.note, r.genAll, r.filePaths, r.procedures, r.proceduresSys].join(' ')));
      total += o.requests.length; shown += reqs.length;
      if (!reqs.length) continue;
      // Đang lọc (ô tìm / chọn lập trình) thì bung các người có kết quả; không lọc thì theo trạng thái thu gọn / bung đã chọn.
      const open = filtering || isOpen(o);
      const pending = o.requests.filter((r) => !r.done).length;
      html += '<div class="grp" data-o="' + esc(o.owner) + '" title="Bấm để ' + (open ? 'thu gọn' : 'bung') + (filtering ? ' (đang lọc: luôn bung người có kết quả)' : '') + '">' +
        '<span class="tw">' + (open ? '▾' : '▸') + '</span>🖥 ' + esc(o.owner) + (o.mine ? ' <span class="owner">tôi</span>' : '') +
        (o._progs.length ? ' <span class="prog" title="Lập trình (theo dòng &quot;Lập trình:&quot; trong nội dung y/c)">👤 ' + esc(o._progs.slice(0, 3).join(', ')) + (o._progs.length > 3 ? '…' : '') + '</span>' : '') +
        ' <span class="muted" style="font-weight:normal">· cập nhật ' + fmt(o.modified) + ' · ' + (reqs.length !== o.requests.length ? reqs.length + '/' : '') + o.requests.length + ' y/c' +
        (pending ? ' · ' + pending + ' chưa xong' : '') + '</span></div>';
      if (!open) continue;
      html += reqs.map((r) => {
        const key = o.owner + '|' + r.id;
        return '<div class="item' + (selNt === key ? ' sel' : '') + '" data-k="' + esc(key) + '">' +
          '<div class="t">' + esc(r.name) + (r.done ? ' <span class="done">✔ xong</span>' : '') + '</div>' +
          '<div class="s">' + fmt(r.begin) + (r.updated ? ' → ' + fmt(r.updated) : '') + (r.content ? ' · ' + esc(r.content.split('\n')[0].slice(0, 110)) : '') + '</div></div>';
      }).join('');
    }
    $('ntCount').textContent = '(' + shown + (shown !== total ? '/' + total : '') + ')';
    $('nt').innerHTML = html || '<div class="empty">' + (S.local ? 'Note đang lưu trên máy này (dự án chưa khai Working Path / thư mục chung) — không có note của người khác.' : (S.others.length ? 'Không có y/c nào khớp bộ lọc.' : 'Chưa có note của người khác trong ' + esc(S.folder) + '.')) + '</div>';
    renderNtDet();
  }

  function findNt(key) {
    if (!key) return null;
    const [owner, id] = key.split('|');
    const o = S.others.find((x) => x.owner === owner);
    const r = o && o.requests.find((x) => x.id === id);
    return r ? { o, r } : null;
  }

  function renderNtDet() {
    const f = findNt(selNt);
    if (!f) { $('ntDet').innerHTML = ''; return; }
    const r = f.r;
    // Khối dài (vd 40 dòng File Path) chỉ hiện 8 dòng đầu — bấm "xem đủ" để bung (nhớ theo khối cho tới khi chọn y/c khác).
    const MAXL = 8;
    const block = (k, v) => {
      if (!(v && String(v).trim())) return '';
      const lines = String(v).replace(/\s+$/, '').split(/\r?\n/);
      const long = lines.length > MAXL + 2, open = openBlocks.has(k);
      return '<div class="k">' + k + (long ? ' (' + lines.length + ' dòng)' : '') + '</div><pre>' + esc(long && !open ? lines.slice(0, MAXL).join('\n') : lines.join('\n')) + '</pre>' +
        (long ? '<span class="more" data-blk="' + esc(k) + '">' + (open ? '▴ thu gọn' : '▾ xem đủ ' + lines.length + ' dòng') + '</span>' : '');
    };
    const gens = (r.generations || []).map((g) => '<div><span class="link" data-gen="' + esc(g.path) + '">' + esc(g.path) + '</span> <span class="muted">' + fmt(g.time) + '</span></div>').join('');
    $('ntDet').innerHTML = '<div class="t" style="font-weight:600">' + esc(r.name) + ' <span class="owner">' + esc(f.o.owner) + '</span>' + (r._prog ? ' <span class="prog">👤 ' + esc(r._prog) + '</span>' : '') + '</div>' +
      '<div class="acts" style="margin-top:.35rem">' + (f.o.mine
        // Note của chính mình: không cần chép / xem chỉ đọc — mở thẳng y/c ở Note (New) + Xem trước gói.
        ? '<button data-a="gen" class="primary" title="Mở y/c này ở Note (New) của bạn và tự Xem trước gói — bổ sung chỗ còn thiếu rồi bấm ⚙ Generate Update ở đó">⚙ Tạo gói update…</button></div>' :
      '<button data-a="gen" class="primary" title="KHÔNG tạo gói ngay: dán y/c này (Gen All, File Path, SQL Object, script, table…) vào Note (New) của bạn thành y/c &quot;' + esc(r.name) + ' (từ ' + esc(f.o.owner) + ')&quot;, mở ra và tự Xem trước gói — bạn xem còn thiếu gì, bổ sung, rồi bấm ⚙ Generate Update ở Note (New). Đã dán trước đó thì mở lại bản đã dán. Note của ' + esc(f.o.owner) + ' không bị sửa.">⚙ Tạo gói update…</button>' +
      '<button data-a="note" title="Mở note của ' + esc(f.o.owner) + ' ở tab Note (New) (chỉ đọc), chọn sẵn y/c này — chỉ để xem; muốn bổ sung rồi gen thì dùng ⚙ Tạo gói update…">📝 Xem ở Note (New)</button>' +
      '<button data-a="clone" title="Chép y/c này vào Note (New) của bạn để sửa / gen lại">＋ Chép về note của tôi</button></div>') +
      block('Request Content', r.content) + block('Note', r.note) + block('Gen All', r.genAll) + block('File Path', r.filePaths) +
      block('SQL Object (App)', r.procedures) + block('SQL Object (Sys)', r.proceduresSys) +
      block('Top Script (App)', r.topScript) + block('Bottom Script (App)', r.bottomScript) +
      block('Top Script (Sys)', r.topScriptSys) + block('Bottom Script (Sys)', r.bottomScriptSys) +
      (gens ? '<div class="k">Đã Generate Update (của ' + esc(f.o.owner) + ')</div>' + gens : '');
  }
  let openBlocks = new Set();

  $('pk').addEventListener('click', (e) => { const it = e.target.closest('.item'); if (!it) return; selPk = +it.dataset.i; renderPk(); });
  $('pk').addEventListener('dblclick', (e) => { const it = e.target.closest('.item'); if (it) post('open', { path: S.packages[+it.dataset.i].path }); });
  $('nt').addEventListener('click', (e) => {
    const g = e.target.closest('.grp');
    if (g) {
      if ($('prog').value || $('q').value.trim()) return;   // đang lọc: nhóm có kết quả luôn bung
      const o = S.others.find((x) => x.owner === g.dataset.o); if (!o) return;
      setOpen(o.owner, !isOpen(o)); renderNt(); return;
    }
    const it = e.target.closest('.item'); if (!it) return;
    if (selNt !== it.dataset.k) openBlocks = new Set();
    selNt = it.dataset.k; renderNt();
  });
  $('prog').addEventListener('change', () => renderNt());
  try { localStorage.removeItem('teamProg'); } catch (e) { }   // bản trước có nhớ lọc lập trình — bỏ
  $('bExpand').onclick = () => { expanded = new Set(S.others.map((o) => o.owner)); saveExpanded(); renderNt(); };
  $('bCollapse').onclick = () => { expanded = new Set(); saveExpanded(); renderNt(); };
  $('pkDet').addEventListener('click', (e) => {
    const b = e.target.closest('button'); const p = S.packages[selPk]; if (!b || !p) return;
    if (b.dataset.a === 'open') post('open', { path: p.path }); else if (b.dataset.a === 'copy') post('copy', { text: p.path });
  });
  $('ntDet').addEventListener('click', (e) => {
    const g = e.target.closest('[data-gen]'); if (g) { post('open', { path: g.dataset.gen }); return; }
    const cp = e.target.closest('[data-copy]'); if (cp) { post('copy', { text: cp.dataset.copy }); return; }
    const m = e.target.closest('[data-blk]');
    if (m) { const k = m.dataset.blk; if (openBlocks.has(k)) openBlocks.delete(k); else openBlocks.add(k); const st = $('ntDet').scrollTop; renderNtDet(); $('ntDet').scrollTop = st; return; }
    const b = e.target.closest('button'); const f = findNt(selNt); if (!b || !f) return;
    if (b.dataset.a === 'clone') post('clone', { owner: f.o.owner, id: f.r.id });
    else if (b.dataset.a === 'note') post('openInNote', { owner: f.o.owner, id: f.r.id });
    // Tạo gói: không gen ngay — dán y/c sang Note (New) của mình để xem / bổ sung rồi mới Generate ở đó.
    else if (b.dataset.a === 'gen') post('editInNote', { owner: f.o.owner, id: f.r.id });
  });
  $('q').addEventListener('input', () => { renderPk(); renderNt(); });
  $('bRefresh').onclick = () => { $('bRefresh').disabled = true; $('bRefresh').textContent = 'Đang tải...'; post('refresh'); };
  $('bOpen').onclick = () => post('open', { path: S.update });

  window.team = {
    init(d) {
      S = d; $('bRefresh').disabled = false; $('bRefresh').textContent = '⟳ Tải lại';
      $('path').textContent = (d.project ? d.project + ' · ' : '') + (d.update || '(chưa khai Working Path)') + (d.error ? '  — ' + d.error : '');
      $('bOpen').disabled = !d.update;
      if (selPk >= S.packages.length) selPk = -1;
      S.others = S.others || [];
      indexProgs();
      fillProgs();
      renderPk(); renderNt();
    },
    toast(msg) { $('path').textContent = msg; setTimeout(() => window.team.init(S), 2500); },
  };
  // Cột "Gói update": ẩn mặc định (chỉ cần xem note của người khác) — nút 📦 bật lại, nhớ lựa chọn.
  let showPk = false;
  try { showPk = localStorage.getItem('teamShowPk') === '1'; } catch (e) { }
  const applyPk = () => { document.body.classList.toggle('nopk', !showPk); $('bPk').classList.toggle('on', showPk); $('bPk').title = (showPk ? 'Ẩn' : 'Hiện') + ' cột các gói update đang có trong thư mục update của dự án'; };
  applyPk();
  $('bPk').onclick = () => { showPk = !showPk; try { localStorage.setItem('teamShowPk', showPk ? '1' : '0'); } catch (e) { } applyPk(); };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  post('ready');
})();
</script>
</body>
