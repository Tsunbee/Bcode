<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body { display: flex; flex-direction: column; background: var(--panel); }
  input[type="text"] { user-select: text; -webkit-user-select: text; width: 100%; }
  select { width: 100%; }
  main { flex: 1; overflow-y: auto; padding: 14px clamp(12px, 4vw, 24px); }
  h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.45; }
  .card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
  .warn { margin-top: 10px; font-size: 12px; color: var(--warning); }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px clamp(12px, 4vw, 24px); background: var(--panel-alt); border-top: 1px solid var(--border); }
  #status { flex: 1 1 220px; font-size: 12.5px; line-height: 1.35; color: var(--text-muted); min-width: 0; }
  #status.err { color: var(--danger); } #status.ok { color: var(--success); }
  footer .actions { display: flex; gap: 8px; margin-left: auto; }
  .btn-border { border-color: var(--border); }
  .btn-danger { background: var(--danger); color: #fff; font-weight: 600; }
  .btn-danger:hover { filter: brightness(1.1); background: var(--danger); }
</style>
</head>
<body>
<main>
  <h2>Change Owner</h2>
  <div class="sub">Chuyển 1 object SQL sang schema khác (<code>ALTER SCHEMA ... TRANSFER</code>). Mọi code/view/proc tham chiếu object bằng tên schema cũ sẽ phải sửa lại.</div>
  <div class="card">
    <div class="grid">
      <div><label for="db">Database</label>
        <select id="db"><option value="app">App Data</option><option value="sys">Sys Data</option></select></div>
      <div><label for="newSchema">Schema mới</label><input type="text" id="newSchema" placeholder="vd: dbo" spellcheck="false" /></div>
      <div class="full"><label for="obj">Object (schema.name) — gõ để gợi ý</label>
        <input type="text" id="obj" list="objList" placeholder="dbo.tenobject" spellcheck="false" autocomplete="off" />
        <datalist id="objList"></datalist></div>
    </div>
    <div class="warn">⚠ Thao tác này không hoàn tác được từ Bcode.</div>
  </div>
</main>
<footer>
  <div id="status"></div>
  <div class="actions">
    <button class="btn btn-border" id="bClose">Đóng</button>
    <button class="btn btn-danger" id="bRun">Đổi Owner (ALTER SCHEMA TRANSFER)</button>
  </div>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  function post(action, data) { window.chrome.webview.postMessage(JSON.stringify({ action, data })); }
  function setStatus(text, kind) { const s = $('status'); s.textContent = text || ''; s.className = kind || ''; }

  function run() {
    post('run', { sys: $('db').value === 'sys', object: $('obj').value, schema: $('newSchema').value });
  }
  $('bRun').onclick = run;
  $('bClose').onclick = () => post('close');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('close'); });

  window.setTheme = (isDark) => document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  window.init = (state) => { $('obj').value = state.object || ''; $('obj').focus(); };
  window.setSuggestions = (names) => {
    const dl = $('objList'); dl.textContent = '';
    names.forEach((n) => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  };
  window.setStatus = setStatus;
  window.setBusy = (b) => { $('bRun').disabled = b; };

  post('ready');
</script>
</body>
</html>
