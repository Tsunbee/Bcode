<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 4px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .row { display: flex; align-items: center; gap: 8px; }
  #pathLabel {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  #modifiedLabel { color: var(--text-muted); font-size: 12px; flex: 1; min-width: 0; }
  #breadcrumbLabel {
    color: var(--text-muted);
    font-size: 12px;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: none;
    max-width: 55%;
  }
  button { flex: none; }
</style>
</head>
<body>
  <div class="row">
    <span id="pathLabel">(chưa chọn file nào)</span>
    <button class="btn btn-primary" id="btnEdit" disabled>Edit in BcodeViewer</button>
  </div>
  <div class="row">
    <span id="modifiedLabel"></span>
    <span id="breadcrumbLabel"></span>
  </div>

<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }

  document.getElementById('btnEdit').addEventListener('click', function (e) {
    if (e.target.disabled) return;
    post({ action: 'edit' });
  });

  // ---- Called from C# (FileLookupControl) ----
  window.setPreview = function (path, modified, breadcrumb, editEnabled) {
    document.getElementById('pathLabel').textContent = path;
    document.getElementById('modifiedLabel').textContent = modified;
    document.getElementById('breadcrumbLabel').textContent = breadcrumb;
    document.getElementById('btnEdit').disabled = !editEnabled;
  };
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  };
</script>
</body>
</html>
