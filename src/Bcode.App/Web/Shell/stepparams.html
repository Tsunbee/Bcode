<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="dialog.css" />
<style>
  .grid { display: grid; grid-template-columns: minmax(10rem, 22%) minmax(0, 1fr); gap: .45rem .8rem; align-items: center; }
  .grid .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid .n small { color: var(--text-muted); }
  .grid input { width: 100%; box-sizing: border-box; font-family: Consolas, 'Cascadia Mono', monospace; }
</style>
</head>
<body>
<div class="dlg-main">
  <div id="head" class="hint"></div>
  <div id="grid" class="grid"></div>
</div>
<div class="dlg-bar"><span class="grow"></span><button id="bCancel">Huỷ</button><button id="bOk" class="primary">Bắt đầu debug</button></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const collect = () => Object.fromEntries([...document.querySelectorAll('input[data-p]')].map((i) => [i.dataset.p, i.value]));
  $('bOk').onclick = () => post('ok', { values: collect() });
  $('bCancel').onclick = () => post('cancel');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post('cancel'); else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); post('ok', { values: collect() }); } });
  window.stepParams = {
    init(d) {
      $('head').textContent = d.routine + " — nhập giá trị tham số (dạng T-SQL: 'chuỗi', số, NULL):";
      $('grid').innerHTML = d.parameters.map((p) =>
        '<div class="n" title="' + esc(p.name + ' (' + p.type + ')') + '">' + esc(p.name) + ' <small>(' + esc(p.type) + ')</small></div>' +
        '<input type="text" data-p="' + esc(p.name) + '" value="' + esc(p.value) + '" spellcheck="false">').join('');
      const first = document.querySelector('input[data-p]'); if (first) { first.focus(); first.select(); }
    },
  };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
</body>
</html>
