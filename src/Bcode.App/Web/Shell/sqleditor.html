<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body, #editor-container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1e1e1e;
        }
        /* Chấm cảnh báo ở lề trái (glyph margin), ngay bên cạnh dòng code bị lỗi dấu
           (thiếu/dư dấu nháy, dấu ngoặc, dấu phẩy...) — xem lintSqlPunctuation(). */
        .bcodeDauError::before { content: '●'; color: #f14c4c; font-size: 13px; line-height: 18px; }
        .bcodeDauWarn::before { content: '●'; color: #e2c08d; font-size: 13px; line-height: 18px; }
        /* Debug từng bước: chấm đỏ breakpoint ở lề, mũi tên + nền vàng ở dòng sắp chạy, thanh điều khiển nổi góc phải. */
        .bcodeBp { cursor: pointer; }
        .bcodeBp::before { content: '●'; color: #e51400; font-size: 15px; line-height: 18px; }
        .bcodeDbgArrow::before { content: '▶'; color: #ffcc00; font-size: 12px; line-height: 18px; margin-left: 2px; }
        .bcodeDbgLine { background: rgba(255, 204, 0, 0.22); }
        #dbgBar { position: absolute; top: 6px; right: 26px; z-index: 30; display: none; align-items: center; gap: 4px;
                  padding: 4px 6px; border-radius: 8px; font: 12px 'Segoe UI', sans-serif; color: #ddd;
                  background: #2d2d30; border: 1px solid #f5a623; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
        html.light #dbgBar { background: #fff; color: #222; }
        #dbgBar button { font: inherit; color: inherit; background: #3e3e42; border: 1px solid #555; border-radius: 5px; padding: 3px 9px; cursor: pointer; }
        html.light #dbgBar button { background: #e8e8e8; border-color: #bbb; }
        #dbgBar button:hover { border-color: #f5a623; }
        #dbgBar button.primary { background: #f5a623; color: #1c1608; border-color: #f5a623; font-weight: 600; }
        #dbgBar .info { padding: 0 6px; opacity: .85; white-space: nowrap; }
        /* Dòng GO: chữ trắng đậm nền đỏ như FCode (Keyword7) — xem updateGoDecorations(). */
        .bcodeGo { color: #ffffff !important; background: #ff0000; font-weight: bold; }
    </style>
    <!-- Monaco nạp từ bản đóng gói sẵn trong chương trình (viewer/vs, cùng bộ BcodeViewer dùng) — không phụ thuộc mạng, không phải tải lại từ CDN mỗi lần mở tab. -->
    <script src="sqlhints.js" charset="utf-8"></script>
<script src="viewer/vs/loader.js"></script>
</head>
<body data-area="editor">
    <div id="editor-container"></div>
    <div id="dbgBar">
        <span class="info" id="dbgInfo">Debug</span>
        <button class="primary" id="dbgNext" title="Chạy dòng kế (F10)">⤵ Step</button>
        <button id="dbgCont" title="Chạy tiếp tới breakpoint / hết (F5)">▶ Continue</button>
        <button id="dbgCursor" title="Chạy tới dòng con trỏ (Ctrl+F10)">⇥ To cursor</button>
        <button id="dbgStop" title="Dừng debug (Shift+F5)">⏹ Stop</button>
    </div>

    <script>
        var editor;
        var isReady = false;
        
        // Quản lý trạng thái Copilot Inline
        window.copilotEnabled = true;
        // Gợi ý TỰ ĐỘNG khi đang gõ (bật/tắt ở menu ⚙). Tắt thì chỉ còn gợi ý khi bấm Alt+\ (gọi tay).
        window.copilotAuto = true;
        var _copilotReqCounter = 0;
        var _copilotResolvers = {};
        var _copilotDebounceTimer = null;
        var _lateCopilotSuggestion = null; // { text, position, modelVersion }
        // Danh sách bảng trong Database nạp từ C#
        var _dbTables = [];
        window.setDatabaseTables = function (tables) {
            _dbTables = tables || [];
        };

        // ================================================================
        // CẢNH BÁO SAI DẤU TRONG SQL — dấu nháy đơn ' chưa đóng, dấu ngoặc
        // ( ) [ ] không khớp, dấu phẩy , dư thừa ngay trước khi câu lệnh kết
        // thúc. Chạy hoàn toàn ở client (không đụng C#/server), quét lại có
        // debounce mỗi khi gõ, hiện gạch chân đỏ/vàng ngay dưới chỗ lỗi (hover
        // để xem chi tiết) + 1 chấm ở lề trái ngay cạnh dòng đó.
        //
        // CHỦ ĐÍCH THU HẸP PHẠM VI: chỉ bắt 3 lỗi có thể xác định chắc chắn,
        // không đoán "thiếu dấu phẩy giữa 2 cột" hay tương tự — dễ báo sai vì
        // SQL cho phép nhiều cú pháp hợp lệ trông giống lỗi (alias không có
        // AS, xuống dòng tuỳ ý...). Nếu Bee cần bắt thêm kiểu lỗi khác thì nói
        // để bổ sung, thay vì đoán rộng ra dễ gây báo sai (false positive).
        // ================================================================
        var _lintDebounceTimer = null;
        var _dauDecorationIds = [];

        function scheduleSqlLint() {
            if (_lintDebounceTimer) clearTimeout(_lintDebounceTimer);
            _lintDebounceTimer = setTimeout(runSqlLint, 500);
        }

        function runSqlLint() {
            if (!editor || !window.monaco) return;
            var model = editor.getModel();
            if (!model) return;

            var issues = lintSqlPunctuation(model.getValue());

            var markers = issues.map(function (it) {
                return {
                    severity: it.severity === 'error' ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning,
                    message: it.message,
                    startLineNumber: it.line,
                    startColumn: it.column,
                    endLineNumber: it.line,
                    endColumn: it.column + 1
                };
            });
            monaco.editor.setModelMarkers(model, 'bcode-dau', markers);

            var glyphs = issues.map(function (it) {
                return {
                    range: new monaco.Range(it.line, 1, it.line, 1),
                    options: {
                        isWholeLine: false,
                        glyphMarginClassName: it.severity === 'error' ? 'bcodeDauError' : 'bcodeDauWarn',
                        glyphMarginHoverMessage: { value: it.message }
                    }
                };
            });
            _dauDecorationIds = editor.deltaDecorations(_dauDecorationIds, glyphs);
        }

        // Quét toàn bộ text 1 lượt, tự theo dõi đang ở trong chuỗi '...'/comment
        // --.../ /*...*/ hay không, để không báo sai vì dấu nằm TRONG chuỗi hay
        // comment (ví dụ dấu ( trong 1 câu comment tiếng Việt không phải lỗi).
        function lintSqlPunctuation(text) {
            var issues = [];
            var n = text.length;
            var i = 0, line = 1, col = 1;
            var state = 'normal'; // normal | string | linecomment | blockcomment
            var stringStartLine = 0, stringStartCol = 0, stringStartOffset = 0;
            var parenStack = [];
            var bracketStack = [];
            var maskedChars = [];
            var stringSpans = []; // { start, line, col } — vị trí bắt đầu (dấu ' mở) của mỗi chuỗi, kể cả '' rỗng

            function step(ch) {
                maskedChars.push(ch);
                if (ch === '\n') { line++; col = 1; } else { col++; }
            }

            while (i < n) {
                var ch = text.charAt(i);
                var next = i + 1 < n ? text.charAt(i + 1) : '';

                if (state === 'normal') {
                    if (ch === '-' && next === '-') { state = 'linecomment'; step(' '); i++; step(' '); i++; continue; }
                    if (ch === '/' && next === '*') { state = 'blockcomment'; step(' '); i++; step(' '); i++; continue; }
                    if (ch === "'") {
                        state = 'string'; stringStartLine = line; stringStartCol = col; stringStartOffset = i;
                        stringSpans.push({ start: i, line: line, col: col });
                        step('#'); i++; continue;
                    }
                    if (ch === '(') { parenStack.push({ line: line, column: col }); step(ch); i++; continue; }
                    if (ch === ')') {
                        if (parenStack.length === 0) {
                            issues.push({ severity: 'error', line: line, column: col, message: 'Dấu ")" thừa — không có dấu "(" tương ứng phía trước.' });
                        } else {
                            parenStack.pop();
                        }
                        step(ch); i++; continue;
                    }
                    if (ch === '[') { bracketStack.push({ line: line, column: col }); step(ch); i++; continue; }
                    if (ch === ']') {
                        if (bracketStack.length === 0) {
                            issues.push({ severity: 'error', line: line, column: col, message: 'Dấu "]" thừa — không có dấu "[" tương ứng phía trước.' });
                        } else {
                            bracketStack.pop();
                        }
                        step(ch); i++; continue;
                    }
                    step(ch); i++; continue;
                }

                if (state === 'string') {
                    // ĐÃ SỬA (báo sai "dư dấu phẩy"): nội dung chuỗi trước đây bị che bằng
                    // dấu cách ' ' giống hệt comment — khiến ",  'giá trị'  )" (dấu phẩy rồi
                    // tới 1 chuỗi rồi mới tới ")") bị hiểu lầm là "dấu phẩy rồi chỉ có
                    // khoảng trắng rồi tới )", tức dư dấu phẩy — SAI, vì thật ra có 1 chuỗi
                    // (nội dung hợp lệ) nằm giữa. Khác với comment (không phải code, có thể
                    // coi như "trong suốt"/bỏ qua được), 1 chuỗi '...' LÀ 1 giá trị thật của
                    // câu lệnh nên không được xem như khoảng trắng. Che bằng '#' (khác hẳn
                    // \s) để các rule dùng [ \t\r\n]* (chỉ được phép có khoảng trắng thật)
                    // không còn "xuyên" qua được nội dung chuỗi nữa — vẫn giữ nguyên độ dài
                    // để line/col không lệch.
                    if (ch === "'") {
                        if (next === "'") { step('#'); i++; step('#'); i++; continue; } // '' = dấu nháy thoát trong chuỗi
                        state = 'normal'; step('#'); i++; continue;
                    }
                    step('#'); i++; continue;
                }

                if (state === 'linecomment') {
                    if (ch === '\n') { state = 'normal'; step('\n'); i++; continue; }
                    step(' '); i++; continue;
                }

                if (state === 'blockcomment') {
                    if (ch === '*' && next === '/') { state = 'normal'; step(' '); i++; step(' '); i++; continue; }
                    step(ch === '\n' ? '\n' : ' '); i++; continue;
                }
            }

            if (state === 'string') {
                issues.push({ severity: 'error', line: stringStartLine, column: stringStartCol, message: 'Chuỗi bắt đầu bằng dấu \' ở đây nhưng chưa được đóng lại (thiếu dấu \' đóng chuỗi).' });
            }
            parenStack.forEach(function (p) {
                issues.push({ severity: 'error', line: p.line, column: p.column, message: 'Dấu "(" ở đây chưa có dấu ")" đóng tương ứng.' });
            });
            bracketStack.forEach(function (p) {
                issues.push({ severity: 'error', line: p.line, column: p.column, message: 'Dấu "[" ở đây chưa có dấu "]" đóng tương ứng.' });
            });

            // Dư dấu phẩy: 1 dấu , (trên bản đã che nội dung chuỗi/comment) mà theo
            // sau (bỏ qua khoảng trắng/xuống dòng) là dấu ) hoặc 1 từ khoá bắt đầu
            // mệnh đề tiếp theo, hoặc dấu ; hoặc hết câu lệnh — gần như luôn là gõ dư.
            var masked = maskedChars.join('');
            var trailingCommaRe = /,[ \t\r\n]*(\)|;|$|\b(FROM|WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|UNION|EXCEPT|INTERSECT|JOIN)\b)/gim;
            var m;
            while ((m = trailingCommaRe.exec(masked)) !== null) {
                var pos = offsetToLineCol(masked, m.index);
                issues.push({ severity: 'warning', line: pos.line, column: pos.col, message: 'Dư dấu phẩy "," ngay trước đây — kiểm tra lại danh sách cột/điều kiện có bị thừa dấu phẩy không.' });
                trailingCommaRe.lastIndex = m.index + 1;
            }

            // Chuỗi '...' nằm ngay sau tên bảng trong FROM/JOIN (chỉ cách nhau bởi
            // khoảng trắng, không có dấu , hay từ khoá nào khác chen vào) — SQL Server
            // không cho phép bí danh bảng là 1 chuỗi nháy đơn, nên đây gần như luôn là
            // dấu ' dư/gõ nhầm (vd: FROM sys.tables ''). CHỈ áp dụng ngay sau FROM/JOIN
            // để không đụng tới kiểu "SELECT cot 'Tên cột'" (đặt bí danh cột bằng chuỗi,
            // vốn là cú pháp hợp lệ và rất hay dùng trong SQL báo cáo).
            // ĐÃ SỬA (lỗi hiệu năng): trước đây masked.slice(0, sp.start) cắt lại TOÀN
            // BỘ phần đầu file cho MỖI chuỗi '...' tìm thấy — với script vài chục
            // nghìn dòng có nhiều giá trị chuỗi (insert dữ liệu hàng loạt...), số
            // chuỗi có thể lên tới hàng nghìn, khiến tổng chi phí thành bậc 2
            // (O(số_chuỗi × độ_dài_file)) và làm treo UI khi gõ. Vì regex chỉ cần
            // xem "FROM/JOIN <tên bảng>" nằm NGAY TRƯỚC dấu ' mở chuỗi, không cần
            // quét ngược cả file — chỉ cần cắt 1 cửa sổ ngắn phía trước là đủ (300
            // ký tự dư sức chứa tên bảng có schema + ngoặc vuông + AS dài nhất).
            var LOOKBACK_WINDOW = 300;
            var fromJoinAliasRe = /\b(FROM|JOIN)\s+[A-Za-z_][\w.\[\]]*(\s+AS)?\s*$/i;
            stringSpans.forEach(function (sp) {
                var before = masked.slice(Math.max(0, sp.start - LOOKBACK_WINDOW), sp.start);
                if (fromJoinAliasRe.test(before)) {
                    issues.push({ severity: 'warning', line: sp.line, column: sp.col, message: 'Dấu \' ngay sau tên bảng trong FROM/JOIN — bí danh bảng không được là chuỗi nháy đơn, kiểm tra lại có dư dấu \' (hoặc \'\') không.' });
                }
            });

            return issues;
        }

        function offsetToLineCol(str, offset) {
            var line = 1, col = 1;
            for (var k = 0; k < offset; k++) {
                if (str.charAt(k) === '\n') { line++; col = 1; } else { col++; }
            }
            return { line: line, col: col };
        }

        // ---------------- Tô màu SQL giống FCode ----------------
        // Bộ tô màu 'sql' có sẵn của Monaco tô cả trăm từ khoá (NAME, TYPE, STATUS...) và không biết @biến, #bảng tạm,
        // FastBusiness$... nên đọc rất rối. Thay bằng đúng các danh sách trong file cấu hình SQL của FCode (viewsqlconfig.xml:
        // Keyword0/1/4/5/7 + KeywordStart), màu cũng lấy từ đó (Light Theme / Dark Theme).
        var FCODE_SQL_WORDS = {
            kw0: 'print select from where case when return path returns order by group having create table exec insert into update delete set as int with char nchar varchar nvarchar datetime smalldatetime tinyint smallint bit numeric float double if else begin end then while break union try catch transaction commit proc store procedure declare fetch next for close deallocate open cursor function trigger index primary alter column identity database drop distinct constraint top on add clustered key remove truncate any asc desc backup view unique full outer values decimal rollback savepoint collation image foreign',
            kw1: 'join left right exists not is in null and or between all like',
            fn: 'round dateadd datediff datename datepart getdate charindex object_id object_name patindex stuff isnull day month year convert cast fetch_status rowcount version server str ltrim rtrim trim replace substring replicate col_length len datalength sum avg max min count check checksum ascii concat upper lower reverse space',
            sp: 'xml sp_execute sp_executesql'
        };

        var FCODE_SQL_COLORS = {
            light: { fg: '000000', kw0: '0000ff', kw1: '787878', fn: 'ff00ff', sp: '8f1e00', variable: '646464', sysvar: 'ff00ff',
                     obj: 'a1211d', temp: '2db3a5', comment: '33a12d', number: 'ff0000', string: 'ff0000', op: '000000',
                     bg: '#ffffff', gutter: '#e6e6e6', lineNo: '#0a8594', curLine: '#dfebf7', selection: '#dcdcdc',
                     brace: '#ff0000', caret: '#000000', wordHl: '#ff00003c', space: '#c8c8c8' },
            dark:  { fg: 'c9d4b1', kw0: '569cd6', kw1: '787878', fn: 'e866c8', sp: 'f74f4a', variable: 'ffffff', sysvar: 'e866c8',
                     obj: 'f74f4a', temp: '2db3a5', comment: '7ce866', number: 'ce9178', string: 'ce9178', op: 'ce9178',
                     bg: '#1e1e1e', gutter: '#1e1e1e', lineNo: '#0a8594', curLine: '#3c3c3c', selection: '#264f78',
                     brace: '#ffffff', caret: '#969696', wordHl: '#fffa0064', space: '#4a4a4a' }
        };

        function fcodeSqlRules(isDark) {
            var c = isDark ? FCODE_SQL_COLORS.dark : FCODE_SQL_COLORS.light;
            return [
                { token: 'identifier', foreground: c.fg },
                { token: 'fc-kw0', foreground: c.kw0 },
                { token: 'fc-kw1', foreground: c.kw1 },
                { token: 'fc-fn', foreground: c.fn },
                { token: 'fc-sp', foreground: c.sp },
                { token: 'fc-go', foreground: c.kw0, fontStyle: 'bold' },
                { token: 'fc-var', foreground: c.variable },
                { token: 'fc-sysvar', foreground: c.sysvar },
                { token: 'fc-obj', foreground: c.obj },
                { token: 'fc-temp', foreground: c.temp },
                { token: 'fc-op', foreground: c.op },
                { token: 'comment', foreground: c.comment },
                { token: 'string', foreground: c.string },
                { token: 'number', foreground: c.number }
            ];
        }

        function fcodeSqlColors(isDark) {
            var c = isDark ? FCODE_SQL_COLORS.dark : FCODE_SQL_COLORS.light;
            return {
                'editor.background': c.bg, 'editor.foreground': '#' + c.fg,
                'editorGutter.background': c.gutter, 'editorLineNumber.foreground': c.lineNo, 'editorLineNumber.activeForeground': c.lineNo,
                'editor.lineHighlightBackground': c.curLine, 'editor.lineHighlightBorder': c.curLine,
                'editor.selectionBackground': c.selection, 'editor.inactiveSelectionBackground': c.selection,
                'editorBracketMatch.border': c.brace, 'editorCursor.foreground': c.caret,
                'editor.wordHighlightBackground': c.wordHl, 'editor.wordHighlightStrongBackground': c.wordHl,
                'editor.selectionHighlightBackground': c.wordHl, 'editorWhitespace.foreground': c.space
            };
        }

        function fcodeSqlLanguage() {
            var list = function (s) { return s.split(' '); };
            return {
                defaultToken: '',
                // Hậu tố riêng: với '.sql' các rule có sẵn của vs/vs-dark (string.sql = #FF0000, keyword.sql...) cụ thể hơn và đè lên màu FCode.
                tokenPostfix: '.fcsql',
                ignoreCase: true,
                kw0: list(FCODE_SQL_WORDS.kw0),
                kw1: list(FCODE_SQL_WORDS.kw1),
                fn: list(FCODE_SQL_WORDS.fn),
                sp: list(FCODE_SQL_WORDS.sp),
                tokenizer: {
                    root: [
                        [/--.*$/, 'comment'],
                        [/\/\*/, 'comment', '@comment'],
                        [/N?'/, 'string', '@string'],
                        // Monarch hiểu '@@' trong regex là 1 ký tự '@' (escape) → viết [@] để @biến không bị nhận thành @@biến hệ thống.
                        [/[@][@][\w$]+/, 'fc-sysvar'],
                        [/[@][\w$@]+/, 'fc-var'],
                        [/##?[\w$]+/, 'fc-temp'],
                        [/(?:FastBusiness|fs20_|fs_)[\w$]*/, 'fc-obj'],
                        [/dbo\.[\w$]+/, 'fc-obj'],
                        [/\[[^\]\r\n]*\]/, 'identifier'],
                        [/"[^"\r\n]*"/, 'identifier'],
                        [/[a-zA-Z_][\w$]*/, {
                            cases: { '~go': 'fc-go', '@kw0': 'fc-kw0', '@kw1': 'fc-kw1', '@fn': 'fc-fn', '@sp': 'fc-sp', '@default': 'identifier' }
                        }],
                        [/0x[0-9a-fA-F]*/, 'number'],
                        [/\d*\.\d+(?:[eE][\-+]?\d+)?/, 'number'],
                        [/\d+/, 'number'],
                        [/\s+/, ''],
                        [/[;,.()\[\]=<>!+\-*\/%&|^~]/, 'fc-op']
                    ],
                    comment: [
                        [/[^*\/]+/, 'comment'],
                        [/\*\//, 'comment', '@pop'],
                        [/[*\/]/, 'comment']
                    ],
                    string: [
                        [/[^']+/, 'string'],
                        [/''/, 'string'],
                        [/'/, 'string', '@pop']
                    ]
                }
            };
        }

        // Double-click / Ctrl+D / highlight từ: coi @, #, $ là một phần của tên (@ma_kh, #tmp, ##tmp, m81$000000, @@rowcount)
        // thay vì là dấu ngăn từ như mặc định của Monaco.
        // Cỡ chữ mặc định như FCode: Consolas 11px (đo từ FCode: ký tự rộng ~6px, dòng cao 15px = line-height tự động của Monaco).
        var FCODE_FONT_SIZE = 11;

        var FCODE_WORD_SEPARATORS = '`~!%^&*()-=+[{]}\\|;:\'",.<>/?';
        var FCODE_WORD_PATTERN = /(-?\d*\.\d\w*)|([^\`\~\!\%\^\&\*\(\)\-\=\+\[\{\]\}\\\|\;\:\'\"\,\.\<\>\/\?\s]+)/g;

        function installFcodeSql() {
            monaco.languages.setMonarchTokensProvider('sql', fcodeSqlLanguage());
            monaco.languages.setLanguageConfiguration('sql', {
                wordPattern: FCODE_WORD_PATTERN,
                comments: { lineComment: '--', blockComment: ['/*', '*/'] },
                brackets: [['{', '}'], ['[', ']'], ['(', ')']],
                autoClosingPairs: [{ open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' }, { open: '"', close: '"' }, { open: "'", close: "'" }],
                surroundingPairs: [{ open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' }, { open: '"', close: '"' }, { open: "'", close: "'" }]
            });
        }

        // GO (dòng chỉ có chữ GO) — FCode tô chữ trắng nền đỏ; màu nền không đặt được bằng token nên dùng decoration.
        var _goDecorations = null;
        var _goTimer = null;
        function updateGoDecorations() {
            if (!editor) return;
            var model = editor.getModel();
            if (!model) return;
            var decos = [];
            var count = model.getLineCount();
            for (var ln = 1; ln <= count; ln++) {
                var m = /^(\s*)(go)\s*$/i.exec(model.getLineContent(ln));
                if (!m) continue;
                var start = m[1].length + 1;
                decos.push({ range: new monaco.Range(ln, start, ln, start + 2), options: { inlineClassName: 'bcodeGo' } });
            }
            if (_goDecorations) _goDecorations.set(decos);
            else _goDecorations = editor.createDecorationsCollection(decos);
        }
        function scheduleGoDecorations() {
            clearTimeout(_goTimer);
            _goTimer = setTimeout(updateGoDecorations, 200);
        }

        require.config({ paths: { 'vs': 'viewer/vs' } });

        require(['vs/editor/editor.main'], function () {
            monaco.editor.defineTheme('fcode-sql', { base: 'vs-dark', inherit: true, rules: fcodeSqlRules(true), colors: fcodeSqlColors(true) });
            // Chờ bộ 'sql' có sẵn của Monaco nạp xong rồi mới đè, để nó không nạp sau và ghi đè ngược lại.
            monaco.editor.colorize('', 'sql', {}).then(installFcodeSql, installFcodeSql);

            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '',
                language: 'sql',
                theme: 'fcode-sql',
                wordSeparators: FCODE_WORD_SEPARATORS,
                guides: { indentation: false }, // FCode không vẽ đường gióng thụt lề
                bracketPairColorization: { enabled: false }, // FCode để ngoặc cùng màu toán tử, không tô vàng/tím theo cấp
                renderWhitespace: 'boundary', // nhưng có vẽ dấu khoảng trắng/tab ở đầu dòng (Space position="first")
                automaticLayout: true,
                fontSize: FCODE_FONT_SIZE,
                fontFamily: 'Consolas, "Courier New", monospace',
                minimap: { enabled: false },
                wordWrap: 'off',
                scrollBeyondLastLine: false,
                lineNumbers: 'on',
                renderLineHighlight: 'all',
                glyphMargin: true, // chấm cảnh báo sai dấu ở lề trái — xem lintSqlPunctuation()
                contextmenu: false,
                suggestOnTriggerCharacters: true,
                quickSuggestions: { other: true, comments: false, strings: false },
                inlineSuggest: { enabled: true } // Bật Ghost Text Copilot
            });

            // Gợi ý code (mẫu gõ tắt, tên procedure/function + tham số, cột sau alias, options, cảnh báo biến chưa khai báo) — xem sqlhints.js
            if (window.BcodeHints) {
                BcodeHints.install(monaco, editor, function (msg) { window.chrome.webview.postMessage(JSON.stringify(msg)); });
                window.setHintCatalog = function (cat, user) { BcodeHints.setCatalog(cat); BcodeHints.user = user || []; };
                window.setHintRoutines = function (p) { BcodeHints.setRoutines(p); if (BcodeHints.lintNow) BcodeHints.lintNow(); };
            }

            // 1. TÌM CÁC BẢNG ĐÃ CÓ TRONG QUERY ĐỂ SUY RA BẢNG LIÊN QUAN
            function getExistingTablesInQuery(fullText) {
                var regex = /\b(?:FROM|JOIN|INTO|UPDATE)\s+([a-zA-Z0-9_#$]+)/gi;
                var found = [];
                var m;
                while ((m = regex.exec(fullText)) !== null) {
                    found.push(m[1].toLowerCase());
                }
                return found;
            }

            // 2. GỢI Ý DANH SÁCH BẢNG & BẢNG LIÊN QUAN (INTELLISENSE DROPDOWN)
            monaco.languages.registerCompletionItemProvider('sql', {
                triggerCharacters: [' ', '.', '[', ',', '\n'],
                provideCompletionItems: function (model, position) {
                    if (!_dbTables || _dbTables.length === 0) return { suggestions: [] };

                    var lineContent = model.getLineContent(position.lineNumber);
                    var textBefore = lineContent.substring(0, position.column - 1);

                    var isTableContext = /\b(FROM|JOIN|INTO|UPDATE|TABLE)\s+([a-zA-Z0-9_#$]*)$/i.test(textBefore) ||
                                         /\bFROM\s+[^;]+,\s*([a-zA-Z0-9_#$]*)$/i.test(textBefore) ||
                                         /\b(dbo\.)([a-zA-Z0-9_#$]*)$/i.test(textBefore);

                    if (!isTableContext) {
                        return { suggestions: [] };
                    }

                    var word = model.getWordUntilPosition(position);
                    var range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: word.startColumn,
                        endColumn: word.endColumn
                    };

                    var fullSql = model.getValue();
                    var existingTables = getExistingTablesInQuery(fullSql);
                    var commonCatalogs = ['dmkh', 'dmvt', 'dmkho', 'dmnv', 'dmtk', 'dmnt', 'dmbp', 'dmplvt'];

                    var suggestions = _dbTables.map(function (item) {
                        var tableName = item.name;
                        var lowerName = tableName.toLowerCase();
                        var isRelated = false;
                        var relationNote = "";

                        for (var i = 0; i < existingTables.length; i++) {
                            var ex = existingTables[i];
                            if (ex === lowerName) continue;

                            var exDigits = ex.replace(/[^0-9]/g, '');
                            var curDigits = lowerName.replace(/[^0-9]/g, '');

                            if (exDigits.length >= 2 && exDigits === curDigits) {
                                isRelated = true;
                                relationNote = "⭐ Chi tiết / Cùng bộ chứng từ (" + ex + ")";
                                break;
                            }

                            if ((ex.startsWith('ph') && lowerName.startsWith('ct') && ex.slice(2) === lowerName.slice(2)) ||
                                (ex.startsWith('h') && lowerName.startsWith('d') && ex.slice(1) === lowerName.slice(1)) ||
                                (ex.startsWith('m') && lowerName.startsWith('d') && ex.slice(1) === lowerName.slice(1))) {
                                isRelated = true;
                                relationNote = "⭐ Bảng chi tiết của " + ex;
                                break;
                            }
                        }

                        if (!isRelated && /\bJOIN\s+/i.test(textBefore) && commonCatalogs.indexOf(lowerName) >= 0) {
                            isRelated = true;
                            relationNote = "⭐ Danh mục hay dùng";
                        }

                        var sortPrefix = isRelated ? "0_" : "1_";
                        var displayDetail = isRelated ? relationNote : (item.kind === 'View' ? '[View]' : '[Table]');

                        return {
                            label: tableName,
                            kind: item.kind === 'View' ? monaco.languages.CompletionItemKind.Interface : monaco.languages.CompletionItemKind.Class,
                            detail: displayDetail,
                            insertText: tableName,
                            sortText: sortPrefix + tableName,
                            range: range
                        };
                    });

                    return { suggestions: suggestions };
                }
            });

            // 3. GỢI Ý COPILOT GHOST TEXT (FILL-IN-THE-MIDDLE CHO PROCEDURE / FUNCTION)
            monaco.languages.registerInlineCompletionsProvider('sql', {
                provideInlineCompletions: function (model, position, context, token) {
                    // Nếu vừa có gợi ý đến trễ và đúng vị trí con trỏ hiện tại thì dùng luôn, khỏi gọi AI lại
                    if (_lateCopilotSuggestion &&
                        _lateCopilotSuggestion.position.lineNumber === position.lineNumber &&
                        _lateCopilotSuggestion.position.column === position.column &&
                        _lateCopilotSuggestion.modelVersion === model.getVersionId()) {
                        var cached = _lateCopilotSuggestion;
                        _lateCopilotSuggestion = null;
                        return Promise.resolve({
                            items: [{
                                insertText: cached.text,
                                range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column)
                            }]
                        });
                    }
                    return new Promise(function (resolve) {
                        if (!window.copilotEnabled || !window.chrome || !window.chrome.webview) {
                            return resolve({ items: [] });
                        }

                        // triggerKind 1 = Explicit: người dùng bấm Alt+\ gọi tay — luôn cho chạy, ở mọi loại SQL.
                        var explicit = !!context && context.triggerKind === 1;
                        if (!explicit && !window.copilotAuto) {
                            return resolve({ items: [] });
                        }

                        // Tự động (đang gõ) chỉ kích hoạt khi đang ở Procedure hoặc Function
                        var fullText = model.getValue();
                        var isProcOrFunc = /\b(CREATE|ALTER)\s+(?:OR\s+ALTER\s+)?(PROC|PROCEDURE|FUNCTION)\b/i.test(fullText);
                        
                        if (!explicit && !isProcOrFunc) {
                            return resolve({ items: [] });
                        }

                        if (_copilotDebounceTimer) {
                            clearTimeout(_copilotDebounceTimer);
                        }

                        var reqId = ++_copilotReqCounter;
                        _copilotResolvers[reqId] = {
                            resolve: resolve,
                            position: position
                        };

                        _copilotDebounceTimer = setTimeout(function () {
                            var totalLines = model.getLineCount();
                            var prefix = "";

                            // Trích xuất code TRƯỚC con trỏ (Giữ header chứa param/declare nếu file dài)
                            if (position.lineNumber > 80) {
                                var headerText = model.getValueInRange({
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: 40,
                                    endColumn: model.getLineMaxColumn(40)
                                });

                                var nearText = model.getValueInRange({
                                    startLineNumber: Math.max(41, position.lineNumber - 50),
                                    startColumn: 1,
                                    endLineNumber: position.lineNumber,
                                    endColumn: position.column
                                });

                                prefix = headerText + "\n\n-- ... [code omitted] ...\n\n" + nearText;
                            } else {
                                prefix = model.getValueInRange({
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: position.lineNumber,
                                    endColumn: position.column
                                });
                            }

                            // Trích xuất 40 dòng code SAU con trỏ để AI biết phía dưới đã có gì
                            var endLine = Math.min(totalLines, position.lineNumber + 40);
                            var suffix = model.getValueInRange({
                                startLineNumber: position.lineNumber,
                                startColumn: position.column,
                                endLineNumber: endLine,
                                endColumn: model.getLineMaxColumn(endLine)
                            });

                            if (!prefix || prefix.trim().length === 0) {
                                return resolve({ items: [] });
                            }

                            // Gửi cả prefix và suffix sang C#
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'copilot-suggest',
                                requestId: reqId,
                                prefix: prefix,
                                suffix: suffix
                            }));
                        }, explicit ? 0 : 600);

                        token.onCancellationRequested(function () {
                            if (_copilotDebounceTimer) clearTimeout(_copilotDebounceTimer);
                            if (_copilotResolvers[reqId]) {
                                delete _copilotResolvers[reqId];
                                resolve({ items: [] });
                            }
                        });

                        setTimeout(function () {
                            if (_copilotResolvers[reqId]) {
                                delete _copilotResolvers[reqId];
                                resolve({ items: [] });
                            }
                        }, 10000);
                    });
                },
                freeInlineCompletions: function (completions) {}
            });

            // ---- Phím tắt của editor: theo bảng phím trong Template giao diện (Bcode.App.UI.ShortcutRegistry) ----
            // C# đẩy bản đồ id → tổ hợp vào window.__bcodeEditorKeys (rỗng = tắt phím); chưa có thì dùng mặc định bên dưới. Bắt ở editor.onKeyDown
            // (trước khi Monaco xử lý phím) nên phím tuỳ chỉnh đè được cả phím có sẵn của Monaco như Ctrl+Enter, F7, Ctrl+I.
            function dbgPost(a, extra) { window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action: a }, extra || {}))); }
            var KEY_DEFAULTS = { 'editor.run': 'F5', 'editor.run2': 'Ctrl+Enter', 'editor.beauty': 'F7', 'editor.wrap': 'Alt+Z', 'editor.ai': 'Ctrl+I',
                'editor.suggest': 'Alt+\\', 'debug.next': 'F10', 'debug.cursor': 'Ctrl+F10', 'debug.stop': 'Shift+F5' };
            var KEY_ACTIONS = {
                'editor.run': function () { dbgPost('run'); },       // đang debug thì C# hiểu là Continue
                'editor.run2': function () { dbgPost('run'); },
                'editor.beauty': function () { dbgPost('beauty'); },
                'editor.wrap': function () { dbgPost('toggle-wrap-key'); },
                'editor.ai': function () { window.showAiEdit(); },
                'editor.suggest': function () { editor.trigger('keyboard', 'editor.action.inlineSuggest.trigger', {}); },
                'editor.saveHistory': function () { dbgPost('bar-action', { name: 'save-history' }); },
                'editor.open': function () { dbgPost('bar-action', { name: 'open' }); },
                'editor.save': function () { dbgPost('bar-action', { name: 'save' }); },
                'editor.writeSchema': function () { dbgPost('bar-action', { name: 'write-schema' }); },
                'editor.checkFields': function () { dbgPost('bar-action', { name: 'check-fields' }); },
                'editor.comment': function () { dbgPost('bar-action', { name: 'comment' }); },
                'editor.uncomment': function () { dbgPost('bar-action', { name: 'uncomment' }); },
                'editor.fontUp': function () { dbgPost('bar-action', { name: 'font-up' }); },
                'editor.fontDown': function () { dbgPost('bar-action', { name: 'font-down' }); },
                'editor.options': function () { dbgPost('bar-action', { name: 'options' }); },
                'editor.dbApp': function () { dbgPost('bar-action', { name: 'db-app' }); },
                'editor.dbSys': function () { dbgPost('bar-action', { name: 'db-sys' }); },
                'editor.toggleSuggest': function () { dbgPost('bar-action', { name: 'suggest' }); },
                'editor.toggleResetConn': function () { dbgPost('bar-action', { name: 'reset-conn' }); },
                'editor.toggleResultTab': function () { dbgPost('bar-action', { name: 'result-tab' }); },
                'editor.debugTarget': function () { dbgPost('bar-action', { name: 'debug-target' }); },
                'editor.debugStep': function () { dbgPost('bar-action', { name: 'debug-step' }); },
                'debug.next': function () { dbgPost('debug-next'); },
                'debug.cursor': function () { dbgPost('debug-to-cursor', { line: editor.getPosition().lineNumber }); },
                'debug.stop': function () { dbgPost('debug-stop'); }
            };
            var _keyLookup = {};
            window.applyKeymap = function () {
                var m = window.__bcodeEditorKeys || {};
                _keyLookup = {};
                Object.keys(KEY_ACTIONS).forEach(function (id) {
                    var combo = Object.prototype.hasOwnProperty.call(m, id) ? m[id] : KEY_DEFAULTS[id];
                    if (combo) _keyLookup[combo] = id;
                });
            };
            window.applyKeymap();
            editor.onKeyDown(function (e) {
                var c = window.__bcodeCombo ? window.__bcodeCombo(e.browserEvent) : null;
                var id = c ? _keyLookup[c] : null;
                if (id) { e.preventDefault(); e.stopPropagation(); KEY_ACTIONS[id](); }
            });
            document.getElementById('dbgNext').onclick = function () { dbgPost('debug-next'); editor.focus(); };
            document.getElementById('dbgCont').onclick = function () { dbgPost('debug-continue'); editor.focus(); };
            document.getElementById('dbgCursor').onclick = function () { dbgPost('debug-to-cursor', { line: editor.getPosition().lineNumber }); editor.focus(); };
            document.getElementById('dbgStop').onclick = function () { dbgPost('debug-stop'); editor.focus(); };

            // Breakpoint: bấm vào lề (glyph margin) để đặt/bỏ chấm đỏ; danh sách dòng gửi cho C#.
            var _bpLines = [];
            var _bpDecos = [];
            function renderBreakpoints() {
                _bpDecos = editor.deltaDecorations(_bpDecos, _bpLines.map(function (l) {
                    return { range: new monaco.Range(l, 1, l, 1), options: { glyphMarginClassName: 'bcodeBp', glyphMarginHoverMessage: { value: 'Breakpoint — dừng ngay trước dòng này' } } };
                }));
                dbgPost('debug-breakpoints', { lines: _bpLines });
            }
            editor.onMouseDown(function (e) {
                if (e.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN && e.target.position) {
                    var l = e.target.position.lineNumber, i = _bpLines.indexOf(l);
                    if (i >= 0) _bpLines.splice(i, 1); else _bpLines.push(l);
                    renderBreakpoints();
                }
            });
            // Breakpoint bám theo dòng khi sửa text: lấy lại số dòng từ decoration sau mỗi thay đổi.
            editor.onDidChangeModelContent(function () {
                if (!_bpLines.length) return;
                var m = editor.getModel();
                var now = _bpDecos.map(function (id) { var r = m.getDecorationRange(id); return r ? r.startLineNumber : 0; }).filter(function (x) { return x > 0; });
                now = now.filter(function (x, i) { return now.indexOf(x) === i; });
                if (now.join(',') !== _bpLines.join(',')) { _bpLines = now; dbgPost('debug-breakpoints', { lines: _bpLines }); }
            });

            // C# báo trạng thái phiên debug: dòng sắp chạy (next), đã chạy tới (executed), còn bao nhiêu điểm dừng.
            var _dbgDecos = [];
            window.setDebugState = function (st) {
                var bar = document.getElementById('dbgBar');
                if (!st || !st.active) {
                    _dbgDecos = editor.deltaDecorations(_dbgDecos, []);
                    bar.style.display = 'none';
                    return;
                }
                bar.style.display = 'flex';
                document.getElementById('dbgInfo').textContent = st.next
                    ? 'Sắp chạy dòng ' + st.next + ' · còn ' + st.remaining + ' điểm dừng'
                    : 'Đã chạy hết script';
                document.getElementById('dbgNext').disabled = !st.next;
                document.getElementById('dbgCont').disabled = !st.next;
                document.getElementById('dbgCursor').disabled = !st.next;
                var decos = [];
                if (st.next) {
                    decos.push({ range: new monaco.Range(st.next, 1, st.next, 1), options: { isWholeLine: true, className: 'bcodeDbgLine', glyphMarginClassName: 'bcodeDbgArrow' } });
                    editor.revealLineInCenterIfOutsideViewport(st.next);
                }
                _dbgDecos = editor.deltaDecorations(_dbgDecos, decos);
            };

            // Ctrl+D — nhân đôi dòng hiện tại, hoặc (đang bôi đen) chép đoạn text đó ngay sau nó và bôi đen bản mới (giống BcodeViewer).
            // Ctrl+D mặc định của Monaco (thêm con trỏ ở kết quả giống tiếp theo) chuyển sang Ctrl+Shift+D.
            editor.addAction({
                id: 'bcode.duplicateLine',
                label: 'Nhân đôi dòng',
                keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyD],
                run: function (ed) {
                    var model = ed.getModel();
                    var selections = ed.getSelections() || [];
                    if (!model || !selections.some(function (s) { return !s.isEmpty(); })) {
                        var a = ed.getAction('editor.action.copyLinesDownAction');
                        if (a) a.run();
                        return;
                    }
                    var edits = [];
                    selections.forEach(function (s) {
                        if (s.isEmpty()) return;
                        edits.push({
                            range: new monaco.Range(s.endLineNumber, s.endColumn, s.endLineNumber, s.endColumn),
                            text: model.getValueInRange(s), forceMoveMarkers: true
                        });
                    });
                    ed.pushUndoStop();
                    ed.executeEdits('bcode.duplicateSelection', edits, function (inverse) {
                        var byPos = function (a, b) { return a.startLineNumber - b.startLineNumber || a.startColumn - b.startColumn; };
                        return inverse.map(function (x) { return x.range; }).sort(byPos).map(function (r) {
                            return new monaco.Selection(r.startLineNumber, r.startColumn, r.endLineNumber, r.endColumn);
                        });
                    });
                    ed.pushUndoStop();
                }
            });
            editor.addAction({
                id: 'bcode.addSelectionToNextMatch',
                label: 'Thêm con trỏ ở kết quả giống tiếp theo',
                keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyD],
                run: function (ed) { var a = ed.getAction('editor.action.addSelectionToNextFindMatch'); if (a) a.run(); }
            });

            // 4. Bắt tổ hợp phím Ctrl + Shift để chuyển tiếp về MainForm
            editor.onKeyDown(function (e) {
                if (e.ctrlKey && e.shiftKey) {
                    var keyMap = {};
                    keyMap[monaco.KeyCode.KeyQ] = 'Q';
                    keyMap[monaco.KeyCode.KeyL] = 'L';
                    keyMap[monaco.KeyCode.KeyT] = 'T';
                    keyMap[monaco.KeyCode.KeyC] = 'C';
                    keyMap[monaco.KeyCode.KeyW] = 'W';
                    keyMap[monaco.KeyCode.KeyF] = 'F';
                    keyMap[monaco.KeyCode.KeyR] = 'R';
                    keyMap[monaco.KeyCode.KeyO] = 'O';
                    keyMap[monaco.KeyCode.KeyU] = 'U';
                    keyMap[monaco.KeyCode.KeyG] = 'G';
                    keyMap[monaco.KeyCode.KeyE] = 'E';
                    keyMap[monaco.KeyCode.Digit4] = 'D4';

                    var mapped = keyMap[e.keyCode];
                    if (mapped) {
                        e.preventDefault();
                        e.stopPropagation();

                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'global-key',
                                key: mapped
                            }));
                        }
                    }
                }
            });

            // 5. Bắt chuột trái để tắt menu chuột phải, hoặc Ctrl + chuột phải để mở procedure
            editor.onMouseDown(function (e) {
                if (e.event.leftButton) {
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(JSON.stringify({
                            action: 'close-context-menu'
                        }));
                    }
                }

                if (e.event.rightButton && e.event.ctrlKey) {
                    var position = e.target.position;
                    if (position) {
                        // Lấy CẢ tên đầy đủ đang trỏ (dbo.FastBusiness$Function$CheckSQLInjection), không chỉ "từ" của Monaco:
                        // Monaco coi '$' và '.' là dấu ngăn từ nên chỉ trả "CheckSQLInjection" → không tìm thấy object nào.
                        var line = editor.getModel().getLineContent(position.lineNumber);
                        var isId = function (c) { return /[A-Za-z0-9_$#.@\[\]]/.test(c); };
                        var from = position.column - 1, to = position.column - 1;
                        while (from > 0 && isId(line.charAt(from - 1))) from--;
                        while (to < line.length && isId(line.charAt(to))) to++;
                        var ident = line.substring(from, to).replace(/^@+/, '').replace(/^\.+|\.+$/g, '');
                        if (ident) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                action: 'open-proc',
                                word: ident
                            }));
                        }
                    }
                }
            });

            // 6. Bắt sự kiện chuột phải trực tiếp trên Monaco Editor gửi về C#
            editor.onContextMenu(function (e) {
                if (e.event.ctrlKey) return;

                e.event.preventDefault();
                e.event.stopPropagation();

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({
                        action: 'show-context-menu',
                        x: Math.round(e.event.posx || e.event.browserEvent.clientX),
                        y: Math.round(e.event.posy || e.event.browserEvent.clientY)
                    }));
                }
            });

            // 7. Cảnh báo sai dấu (', (), [], dư dấu phẩy) — quét lại mỗi khi nội dung
            // đổi (gõ tay, setEditorText từ C#, F7 làm đẹp SQL... đều đi qua sự kiện
            // này), có debounce để khỏi quét lại từng ký tự một lúc gõ nhanh.
            editor.onDidChangeModelContent(scheduleSqlLint);
            scheduleSqlLint();
            editor.onDidChangeModelContent(scheduleGoDecorations);
            updateGoDecorations();

            isReady = true;
            window.chrome.webview.postMessage(JSON.stringify({ action: 'editor-ready' }));
        });

        // ---- Kéo file .sql (hoặc file chữ bất kỳ) từ Explorer thả vào editor ----
        // Mặc định WebView2 coi cú thả là "mở file này như 1 trang" nên hiện nội dung dạng HTML/chữ trắng thay vì đưa vào editor.
        // Chặn hành vi đó, đọc file bằng FileReader rồi chèn vào editor.
        function decodeSqlFile(buffer) {
            var u8 = new Uint8Array(buffer);
            // File .sql lưu từ SSMS thường là UTF-16 LE có BOM; Notepad/VS Code thường UTF-8; máy cũ có thể là ANSI tiếng Việt.
            if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
            if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
            if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
            try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); }
            catch (e) { return new TextDecoder('windows-1258').decode(u8); } // không phải UTF-8 hợp lệ → ANSI tiếng Việt
        }

        function readDroppedFile(file) {
            return new Promise(function (resolve) {
                var reader = new FileReader();
                reader.onload = function () { resolve({ name: file.name, text: decodeSqlFile(reader.result) }); };
                reader.onerror = function () { resolve({ name: file.name, text: null }); };
                reader.readAsArrayBuffer(file);
            });
        }

        window.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        }, true);

        window.addEventListener('drop', async function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!editor || !e.dataTransfer) return;

            var files = Array.prototype.slice.call(e.dataTransfer.files || []);
            if (files.length === 0) return; // thả chữ thường (không phải file): Monaco tự xử lý ở lần sau — ở đây đã chặn nên bỏ qua
            if (files.some(function (f) { return f.size >= 50 * 1024 * 1024; })) {
                alert('File quá lớn (từ 50 MB trở lên) — không đưa vào editor.');
                return;
            }

            var loaded = await Promise.all(files.map(readDroppedFile));
            var texts = loaded.filter(function (x) { return x.text !== null; }).map(function (x) { return x.text; });
            if (texts.length === 0) return;
            var content = texts.join('\r\n\r\n');

            var model = editor.getModel();
            if (model.getValue().trim().length === 0) {
                editor.setValue(content);               // editor đang trống → thay luôn (như mở file)
            } else {
                // Đã có nội dung → chèn tại con trỏ, không ghi đè.
                editor.executeEdits('drop-file', [{ range: editor.getSelection(), text: content, forceMoveMarkers: true }]);
            }
            editor.focus();
        }, true);

        window.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        }, true);

        // --- CÁC HÀM GỌI TỪ C# ---
        window.setCopilotSuggestion = function (reqId, suggestionText) {
            var entry = _copilotResolvers[reqId];
            if (entry) {
                if (suggestionText && suggestionText.length > 0) {
                    entry.resolve({
                        items: [{
                            insertText: suggestionText,
                            range: new monaco.Range(
                                entry.position.lineNumber,
                                entry.position.column,
                                entry.position.lineNumber,
                                entry.position.column
                            )
                        }]
                    });
                } else {
                    entry.resolve({ items: [] });
                }
                delete _copilotResolvers[reqId];
            } else if (suggestionText && suggestionText.length > 0 && editor) {
                // Trả lời trễ, request cũ đã hết hạn -> lưu lại và ép Monaco hỏi lại ngay
                var pos = editor.getPosition();
                _lateCopilotSuggestion = {
                    text: suggestionText,
                    position: pos,
                    modelVersion: editor.getModel().getVersionId()
                };
                editor.trigger('copilot', 'editor.action.inlineSuggest.trigger');
            }
        };

        window.setCopilotAuto = function (on) {
            window.copilotAuto = !!on;
        };

        // ---- Ctrl+I: hộp AI sửa/sinh SQL ----
        var _aiEditId = 0, _aiEditDone = null;
        window.showAiEdit = function () {
            if (!editor || document.getElementById('aiEditOverlay')) return;
            var sel = editor.getSelection();
            var selected = editor.getModel().getValueInRange(sel);
            var dark = !document.documentElement.classList.contains('light');
            var c = dark
                ? { bg: '#252526', fg: '#dcdcdc', mut: '#969696', inp: '#1e1e1e', bd: '#3f3f46', ac: '#f5a623', on: '#1c1608', btn: '#3e3e42' }
                : { bg: '#ffffff', fg: '#202020', mut: '#6e6e6e', inp: '#f5f5f6', bd: '#d2d5d9', ac: '#c47300', on: '#ffffff', btn: '#e1e3e6' };

            var ov = document.createElement('div');
            ov.id = 'aiEditOverlay';
            ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50000;display:flex;align-items:center;justify-content:center;padding:12px;font:13px "Segoe UI",sans-serif';
            var box = document.createElement('div');
            box.style.cssText = 'background:' + c.bg + ';color:' + c.fg + ';border:1px solid ' + c.bd + ';border-radius:8px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5)';
            function el(tag, css, text) { var e = document.createElement(tag); e.style.cssText = css || ''; if (text) e.textContent = text; return e; }
            var head = el('div', 'background:' + c.ac + ';color:' + c.on + ';padding:9px 14px;font-weight:600',
                selected ? 'AI: Sửa SQL (đang chọn đoạn)' : 'AI: Sinh SQL tại con trỏ');
            var body = el('div', 'padding:12px;display:flex;flex-direction:column;gap:6px;overflow:auto');
            var ta = 'width:100%;box-sizing:border-box;background:' + c.inp + ';color:' + c.fg + ';border:1px solid ' + c.bd + ';border-radius:4px;padding:6px;font:13px Consolas,monospace;resize:vertical';
            var l1 = el('div', 'color:' + c.mut, 'Yêu cầu (Ctrl+Enter để gửi) — AI biết cấu trúc các bảng đang dùng trong script');
            var ins = el('textarea', ta); ins.rows = 3;
            ins.placeholder = selected ? 'Ví dụ: thêm điều kiện ma_dvcs, đổi sang LEFT JOIN dmkh...' : 'Ví dụ: truy vấn tổng tiền theo khách hàng trong tháng...';
            var l2 = el('div', 'color:' + c.mut, 'Đề xuất từ AI');
            var out = el('textarea', ta); out.rows = 10; out.readOnly = true;
            var status = el('div', 'color:' + c.mut + ';font-size:12px;min-height:16px');
            var row = el('div', 'display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px');
            function btn(text, primary) {
                return el('button', 'border:1px solid ' + (primary ? c.ac : c.bd) + ';background:' + (primary ? c.ac : c.btn) + ';color:' + (primary ? c.on : c.fg) + ';border-radius:4px;padding:5px 14px;cursor:pointer;font:inherit', text);
            }
            var bGen = btn('Generate', true), bIns = btn('Insert'), bClose = btn('Close');
            bIns.disabled = true;
            function close() { ov.remove(); _aiEditDone = null; editor.focus(); }
            bClose.onclick = close;

            function generate() {
                var instruction = ins.value.trim();
                if (!instruction) return;
                bGen.disabled = true; bIns.disabled = true;
                out.value = ''; status.textContent = 'Đang hỏi Claude...';
                var id = ++_aiEditId;
                _aiEditDone = function (reqId, text, error) {
                    if (reqId !== id) return;
                    bGen.disabled = false;
                    if (error) { status.textContent = error; return; }
                    out.value = text; status.textContent = 'Xong — xem lại rồi bấm Insert.'; bIns.disabled = !text;
                };
                window.chrome.webview.postMessage(JSON.stringify({
                    action: 'ai-edit', requestId: id, instruction: instruction, selection: selected, script: editor.getValue()
                }));
            }
            bGen.onclick = generate;
            ins.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); generate(); } });
            ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); close(); } });
            bIns.onclick = function () {
                // Có chọn đoạn → thay đoạn đó; không chọn → chèn tại con trỏ.
                editor.executeEdits('ai-edit', [{ range: sel, text: out.value, forceMoveMarkers: true }]);
                close();
            };

            row.append(bGen, bIns, bClose);
            body.append(l1, ins, l2, out, status, row);
            box.append(head, body);
            ov.appendChild(box);
            document.body.appendChild(ov);
            ins.focus();
        };
        window.setAiEditResult = function (reqId, text, error) { if (_aiEditDone) _aiEditDone(reqId, text, error); };

        window.setCopilotEnabled = function (enabled) {
            window.copilotEnabled = !!enabled;
        };

        window.getEditorText = function () {
            return editor ? editor.getValue() : "";
        };

        window.getSelectedText = function () {
            if (!editor) return "";
            var sel = editor.getSelection();
            return editor.getModel().getValueInRange(sel);
        };

        window.setEditorText = function (text) {
            if (editor) editor.setValue(text);
        };

        // Ctrl + chuột phải vào tên procedure/function: chèn định nghĩa của nó lên ĐẦU script đang gõ (kèm GO) rồi nhảy lên đó,
        // ngay trong tab này (như FCode) — trước đây mở ra 1 tab mới. Định nghĩa đã có sẵn trong script (Ctrl+click lần 2)
        // thì không chèn lặp, chỉ nhảy tới chỗ nó. Chèn bằng executeEdits nên Ctrl+Z gỡ ra được.
        window.prependDefinition = function (definition) {
            if (!editor || !definition) return;
            var model = editor.getModel();
            var def = definition.replace(/\r/g, '').replace(/\s+$/, '');
            var text = model.getValue().replace(/\r/g, '');
            var at = text.indexOf(def);
            var line = 1;
            if (at >= 0) {
                line = text.substring(0, at).split('\n').length;
            } else {
                var eol = model.getEOL();
                editor.executeEdits('bcode-proc', [{
                    range: new monaco.Range(1, 1, 1, 1),
                    text: def.replace(/\n/g, eol) + eol + 'GO' + eol,
                    forceMoveMarkers: true
                }]);
                editor.pushUndoStop();
            }
            editor.setPosition({ lineNumber: line, column: 1 });
            editor.revealLineNearTop(line);
            editor.focus();
        };

        window.replaceSelection = function (text) {
            if (!editor) return;
            var sel = editor.getSelection();
            editor.executeEdits('bcode', [{
                range: sel,
                text: text,
                forceMoveMarkers: true
            }]);
        };

        // Ctrl+R: ẩn/hiện khung kết quả của SQL Query (RawSqlControl.ToggleResultPanel); đồng thời chặn "tải lại trang" mặc định của WebView2.
        document.addEventListener('keydown', function (e) {
          if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey && (e.key === 'r' || e.key === 'R')) {
            e.preventDefault(); e.stopPropagation();
            window.chrome.webview.postMessage(JSON.stringify({ action: 'toggle-results' }));
          }
        }, true);

        // Bảng màu người dùng chọn (Bcode.App.UI.UiThemes) — null = dùng vs / vs-dark mặc định của Monaco.
        window.__palette = null;
        window.setPalette = function (p, isDark) { window.__palette = p; window.setTheme(isDark); };
        window.setTheme = function (isDark) {
            window.__edThemeReset = function () { window.setTheme(!document.documentElement.classList.contains('light')); };
            document.documentElement.classList.toggle('light', !isDark);
            var p = window.__palette;
            document.body.style.background = p ? p.panel : '';
            if (window.monaco) {
                if (p) {
                    monaco.editor.defineTheme('bcode-custom', {
                        base: isDark ? 'vs-dark' : 'vs', inherit: true, rules: fcodeSqlRules(isDark),
                        colors: {
                            'editor.background': p.panel, 'editor.foreground': p.text,
                            'editorLineNumber.foreground': p.textMuted, 'editorLineNumber.activeForeground': p.text,
                            'editor.selectionBackground': p.selection, 'editor.lineHighlightBackground': p.panelAlt,
                            'editorCursor.foreground': p.accent, 'editorGutter.background': p.panel,
                            'editorWidget.background': p.panelAlt, 'editorWidget.border': p.border,
                            'editorSuggestWidget.background': p.panelAlt, 'editorSuggestWidget.border': p.border,
                            'editorSuggestWidget.selectedBackground': p.selection, 'input.background': p.input,
                            'scrollbarSlider.background': p.border + '99'
                        }
                    });
                    monaco.editor.setTheme('bcode-custom');
                } else {
                    monaco.editor.defineTheme('fcode-sql', { base: isDark ? 'vs-dark' : 'vs', inherit: true, rules: fcodeSqlRules(isDark), colors: fcodeSqlColors(isDark) });
                    monaco.editor.setTheme('fcode-sql');
                }
                // Màu chữ/nền do khu vực "Vùng soạn thảo" khai báo thì chồng lên theme vừa đặt.
                var es = window.__edStyle;
                if (es && (es.color || es.background)) {
                    var cc = {};
                    if (es.background) { cc['editor.background'] = es.background; cc['editorGutter.background'] = es.background; }
                    if (es.color) cc['editor.foreground'] = es.color;
                    monaco.editor.defineTheme('bcode-area', { base: isDark ? 'vs-dark' : 'vs', inherit: true, rules: fcodeSqlRules(isDark), colors: Object.assign({}, p ? {
                        'editorLineNumber.foreground': p.textMuted, 'editor.selectionBackground': p.selection, 'editorCursor.foreground': p.accent
                    } : fcodeSqlColors(isDark), cc) });
                    monaco.editor.setTheme('bcode-area');
                }
            }
        };

        // Khu vực "Vùng soạn thảo SQL" của Template giao diện (Bcode.App.UI.UiTemplate.Areas["editor"]): font/cỡ/đậm/màu chữ/màu nền.
        // css = { fontFamily, fontSize('13px'), fontWeight, color, background } hoặc null (về mặc định).
        window.__edStyle = null;
        window.setEditorStyle = function (css) {
            window.__edStyle = css || null;
            if (!editor || !window.monaco) return;
            // Chưa từng đặt style khu vực và giờ cũng không có → không đụng gì (giữ cỡ chữ người dùng đã Tăng/Giảm bằng tay).
            if (!css && !window.__edStyleApplied) return;
            window.__edStyleApplied = !!css;
            var size = css && css.fontSize ? parseFloat(css.fontSize) : defaultFontSize();
            var family = css && css.fontFamily ? css.fontFamily : defaultFamily();
            editor.updateOptions({ fontFamily: family, fontSize: size > 0 ? size : defaultFontSize(), fontWeight: css && css.fontWeight ? css.fontWeight : 'normal' });
            if (window.__lineSpacing > 0) editor.updateOptions({ lineHeight: Math.round((size > 0 ? size : defaultFontSize()) * window.__lineSpacing) });
            if (css && (css.color || css.background)) {
                var colors = {};
                if (css.background) { colors['editor.background'] = css.background; colors['editorGutter.background'] = css.background; }
                if (css.color) colors['editor.foreground'] = css.color;
                var areaDark = !document.documentElement.classList.contains('light');
                monaco.editor.defineTheme('bcode-area', { base: areaDark ? 'vs-dark' : 'vs', inherit: true, rules: fcodeSqlRules(areaDark),
                    colors: Object.assign(window.__palette ? {} : fcodeSqlColors(areaDark), colors) });
                monaco.editor.setTheme('bcode-area');
            } else if (window.__edThemeReset) {
                window.__edThemeReset();
            }
        };

        // Tuỳ chọn editor từ Template giao diện: { lineSpacing (bội số cỡ chữ, 0 = tự động), minimap, lineNumbers, whitespace }.
        window.__lineSpacing = 0;
        function applyLineHeight() {
            if (!editor || !window.monaco) return;
            var size = editor.getOption(monaco.editor.EditorOption.fontSize);
            editor.updateOptions({ lineHeight: window.__lineSpacing > 0 ? Math.round(size * window.__lineSpacing) : 0 });
        }
        window.setEditorOptions = function (o) {
            if (!editor || !window.monaco || !o) return;
            window.__lineSpacing = o.lineSpacing || 0;
            editor.updateOptions({
                minimap: { enabled: !!o.minimap },
                lineNumbers: o.lineNumbers === false ? 'off' : 'on',
                renderWhitespace: o.whitespace ? 'all' : 'boundary'
            });
            applyLineHeight();
        };

        window.setWordWrap = function (wrap) {
            if (editor) {
                editor.updateOptions({ wordWrap: wrap ? 'on' : 'off' });
            }
        };

        // Cỡ chữ người dùng đã chọn (Ctrl+lăn chuột / Tăng-Giảm cỡ chữ / Ctrl+0), lưu ở settings.json (AppSettings.SqlEditorFontSize)
        // và được C# đẩy xuống qua setUserFontSize lúc mở tab. 0 = mặc định FCode. Cỡ chữ của Template giao diện (nếu có) vẫn ưu tiên hơn.
        window.__userFontSize = 0;
        // Cỡ mặc định theo "Font gốc / Cỡ (pt)" của Template giao diện: FCODE_FONT_SIZE nhân tỉ lệ cỡ gốc / 9,5pt (xem setEditorScale). Cỡ người dùng tự chỉnh (Ctrl+lăn) ưu tiên hơn.
        window.__edScale = 1;
        window.__edFamily = '';   // họ font gốc của Template (rỗng = mặc định Segoe UI → editor dùng Consolas)
        function defaultFamily() { return window.__edFamily ? '"' + window.__edFamily + '", Consolas, "Courier New", monospace' : 'Consolas, "Courier New", monospace'; }
        function defaultFontSize() { return window.__userFontSize > 0 ? window.__userFontSize : Math.round(FCODE_FONT_SIZE * window.__edScale * 10) / 10; }
        function applyFontSize(size) {
            editor.updateOptions({ fontSize: size });
            editor.updateOptions({ lineHeight: window.__lineSpacing > 0 ? Math.round(size * window.__lineSpacing) : 0 });
        }
        window.setUserFontSize = function (size) {
            window.__userFontSize = size > 0 ? size : 0;
            if (!editor || !window.monaco) return;
            var es = window.__edStyle;
            if (es && es.fontSize && parseFloat(es.fontSize) > 0) return; // Template đang quy định cỡ chữ
            applyFontSize(defaultFontSize());
        };
        window.setEditorScale = function (k, family) {
            window.__edScale = k > 0.4 && k < 4 ? k : 1;
            window.__edFamily = family || '';
            if (!editor || !window.monaco) return;
            var es = window.__edStyle;
            if (!(es && es.fontFamily)) editor.updateOptions({ fontFamily: defaultFamily() });   // họ font theo "Font gốc" của Template
            if (es && es.fontSize && parseFloat(es.fontSize) > 0) return; // vùng "Soạn thảo SQL" của Template đã quy định cỡ chữ riêng
            if (window.__userFontSize > 0) return;
            applyFontSize(defaultFontSize());
        };
        var _fontSaveTimer = null;
        function reportFontSize(size) {
            window.__userFontSize = size;
            clearTimeout(_fontSaveTimer);
            // Lăn chuột bắn ra cả chục sự kiện liền nhau — chỉ báo về C# (ghi settings.json) khi đã ngừng lăn.
            _fontSaveTimer = setTimeout(function () {
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage(JSON.stringify({ action: 'font-size', size: size }));
            }, 400);
        }

        window.setFontSize = function (delta) {
            if (editor) {
                var size = Math.max(8, editor.getOption(monaco.editor.EditorOption.fontSize) + delta);
                applyFontSize(size);
                reportFontSize(size);
            }
        };

        // Ctrl + lăn chuột = Tăng/Giảm cỡ chữ editor (như menu), thay cho zoom cả trang mặc định của WebView2
        // (zoom trang phóng to cả lề/scrollbar và làm chữ mờ). Ctrl+0 = về cỡ mặc định FCode.
        // Bắt ở pha capture trên window để chặn trước cả Monaco lẫn WebView2.
        window.addEventListener('wheel', function (e) {
            if (!e.ctrlKey || !editor) return;
            e.preventDefault();
            e.stopPropagation();
            if (e.deltaY !== 0) window.setFontSize(e.deltaY < 0 ? 1 : -1);
        }, { capture: true, passive: false });
        document.addEventListener('keydown', function (e) {
            if (!e.ctrlKey || e.shiftKey || e.altKey || !editor) return;
            if (e.key !== '0' && e.code !== 'Numpad0') return;
            e.preventDefault();
            e.stopPropagation();
            applyFontSize(FCODE_FONT_SIZE);
            reportFontSize(0);
        }, true);

        window.toggleComment = function (comment) {
            if (!editor) return;
            var actionId = comment === true ? 'editor.action.addCommentLine'
                : comment === false ? 'editor.action.removeCommentLine'
                : 'editor.action.commentLine';
            var action = editor.getAction(actionId);
            if (action) action.run();
        };
    </script>
</body>
</html>
