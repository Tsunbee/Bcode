<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  body {
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  /* Nội dung thật: tự XUỐNG DÒNG khi hẹp (trước đây cố định 1 hàng cao 46px nên các nút bên phải bị cắt mất). */
  #bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: calc(4px * var(--dens)) 8px;
    gap: calc(4px * var(--dens)) 6px;
    min-height: calc(38px * var(--dens));
  }
  .brand { font-weight: 700; color: var(--accent); padding: 0 10px 0 4px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  .ws-group { display: flex; align-items: center; gap: 6px; }
  #dbNameLabel { user-select: text; -webkit-user-select: text; cursor: text; }
  .group { flex-wrap: wrap; }
  /* Hẹp thì thu gọn (không ẩn): nút nhỏ lại, bỏ chữ phụ; phần còn lại tự xuống dòng. */
  /* Chuông Thông báo y/c FSG (cạnh Quick Access): số chưa xem nổi ở góc. */
  #btnNotify { position: relative; }
  #btnNotify .bell { font-size: 14px; line-height: 1; filter: grayscale(.2); }
  #btnNotify .ncnt { position: absolute; top: -4px; right: -5px; min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box; border-radius: 999px; background: #d9534f; color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; }
  #btnNotify .ncnt:empty { display: none; }
  @media (max-width: 900px) {
    .ws-group .muted { display: none; } /* chữ "WS:" */
    #scriptGroup button { padding: 4px 6px; font-size: 11px; }
    #wsSelect { max-width: 220px; }
  }
  @media (max-width: 600px) {
    .brand { display: none; }
    #btnQuickAccess { font-size: 0; padding: 6px; } /* Chỉ hiện icon ngôi sao */
    #btnQuickAccess .icon { margin: 0; }
  }
</style>
</head>
<body data-area="top">
<div id="bar">
  <div class="brand">Bcode</div>
  <button class="btn btn-icon" id="btnSettings" title="Settings (File / Actions)"><span class="icon icon-gear"></span></button>
  <button class="btn" id="btnActions" title="Các hành động nhanh">Actions ▾</button>
  <!-- Các nút thanh trên đổi thứ tự / chữ / màu được ở Template (data-top = id trong UiTemplate.TopButtons); nút thanh công cụ kéo lên
       thanh trên được thêm vào nhóm này lúc chạy (data-top="tool:key"). -->
  <div class="group" id="scriptGroup">
    <button class="btn" data-top="add" data-script="add">Add Script</button>
    <button class="btn" data-top="view" data-script="view">View Script</button>
    <button class="btn" data-top="clear" data-script="clear">Clear Script</button>
    <button class="btn" data-top="save" data-script="save">Save Script</button>
    <button class="btn" data-top="copy" data-script="copy">Copy Script</button>
    <button class="btn" data-top="deploy" id="btnDeploy" title="Công cụ triển khai: Check LCTT / CĐKT, Biên bản, Thiết kế màn hình, Khai báo API, Tạo cấu trúc API">Triển khai ▾</button>
    <button class="btn" data-top="ext" id="btnExt" title="Công cụ mở rộng: Check Include, Tạo báo cáo, Tạo nhanh danh mục">Tool mở rộng ▾</button>
    <button class="btn" data-top="claude" id="btnClaude" data-tool="claude_web" title="Mở Claude trong một tab">Claude</button>
    <button class="btn" data-top="gemini" id="btnGemini" data-tool="gemini_web" title="Mở Gemini trong một tab">Gemini</button>
    <button class="btn" data-top="help" id="btnHelp" data-tool="help" title="Hướng dẫn sử dụng từng tính năng (Ctrl+F1 — mở đúng mục của tab đang dùng)">Trợ giúp</button>
  </div>
  <div class="spacer"></div>
  <div class="ws-group">
    <span class="muted">WS:</span>
    <select id="wsSelect"></select>
    <button class="btn btn-icon" id="btnRefreshDb" title="Refresh database — nạp lại danh sách object / bảng / cột của project hiện tại"><span class="icon icon-refresh"></span></button>
  </div>
  <div class="ws-group" id="dbGroup">
    <button class="btn" id="dbToggleSys" data-db="sys">Sys</button>
    <button class="btn" id="dbToggleApp" data-db="app">App</button>
    <span class="muted" id="dbNameLabel"></span>
  </div>
  <button class="btn btn-icon" id="btnTheme" title="Đổi giao diện sáng/tối"><span class="icon icon-theme dark" id="themeIcon"></span></button>
  <button class="btn btn-icon" id="btnNotify" title="Thông báo y/c FSG: ghi chú mới, đổi trạng thái / hạn, y/c mới giao cho bạn"><span class="bell">🔔</span><span id="notifyCnt" class="ncnt"></span></button>
  <button class="btn btn-pill btn-primary" id="btnQuickAccess" title="Chọn tính năng hiển thị trên toolbar"><span class="icon icon-star"></span>Quick Access</button>

</div>
<script>
  function post(obj) { window.chrome.webview.postMessage(JSON.stringify(obj)); }


  // Báo chiều cao nội dung cho host (px thiết bị) mỗi khi đổi — host chỉnh chiều cao WebView2 theo đó, nên khi cửa sổ hẹp
  // và nội dung xuống dòng thì thanh cao thêm thay vì bị cắt mất phần dưới/phần bên phải.
  (function () {
    var bar = document.getElementById('bar'), last = 0;
    function send() {
      var h = Math.ceil(bar.getBoundingClientRect().height * (window.devicePixelRatio || 1));
      if (h && h !== last) { last = h; post({ action: '__height', height: h }); }
    }
    if (window.ResizeObserver) new ResizeObserver(send).observe(bar);
    window.addEventListener('load', send);
    window.addEventListener('resize', send);
    setTimeout(send, 50);
  })();

  document.getElementById('btnSettings').addEventListener('click', () => post({ action: 'settings' }));
  document.getElementById('btnActions').addEventListener('click', () => post({ action: 'show-actions-menu' }));
  document.getElementById('btnDeploy').addEventListener('click', () => post({ action: 'deploy' }));
  document.getElementById('btnExt').addEventListener('click', () => post({ action: 'ext' }));
  document.getElementById('btnQuickAccess').addEventListener('click', () => post({ action: 'quickaccess' }));
  document.getElementById('btnTheme').addEventListener('click', () => post({ action: 'theme' }));
  document.getElementById('btnNotify').addEventListener('click', () => post({ action: 'notify' }));
  document.getElementById('btnRefreshDb').addEventListener('click', () => post({ action: 'refresh-db' }));
  document.getElementById('dbGroup').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-db]');
    if (btn) { _dbView = btn.getAttribute('data-db'); renderDbLabel(); post({ action: 'select-db', which: _dbView }); }
  });
  document.getElementById('scriptGroup').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-script]');
    if (btn) { post({ action: 'script', which: btn.getAttribute('data-script') }); return; }
    var tool = e.target.closest('[data-tool]');   // Claude / Gemini / Trợ giúp + nút thanh công cụ đã kéo lên thanh trên
    if (tool) post({ action: 'tool', key: tool.getAttribute('data-tool') });
  });
  document.getElementById('wsSelect').addEventListener('change', function (e) {
    setTimeout(function () { e.target.blur(); }, 0); // ô chọn không giữ focus — C# trả focus về vùng làm việc (RestoreContentFocus)
    post({ action: 'select-ws', index: parseInt(e.target.value, 10) });
  });

  // ---- Called from C# (MainForm) ----
  // Template giao diện: sắp lại thứ tự + đổi chữ/font/màu các nút thanh trên. cfg = { order:[id...], items:{ id:{ text, css:{...}, label, tip } } };
  // id "tool:key" = nút thanh công cụ kéo lên thanh trên (label/tip = chữ + tooltip gốc của công cụ).
  window.applyLayout = function (json) {
    var cfg = JSON.parse(json), grp = document.getElementById('scriptGroup'), btns = {}, pos = 0;
    grp.querySelectorAll('[data-top]').forEach(function (b) {
      if (b.dataset.orig === undefined) { b.dataset.orig = b.textContent; b.dataset.pos = pos; }
      pos++;
      btns[b.getAttribute('data-top')] = b;
    });
    var items = cfg.items || {}, ids = [];
    (cfg.order || []).forEach(function (id) {
      if (ids.indexOf(id) >= 0) return;
      if (btns[id] || (id.indexOf('tool:') === 0 && items[id] && items[id].label)) ids.push(id);
    });
    Object.keys(btns).filter(function (id) { return id.indexOf('tool:') !== 0 && ids.indexOf(id) < 0; })
      .sort(function (a, b) { return btns[a].dataset.pos - btns[b].dataset.pos; })
      .forEach(function (id) { ids.push(id); });
    // Nút công cụ không còn trên thanh trên: bỏ đi.
    Object.keys(btns).forEach(function (id) { if (id.indexOf('tool:') === 0 && ids.indexOf(id) < 0) btns[id].remove(); });
    ids.forEach(function (id) {
      var b = btns[id], it = items[id] || {};
      if (!b) {
        b = document.createElement('button');
        b.className = 'btn';
        b.setAttribute('data-top', id);
        b.setAttribute('data-tool', id.slice(5));
      }
      if (it.label) { b.dataset.orig = it.label; b.title = it.tip || it.label; }
      grp.appendChild(b);
      b.textContent = it.text || b.dataset.orig;
      b.removeAttribute('style');
      Object.keys(it.css || {}).forEach(function (k) { b.style[k] = it.css[k]; });
    });
  };

  window.setWorkspaces = function (namesJson) {
    var names = JSON.parse(namesJson);
    var sel = document.getElementById('wsSelect');
    sel.innerHTML = '';
    names.forEach(function (name, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  };

  window.setSelectedWs = function (index) {
    document.getElementById('wsSelect').value = index;
  };

  var _dbNames = { sys: '', app: '' };
  var _dbView = 'app';

  function renderDbLabel() {
    document.getElementById('dbNameLabel').textContent = _dbNames[_dbView] || '';
    document.getElementById('dbToggleSys').classList.toggle('active', _dbView === 'sys');
    document.getElementById('dbToggleApp').classList.toggle('active', _dbView === 'app');
  }

  window.setDbView = function (which) { _dbView = which === 'sys' ? 'sys' : 'app'; renderDbLabel(); };

  window.setDbNames = function (sysDb, appDb) {
    _dbNames.sys = sysDb || '';
    _dbNames.app = appDb || '';
    renderDbLabel();
  };
  // Số thông báo y/c FSG chưa xem (0 = ẩn số).
  window.setNotify = function (n) {
    var el = document.getElementById('notifyCnt');
    el.textContent = n > 0 ? (n > 99 ? '99+' : String(n)) : '';
    document.getElementById('btnNotify').title = (n > 0 ? n + ' thông báo chưa xem — ' : '') + 'Thông báo y/c FSG: ghi chú mới, đổi trạng thái / hạn, y/c mới giao cho bạn';
  };
  window.setTheme = function (isDark) {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('themeIcon').classList.toggle('dark', isDark);
  };
</script>
</body>
</html>
