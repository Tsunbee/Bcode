<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>File preview</title>
  <!-- Khung xem file của File Lookup (MonacoPreviewControl.cs). Monaco, ngôn ngữ fcode-xml, theme.js và
       font đều là file của BcodeViewer (link vào viewer/ lúc build — xem Bcode.App.csproj) nên preview
       tô màu giống hệt khi mở bằng BcodeViewer; theme lấy từ viewer-theme.json do BcodeViewer ghi ra. -->
  <link rel="stylesheet" href="viewer/fonts/roboto.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bc-bg, #1e1e1e); }
    #editor { position: absolute; inset: 0; }
    #message {
      position: absolute; inset: 0; display: none; padding: 16px; box-sizing: border-box;
      color: var(--bc-text-muted, #969696); font: 13px 'Roboto', 'Segoe UI', sans-serif; white-space: pre-wrap;
    }

    /* Ctrl+G: hộp "Go to" (viewer/goto.js) — chép y phần "Ctrl+G" trong BcodeViewer.App/Web/style.css; sửa bên đó thì sửa cả đây. */
    #gotoOverlay { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.25); display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
    #gotoBox { width: 640px; max-width: 94vw; height: 400px; max-height: 80vh; display: flex; flex-direction: column; background: #fff; border: 1px solid #0078d7; outline: none; font: 12px 'Segoe UI', Tahoma, sans-serif; color: #000; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    #gotoTitle { display: flex; align-items: center; gap: 8px; padding: 0 6px; height: 24px; background: #0078d7; color: #fff; }
    #gotoGrip { flex: 1; height: 6px; background-image: radial-gradient(#fff6 1px, transparent 1px); background-size: 3px 3px; opacity: .6; }
    #gotoClose { cursor: pointer; padding: 0 4px; }
    #gotoClose:hover { background: #e81123; }
    #gotoHead { display: flex; background: #333; color: #fff; font-weight: 600; height: 20px; line-height: 20px; }
    #gotoHead .gotoColTag { width: 135px; flex: 0 0 135px; padding-left: 2px; }
    #gotoHead .gotoColDetail { flex: 1 1 auto; padding-left: 4px; margin-left: 3px; }
    #gotoBody { flex: 1 1 auto; display: flex; min-height: 0; background: #333; gap: 3px; }
    #gotoTags { width: 135px; flex: 0 0 135px; background: #fff; overflow: auto; }
    #gotoDetails { flex: 1 1 auto; background: #fff; overflow: auto; }
    .gotoRow { display: flex; align-items: center; justify-content: space-between; height: 22px; padding: 0 4px; cursor: default; white-space: nowrap; user-select: none; }
    .gotoRow.sel { background: #0078d7; color: #fff; }
    .gotoDot { font-size: 9px; margin-right: 2px; }
    .gotoEmpty { padding: 6px; color: #888; }
    .gotoRow.hot { font-weight: 700; border-left: 3px solid transparent; }
    .gotoRow.hota { color: #b86e00; border-left-color: #e5a00d; }
    .gotoRow.hotb { color: #d32f2f; border-left-color: #f14c4c; }
    .gotoRow.hot.sel { color: #fff; }
    .gotoHotText { font-weight: 700; }
    .gotoHota { color: #e5a00d !important; }
    .gotoHotb { color: #f14c4c !important; }
    .gotoHotLinea { background: rgba(229, 160, 13, .12); }
    .gotoHotLineb { background: rgba(241, 76, 76, .12); }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="message"></div>

  <script src="viewer/vs/loader.js"></script>
  <script src="viewer/theme.js"></script>
  <script src="viewer/fcode-language.js"></script>
  <script src="viewer/goto.js"></script>
  <script>
    const post = (msg) => { try { window.chrome.webview.postMessage(JSON.stringify(msg)); } catch { /* host gone */ } };

    // Same mapping as BcodeViewer's editor.js detectLanguage.
    function detectLanguage(path, content) {
      const ext = (path || '').slice((path || '').lastIndexOf('.')).toLowerCase();
      switch (ext) {
        case '.xml': case '.f': case '.ent': case '.txt':
          if (!window.fcodeReady) return 'xml';
          return ext === '.txt' && window.detectFcodeVariantLanguage
            ? window.detectFcodeVariantLanguage(content)
            : window.FCODE_LANGUAGE_ID;
        case '.sql': return 'sql';
        case '.js': return 'javascript';
        case '.aspx': case '.html': return 'html';
        case '.json': return 'json';
        case '.css': return 'css';
        default: return 'plaintext';
      }
    }

    let editor = null;
    let pending = null;

    function showMessage(text) {
      const el = document.getElementById('message');
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
      document.getElementById('editor').style.visibility = text ? 'hidden' : 'visible';
    }

    function load(msg) {
      if (!editor) { pending = msg; return; }
      const old = editor.getModel();
      if (msg.type === 'message') {
        editor.setModel(null);
        if (old) old.dispose();
        showMessage(msg.text);
        return;
      }
      showMessage('');
      // A fresh model per file: undo history and decorations of the previous file go with it.
      const model = monaco.editor.createModel(msg.content || '', detectLanguage(msg.path, msg.content || ''));
      model.setEOL(monaco.editor.EndOfLineSequence.LF); // host resolves F12 offsets against '\n' text
      editor.setModel(model);
      if (old) old.dispose();
      editor.setScrollPosition({ scrollTop: 0, scrollLeft: 0 });
    }

    function onHostMessage(e) {
      let msg = e.data;
      if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
      if (!msg) return;
      switch (msg.type) {
        case 'theme': window.bcodeTheme.apply(msg.theme || window.bcodeTheme.theme); if (editor) editor.updateOptions({ fontFamily: window.bcodeTheme.fontFamily }); break;
        case 'load': case 'message': load(msg); break;
        case 'find': if (editor) { editor.focus(); editor.getAction('actions.find').run(); } break;
        case 'reveal':
          if (editor && editor.getModel()) {
            const pos = editor.getModel().getPositionAt(msg.offset || 0);
            editor.setPosition(pos);
            editor.revealPositionInCenter(pos);
            editor.focus();
          }
          break;
      }
    }
    window.chrome.webview.addEventListener('message', onHostMessage);

    require.config({ paths: { vs: 'viewer/vs' } });
    // Until viewer-theme.json arrives (or when BcodeViewer has never written it): BcodeViewer's own
    // default, Dark+, including its SQL rules — theme.js's bare FALLBACK has no rules, which leaves
    // Monaco's base string.sql pure red (#FF0000) on every SQL string.
    window.bcodeTheme.theme = Object.assign({}, window.bcodeTheme.theme, {
      rules: [
        { token: 'string.sql', foreground: 'CE9178' },
        { token: 'predefined.sql', foreground: 'DCDCAA' },
        { token: 'operator.sql', foreground: 'D4D4D4' },
      ],
    });

    require(['vs/editor/editor.main'], async function () {
      window.bcodeTheme.apply(window.bcodeTheme.theme);
      window.fcodeReady = await window.registerFcodeLanguage();

      editor = monaco.editor.create(document.getElementById('editor'), {
        theme: window.bcodeTheme.monacoThemeName,
        automaticLayout: true,
        readOnly: true,
        domReadOnly: true,
        fontFamily: window.bcodeTheme.fontFamily,
        fontSize: 15,
        minimap: { enabled: true },
        mouseWheelZoom: true,
        bracketPairColorization: { enabled: true },
        scrollBeyondLastLine: false,
        renderValidationDecorations: 'off',
        contextmenu: true,
      });
      if (document.fonts && document.fonts.load) {
        document.fonts.load("15px 'Roboto'").catch(() => {}).then(() => monaco.editor.remeasureFonts());
      }

      // F12 / Ctrl+F12 / Ctrl+click: resolved host-side by the same code as the old preview
      // (ScriptEditorControl.ResolveF12) — it reads Include files from disk.
      const f12 = (pos, withSelection) => {
        const model = editor.getModel();
        if (!model || !pos) return;
        const msg = { action: 'f12', offset: model.getOffsetAt(pos) };
        // F12 (phím) kèm vùng bôi đen: host dùng để xem trước nhiều entity cùng lúc.
        const sel = withSelection ? editor.getSelection() : null;
        if (sel && !sel.isEmpty()) { msg.selStart = model.getOffsetAt(sel.getStartPosition()); msg.selEnd = model.getOffsetAt(sel.getEndPosition()); }
        post(msg);
      };
      editor.addCommand(monaco.KeyCode.F12, () => f12(editor.getPosition(), true));
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.F12, () => f12(editor.getPosition(), false));
      // Ctrl+G — hộp "Go to" của BcodeViewer (viewer/goto.js: TAG fields / command / script / response / css / ENTITY + DETAIL,
      // tô cam/đỏ mục hay dùng cả trong hộp lẫn trong editor), thay Monaco go-to-line — 2 bên giống hệt nhau.
      // goto.js cần: editor, currentModel, revealPosition và bộ hẹn giờ window.bcodeTyping của Viewer (ở đây chỉ cần hẹn giờ thường).
      const typingTimers = {};
      window.bcodeTyping = window.bcodeTyping || { request: (id, fn, delay) => { clearTimeout(typingTimers[id]); typingTimers[id] = setTimeout(fn, delay); } };
      const gotoBox = new BcodeGoto({
        editor,
        get currentModel() { return editor.getModel(); },
        revealPosition(line, column) {
          editor.setPosition({ lineNumber: line, column });
          editor.revealPositionInCenter({ lineNumber: line, column });
          editor.focus();
        },
      });
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyG, () => gotoBox.open());
      editor.onMouseDown((e) => {
        if (e.event.ctrlKey && e.event.leftButton && e.target.position) f12(e.target.position);
      });

      if (pending) { load(pending); pending = null; }
      post({ action: 'ready' });
    });
  </script>
</body>
</html>
