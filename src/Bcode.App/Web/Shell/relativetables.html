<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shell.css" />
<style>
  /* View Relative Tables (như FCode): danh sách bảng liên quan tới một chứng từ (cột trái). Bấm bảng / huy hiệu = nạp vào lưới bên phải (xem tại chỗ);
     chuột phải = Mở sang tab mới / chép. */
  /* Theo Template giao diện: font / cỡ chữ (--ui-font, --ui-font-size), ô nhập (--input-*), viền (--bw), bo góc (--r), mật độ (--dens) và bảng màu
     đều lấy từ shell.css + biến Template C# đẩy vào trang — KHÔNG tự đặt cỡ chữ / màu cứng ở đây. Nền = --panel như cây menu bên trái. */
  body { display: flex; flex-direction: column; background: var(--panel); }
  header { flex: none; padding: calc(.5rem * var(--dens)) .8rem; border-bottom: var(--bw) solid var(--border); min-width: 0; }
  header .ttl { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .4rem; min-width: 0; }
  header .code { font-size: 1.1rem; font-weight: 700; color: var(--accent); overflow-wrap: anywhere; }
  header .nm { color: var(--text-muted); font-size: .88rem; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-top: .35rem; }
  .bg { font-size: .76rem; padding: .05rem .5rem; border-radius: var(--r); color: #fff; font-weight: 600; white-space: nowrap; outline: 2px solid transparent; outline-offset: 1px; }
  .bg.c { background: #ab0a0a; } .bg.m { background: #07a347; } .bg.d { background: #045ebf; } .bg.i { background: #96039c; }
  .bg.clk { cursor: pointer; }
  .bg.clk:hover { outline-color: var(--accent); }
  .bg.sel { outline-color: var(--text); }
  .url { margin-top: .3rem; color: var(--text-muted); font-size: .76rem; overflow-wrap: anywhere; }
  #flt { width: 100%; margin-top: .45rem; }   /* màu / viền / chữ: style ô nhập chuẩn của shell.css (theo Template) */
  #status { color: var(--text-muted); font-size: .85em; margin-top: .3rem; }
  #warn { flex: none; color: var(--accent); font-size: .85em; padding: .3rem .8rem 0; overflow-wrap: anywhere; }
  #warn:empty { display: none; }
  main { flex: 1; min-height: 0; overflow: auto; padding: .3rem .4rem 1rem; }
  .grp { margin-bottom: .5rem; }
  .gh { font-size: .74rem; letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); margin: .3rem .3rem .25rem; display: flex; gap: .4rem; align-items: baseline; }
  .gh .n { color: var(--text); background: var(--button-back); border-radius: 999px; padding: 0 .45rem; font-size: .72rem; }
  .row { display: flex; align-items: center; gap: .4rem; padding: calc(.26rem * var(--dens)) .45rem; border-radius: var(--r); cursor: pointer; min-width: 0; }
  .row:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .row.sel { background: var(--selection); box-shadow: inset 3px 0 0 var(--accent); }
  .row .tb { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .db { flex: none; font-size: .7rem; color: var(--text-muted); }
  .row .cnt { flex: none; font-size: .72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .msg { color: var(--text-muted); padding: .5rem .4rem; font-size: .88rem; }
  #menu { position: fixed; z-index: 50; min-width: 13rem; max-width: calc(100vw - 8px); background: var(--panel); border: var(--bw) solid var(--accent); border-radius: var(--r-lg); box-shadow: 0 8px 26px rgba(0,0,0,.5); padding: .25rem 0; display: none; }
  #menu .cap { padding: .3rem 1rem .1rem; color: var(--accent); font-size: .8rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu .it { padding: .3rem 1rem; cursor: pointer; white-space: nowrap; }
  #menu .it:hover { background: var(--selection); }
  #menu hr { border: none; border-top: 1px solid var(--border); margin: .25rem 0; }
  .tip { flex: none; padding: .3rem .8rem; color: var(--text-muted); font-size: .76rem; border-top: var(--bw) solid var(--border); }
</style>
</head>
<body data-area="editor">
<header>
  <div class="ttl"><span class="code" id="code">…</span><span class="nm" id="nm"></span></div>
  <div class="badges" id="badges"></div>
  <div class="url" id="url"></div>
  <input id="flt" type="text" placeholder="Lọc tên bảng…" spellcheck="false" autocomplete="off">
  <div id="status"></div>
</header>
<div id="warn"></div>
<main id="main"><div class="msg">Đang tra…</div></main>
<div class="tip">Bấm bảng / nhãn c$ m$ d$ i$ = xem tại chỗ (lưới bên phải) · Chuột phải = Mở sang tab mới / chép.</div>
<div id="menu"></div>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const post = (action, extra) => window.chrome.webview.postMessage(JSON.stringify(Object.assign({ action }, extra || {})));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let data = null, selKey = '';
  const items = {};   // key ('r<i>' = dòng bảng, 'b<k>' = huy hiệu) → { key, sys, table, where }
  let counts = {};    // số dòng theo WHERE từng bảng (nạp nền từ host), key = ckOf(t)
  const ckOf = (t) => (t.sys ? 'S' : 'A') + '|' + t.table + '|' + t.where;
  const fmtCount = (t) => { const k = ckOf(t); if (!(k in counts)) return '…'; const n = Number(counts[k]); return n < 0 ? '?' : n.toLocaleString('vi-VN') + ' dòng'; };

  const q = () => $('flt').value.trim().toLowerCase();
  const match = (t) => !q() || t.table.toLowerCase().includes(q());

  function groupHtml(title, list) {
    if (!list.length) return '';
    const v = list.filter(match);
    const rows = v.length
      ? v.map((t) => `<div class="row${t.key === selKey ? ' sel' : ''}" data-k="${t.key}" title="${esc(t.table + '\nWHERE ' + t.where)}"><span class="tb">${esc(t.table)}</span><span class="cnt">${esc(fmtCount(t))}</span><span class="db">${t.sys ? 'Sys' : 'App'}</span></div>`).join('')
      : `<div class="msg">Không bảng nào khớp ô lọc.</div>`;
    return `<div class="grp"><div class="gh">${esc(title)} <span class="n">${q() ? v.length + '/' + list.length : list.length}</span></div>${rows}</div>`;
  }

  function render() {
    if (!data) return;
    $('code').textContent = data.voucherCode ? data.voucherCode + (data.sysId ? ' - ' + data.sysId : '') : (data.sysId || '…');
    $('nm').textContent = data.voucherName ? '/ ' + data.voucherName : '';
    $('badges').innerHTML = data.badges.map((b) => `<span class="bg ${esc(b.kind)} clk${b.key === selKey ? ' sel' : ''}" data-k="${b.key}"`
      + ` title="${esc('Bấm = xem bảng ' + b.table + (b.where ? ' (' + b.where + ')' : '') + ' tại chỗ · Chuột phải = Mở sang tab mới')}">${esc(b.text)}</span>`).join('');
    $('url').textContent = data.url ? 'URL: ' + data.url : '';
    $('warn').innerHTML = (data.warnings || []).map((w) => '⚠ ' + esc(w)).join('<br>');
    const app = data.tables.filter((t) => !t.sys), sys = data.tables.filter((t) => t.sys);
    const total = data.tables.length;
    $('status').textContent = total ? `${total} bảng liên quan · ${app.length} App · ${sys.length} Sys` : '';
    $('main').innerHTML = total
      ? groupHtml('App Data', app) + groupHtml('Sys Data', sys)
      : '<div class="msg">Không có bảng liên quan nào tồn tại trong database.</div>';
  }

  function select(t) { selKey = t.key; render(); post('open', { sys: t.sys, table: t.table, where: t.where }); }

  // ---- menu chuột phải (dòng bảng + huy hiệu) ----
  let menuFns = [];
  function showMenu(e, t) {
    e.preventDefault();
    const m = $('menu');
    const list = [
      { label: 'Mở sang tab mới', fn: () => post('opennew', { sys: t.sys, table: t.table, where: t.where }) },
      { sep: 1 },
      { label: 'Xem tại chỗ', fn: () => select(t) },
      { sep: 1 },
      { label: 'Chép tên bảng', fn: () => post('copy', { text: t.table }) },
    ];
    if (t.where) list.push({ label: 'Chép điều kiện (WHERE)', fn: () => post('copy', { text: t.where }) });
    menuFns = [];
    m.innerHTML = `<div class="cap" title="${esc(t.table)}">${esc(t.table)}</div>` + list.map((x) => {
      if (x.sep) return '<hr>';
      menuFns.push(x.fn);
      return `<div class="it" data-i="${menuFns.length - 1}">${esc(x.label)}</div>`;
    }).join('');
    m.style.display = 'block';
    const r = m.getBoundingClientRect();
    m.style.left = Math.max(4, Math.min(e.clientX, innerWidth - r.width - 4)) + 'px';
    m.style.top = Math.max(4, Math.min(e.clientY, innerHeight - r.height - 4)) + 'px';
  }
  const hideMenu = () => { $('menu').style.display = 'none'; };
  $('menu').addEventListener('click', (e) => { const it = e.target.closest('.it'); if (!it) return; hideMenu(); menuFns[+it.dataset.i](); });
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('#menu')) hideMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideMenu(); }, true);
  window.addEventListener('blur', hideMenu);
  $('main').addEventListener('scroll', hideMenu);

  const itemAt = (e) => { const el = e.target.closest('[data-k]'); return el ? items[el.dataset.k] : null; };
  for (const host of [$('main'), $('badges')]) {
    host.addEventListener('click', (e) => { const t = itemAt(e); if (t) select(t); });
    host.addEventListener('contextmenu', (e) => { const t = itemAt(e); if (t) showMenu(e, t); else e.preventDefault(); });
  }
  $('flt').addEventListener('input', render);

  // ---- gọi từ C# ----
  window.relativetables = {
    init(d) {
      data = d;
      counts = {};
      for (const k of Object.keys(items)) delete items[k];
      data.tables = (data.tables || []).map((t, i) => (items['r' + i] = Object.assign({ key: 'r' + i }, t)));
      data.badges = (data.badges || []).map((b, i) => (items['b' + i] = Object.assign({ key: 'b' + i, sys: false }, b)));
      selKey = '';
      render();
    },
    setCounts(m) { Object.assign(counts, m || {}); render(); },
    onLoading() { $('main').innerHTML = '<div class="msg">Đang tra…</div>'; $('status').textContent = 'Đang tra…'; },
    onError(m) { $('status').textContent = ''; $('main').innerHTML = '<div class="msg" style="color:var(--danger)">Lỗi: ' + esc(m) + '</div>'; },
  };
  window.setTheme = (dark) => document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  post('ready');
})();
</script>
</body>
</html>
